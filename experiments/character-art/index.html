<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auvra Club | Character Lab</title>
<style>body{margin:0;background:#17191e;color:#eee;font:15px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:16px;left:16px;z-index:2;background:#17191ee8;padding:16px;border-radius:12px;max-width:280px}h1{font-size:18px;margin:0 0 12px}label{display:block;margin:8px 0}select{background:#30343d;color:white;padding:6px;border:1px solid #555;border-radius:5px}small{color:#bbb}</style>
<header><h1>AUVRA / Character Lab</h1><label>Biotipo <select id="build"><option>A</option><option>B</option></select></label><label>Pele <select id="skin"><option value="0xe2b893">Clara</option><option value="0xb07a50">Média</option><option value="0x5f3c25">Escura</option></select></label><label>Roupa <select id="outfit"><option value="suit">Terno</option><option value="casual">Casual</option></select></label><small>Arraste para girar. Protótipo procedural, não integrado ao jogo.</small><p id="status"></p></header>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
import {headShape,torsoShape,limbShape} from './character-shapes.mjs';
const scene=new T.Scene();scene.background=new T.Color(0x252831);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,30);function frameCamera(){const distance=Math.max(3.6,3.6/(camera.aspect||1));camera.position.set(0,1.15,distance);camera.lookAt(0,.95,0)}frameCamera();
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xe9efff,0x625043,2));const light=new T.DirectionalLight(0xffecd6,3);light.position.set(3,5,4);scene.add(light);const rim=new T.DirectionalLight(0xaacaff,2);rim.position.set(-3,2,-3);scene.add(rim);
const root=new T.Group();scene.add(root);const floor=new T.Mesh(new T.CircleGeometry(1.2,48),new T.MeshStandardMaterial({color:0x44464b}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.78});
function add(g,c,x=0,y=0,z=0,sx=1,sy=1,sz=1){const m=new T.Mesh(g,mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);root.add(m);return m}
const sphere=(c,x,y,z,a,b,d)=>add(new T.SphereGeometry(1,20,14),c,x,y,z,a,b,d);
const box=(c,x,y,z,a,b,d)=>add(new T.BoxGeometry(a,b,d),c,x,y,z);
function rebuild(){for(const m of [...root.children]){root.remove(m);m.geometry.dispose();m.material.dispose()}
const b=document.querySelector('#build').value,skin=Number(document.querySelector('#skin').value),suit=document.querySelector('#outfit').value==='suit',cloth=suit?0x202b3c:0xd4d0c7,pants=0x262a30,hair=0x30241c;
add(headShape(T,b),skin);add(torsoShape(T,b,suit),cloth);
sphere(skin,0,1.53,0,.048,.075,.049);sphere(skin,0,1.65,.091,.016,.033,.027);sphere(skin,0,1.632,.11,.019,.014,.014);
for(const s of [-1,1]){sphere(skin,s*.09,1.656,0,.014,.025,.016);sphere(0xe8e4de,s*.035,1.68,.084,.018,.008,.009);sphere(0x382a22,s*.035,1.68,.092,.006,.007,.003);sphere(hair,s*.035,1.699,.086,.02,.004,.005)}
sphere(0x935c50,0,1.61,.079,.026,.006,.008);
add(new T.SphereGeometry(1,24,14,0,Math.PI*2,0,Math.PI*.48),hair,0,1.69,-.01,.099,.095,.102);
sphere(hair,0,1.68,-.055,.087,.081,.052);
if(b===\x27B\x27){sphere(hair,0,1.60,-.075,.092,.13,.052);sphere(hair,0,1.73,-.105,.045,.043,.043)}
sphere(pants,0,.99,0,.15,.11,.095);
for(const s of [-1,1]){const x=s*.21;add(limbShape(T,'upperArm'),cloth,x,1.15,0);add(limbShape(T,'forearm'),suit?cloth:skin,x,.89,0);sphere(skin,x,.84,.006,.027,.053,.022);add(limbShape(T,'thigh'),pants,s*.095,.49,0);add(limbShape(T,'shin'),pants,s*.095,.07,0);sphere(0x15171b,s*.095,.04,.045,.048,.04,.11)}
if(suit){for(const s of [-1,1]){box(0xece9e2,s*.21,.91,0,.075,.024,.065);box(0x121820,s*.075,1.19,.098,.065,.008,.012)}box(0xece9e2,0,1.34,.106,.087,.24,.015);box(0x6b2430,0,1.34,.119,.025,.23,.009);for(const s of [-1,1]){const m=box(0x151e2b,s*.057,1.35,.112,.042,.23,.012);m.rotation.z=s*.24}}
document.querySelector('#status').textContent=root.children.reduce((n,m)=>n+(m.geometry.index?m.geometry.index.count:m.geometry.attributes.position.count)/3,0).toLocaleString('pt-BR')+' triângulos';}
for(const el of document.querySelectorAll('select'))el.addEventListener('change',rebuild);rebuild();
let drag=false,last=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){root.rotation.y+=(e.clientX-last)*.012;last=e.clientX}});for(const ev of ['pointerup','pointercancel'])renderer.domElement.addEventListener(ev,()=>drag=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();frameCamera();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></html>
