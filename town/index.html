<style>
  :root{
    --bg:#0e0b08; --glass:rgba(16,12,9,.78); --glass2:rgba(28,21,15,.9); --line:rgba(232,192,96,.32);
    --wood:#4a3524; --wood2:#3a2919; --wood-edge:#241810; --wood-hi:#6a4d33;
    --cream:#f4ead6; --dim:#c3b392; --gold:#e8c060; --gold2:#c89a3a; --green:#8fd07a; --red:#ef8a6a; --blue:#8fc8ff;
    --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right); --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  button{font:inherit;color:inherit}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .panel{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45);padding:8px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #hud.off{display:none}
  /* ---------- HUD (pensado para celular na horizontal) ---------- */
  .hud-top{top:calc(8px + var(--st));left:calc(8px + var(--sl));display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px;padding:6px 12px;max-width:calc(100vw - 330px);flex-wrap:wrap;row-gap:2px}
  .res{white-space:nowrap}
  .quest{top:calc(52px + var(--st));left:calc(8px + var(--sl));max-width:min(300px,34vw);padding:6px 10px}
  .quest .t{color:var(--gold);font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .quest .q{font-size:13px;font-weight:700;line-height:1.25}
  .hud-day{top:calc(8px + var(--st));right:calc(8px + var(--sr));text-align:right;font-weight:700;font-size:13px;padding:6px 10px;width:214px}
  .hud-day .ph{color:var(--gold);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
  .dprog{height:3px;background:#241810;border-radius:3px;margin:4px 0;overflow:hidden}.dprog i{display:block;height:100%;width:0;background:var(--gold)}
  #speed{display:flex;gap:3px;justify-content:flex-end;align-items:center}

  #speed button.on{background:var(--gold);color:#2a1d12;border-color:var(--gold)}
  #menuBtn{margin-left:4px;background:var(--gold)!important;color:#2a1d12!important;font-weight:800}
  .net{font-size:10.5px;color:var(--dim);margin-top:3px}
  .mini{top:calc(104px + var(--st));right:calc(8px + var(--sr));width:112px;height:112px;padding:4px}
  .mini canvas{width:100%;height:100%;border-radius:8px;display:block}
  .obj{display:none}
  /* joystick */
  #joy{position:fixed;left:calc(18px + var(--sl));bottom:calc(18px + var(--sb));width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.14));border:2px solid rgba(232,192,96,.35);touch-action:none;z-index:5}
  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f6dc94,#c89a3a);box-shadow:0 3px 10px rgba(0,0,0,.5);pointer-events:none}
  @media (pointer:fine){#joy{display:none}}
  /* barra de ferramentas (centro-baixo) */

  #actLbl.on{display:block} #actLbl small{display:block;color:var(--dim);font-weight:400;font-size:11px}

  /* ---------- modais / painéis (economia) ---------- */

  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,92vw);max-height:calc(100dvh - 24px - var(--st) - var(--sb));overflow:auto;z-index:61;background:var(--glass2);padding:12px 14px}
  .mh{color:var(--gold);font-weight:800;font-size:17px;margin-bottom:8px}
  .mb{font-size:14px;line-height:1.4} .mb p{margin:4px 0}
  .mact{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .mbtn{background:linear-gradient(#3a2c1f,#271c13);border:1px solid var(--line);border-radius:9px;padding:9px 11px;text-align:left;cursor:pointer;font:inherit;color:var(--cream)}
  .mbtn:active{filter:brightness(1.15)} .mbtn b{display:block;font-size:14px} .mbtn span{display:block;font-size:11.5px;color:var(--dim)}
  .mbtn.dis{opacity:.5;cursor:not-allowed}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:6px 0}
  .kpi{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  .kpi .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px} .kpi .v{font-size:16px;font-weight:800}
  .tag{display:inline-block;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;margin-right:4px;color:var(--dim)}
  .lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-bottom:1px dashed rgba(232,192,96,.18);cursor:pointer;font-size:13px}
  .dim{color:var(--dim)} .small{font-size:12px;color:var(--dim)}
  .lab{display:flex;justify-content:space-between;font-size:12.5px;margin:6px 0 3px}
  .bar{height:8px;background:#241810;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c89a3a,#e8c060);border-radius:5px}.bar.g i{background:linear-gradient(90deg,#5aa04a,#8fd07a)}
  .sec{color:var(--gold);font-size:11px;letter-spacing:1px;margin:12px 0 2px;font-weight:700}
  .sbtn{background:#241a12;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;margin-left:4px;color:var(--cream)}
  .chat{max-height:150px;overflow:auto;background:rgba(0,0,0,.3);border-radius:8px;padding:6px;font-size:12.5px;margin-top:4px;user-select:text;-webkit-user-select:text}
  .chatin{display:flex;gap:4px;margin-top:5px}
  input[type=text],.chatin input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:8px;font:inherit;user-select:text;-webkit-user-select:text}
  /* ---------- MENU PRINCIPAL ---------- */
  #menu{position:fixed;inset:0;z-index:40;display:flex;pointer-events:none}
  #menu.off{display:none}
  #menu .nav{pointer-events:auto;width:236px;height:100%;padding:calc(14px + var(--st)) 14px calc(12px + var(--sb)) calc(14px + var(--sl));background:linear-gradient(90deg,rgba(10,7,5,.92),rgba(10,7,5,.72));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .logo{color:var(--gold);font-weight:900;font-size:26px;letter-spacing:.5px;line-height:1}.logo small{display:block;color:var(--dim);font-size:10px;letter-spacing:2px;font-weight:700;margin-top:4px;text-transform:uppercase}
  .nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-weight:700;font-size:14px;cursor:pointer}
  .nb .e{font-size:18px;width:22px;text-align:center}
  .nb.on{border-color:var(--gold);background:rgba(232,192,96,.12)}
  .nb.play{background:linear-gradient(#f1cf7a,#c89a3a);color:#2a1d12;font-size:15px;justify-content:center;padding:11px}
  .nb.play small{font-weight:600;font-size:10.5px;opacity:.8}
  .nb.dis{opacity:.4;pointer-events:none}
  #menu .page{pointer-events:auto;margin:calc(12px + var(--st)) 12px calc(12px + var(--sb)) 12px;width:min(560px,calc(100vw - 280px - var(--sl) - var(--sr)));max-height:calc(100% - 24px - var(--st) - var(--sb));overflow-y:auto;align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:none}
  #menu .page.on{display:block} #menu .page.narrow{width:min(360px,calc(100vw - 280px))}
  .ph1{color:var(--gold);font-size:18px;font-weight:800;margin-bottom:8px}
  .pcard{margin-top:auto;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45}
  .pcard b{color:var(--gold)}
  .opt{margin:10px 0 4px;font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{min-width:34px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 8px;background:#2a2018}
  .chip.sw{width:34px;padding:0}.chip.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,192,96,.35)}
  .rng{width:100%;accent-color:#e8c060}
  .seg{display:flex;gap:4px}.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#241a12;font-weight:700;cursor:pointer}.seg button.on{background:var(--gold);color:#2a1d12}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(232,192,96,.16);font-size:13.5px}
  .chart{width:100%;height:150px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;margin:6px 0}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px dashed rgba(232,192,96,.16);text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl th{color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase}
  .hero-title{position:fixed;right:calc(24px + var(--sr));bottom:calc(20px + var(--sb));text-align:right;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .hero-title b{display:block;color:var(--gold);font-size:34px;font-weight:900;letter-spacing:.5px}.hero-title span{color:var(--cream);font-size:13px;opacity:.9}
  @media (max-height:430px){ .nb{padding:7px 9px;font-size:13px}.logo{font-size:22px}.nav{gap:4px!important} .hero-title b{font-size:26px} }
  @media (max-width:760px){ #menu .nav{width:200px} #menu .page{width:calc(100vw - 230px - var(--sl) - var(--sr))} #menu .page.narrow{width:min(320px,calc(100vw - 230px))} .hud-top{max-width:calc(100vw - 250px);font-size:12.5px;gap:8px} .hud-day{width:190px} .mini{display:none} .tool{width:50px}.tray{max-width:calc(100vw - 40px)} }
  @media (max-height:380px){ .quest{display:none} #joy{width:116px;height:116px} #actBtn{width:80px;height:80px} }
  /* ---------- telas de sistema ---------- */
  #rotate{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  #rotate .ph{font-size:64px;animation:rot 2.2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }
  #loading{position:fixed;inset:0;z-index:150;background:radial-gradient(ellipse at center,#2a2014,#0e0b08 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #loading.off{display:none}
  #loading .lb{width:220px;height:6px;border-radius:4px;background:#241810;overflow:hidden}#loading .lb i{display:block;height:100%;width:30%;background:var(--gold);animation:ld 1.2s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  #fatal{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
  #fatal[hidden]{display:none}
  #fatal button{background:var(--gold);color:#2a1d12;border:0;border-radius:10px;padding:10px 18px;font-weight:800}

<body>
<canvas id="c" tabindex="0"></canvas>

<div id="hud" class="off">
  <div class="panel hud-top" id="hudTop"></div>
  <div class="panel quest"><div class="t">Missão</div><div class="q" id="questTxt"></div></div>
  <div class="panel hud-day"><div id="dayTxt">Dia 1</div><div class="ph" id="phaseTxt"></div><div class="dprog"><i id="dayProg"></i></div>
    <div id="speed"><button data-s="0" title="Pausar">⏸</button><button data-s="1" title="1×">▶</button><button data-s="2" title="2×">▶▶</button><button data-s="4" title="4×">⏩</button><button id="menuBtn" title="Menu">☰</button></div>
    <div class="net" id="netState">⚪ offline</div></div>
  <div class="panel mini"><canvas id="mini" width="224" height="224"></canvas></div>
  <div class="panel obj" id="objPanel"></div>
  <div id="joy"><div id="joyKnob"></div></div>

  <div id="actLbl"></div>
  <button id="actBtn"><span class="ai"></span><span class="al"></span></button>

</div>
<div class="panel tray" id="tray"></div>
<div class="hint" id="hint"></div>
<div id="toast"></div>
<div id="menu" class="off"></div>

<div id="rotate"><div class="ph">📱</div><b style="color:var(--gold);font-size:20px">Gire o celular</b><div class="small">Auvra Club é jogado na horizontal.</div></div>
<div id="loading"><b style="color:var(--gold);font-size:26px;letter-spacing:.5px">Auvra Club</b><div class="small" id="loadTxt">Construindo Meridian em 3D…</div><div class="lb"><i></i></div></div>
<div id="fatal" hidden><b style="color:var(--gold);font-size:20px">Não deu para abrir Meridian</b><p class="small"></p><button onclick="location.reload()">Tentar de novo</button></div>

<script>
/* Rede de segurança (script clássico: roda mesmo se o módulo 3D falhar ao baixar). */
window.__fail=function(msg){var f=document.getElementById('fatal');if(f){f.hidden=false;f.querySelector('p').textContent=msg;}var l=document.getElementById('loading');if(l)l.className='off';};
setTimeout(function(){if(!window.__townReady)window.__fail('O motor 3D não carregou. Confira a internet (na primeira vez o jogo baixa cerca de 1 MB) e toque em Tentar de novo.');},25000);
</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
/* ============================================================
   Auvra Club — Wall Street, Lower Manhattan · 3D em terceira pessoa (Three.js)
   O traçado segue o real (Broadway, Wall, Nassau/Broad, William, Pearl, Water, South St,
   Pine, Exchange Pl, Beaver) com quarteirões comprimidos para caber no jogo.
   A economia (bloco @ECON) continua num grid lógico de tiles: 1 tile = 48 "px" lógicos = 4 m.
   ============================================================ */
const cv=document.getElementById('c');
const TILE=48, TS=4, MAPW=72, MAPH=48;
const M=v=>v/TILE*TS, PX=v=>v/TS*TILE;      // px lógicos <-> metros
const T={LOT:0,ROAD:1,PED:2,WATER:3,PARK:4,WALK:5,BLD:6};
const BSPRITES={office:{wt:2,ht:2},startup:{wt:2,ht:2},factory:{wt:3,ht:2},cafe:{wt:2,ht:2},hq:{wt:2,ht:2}};
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');return {c,g};}
function rngSeed(s){s=(s|0)||1;return ()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
function tileHash(x,y,n){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177;h^=h>>>16;return ((h>>>0)%n+n)%n;}
function readJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0);

function footprintFree(type,gx,gy){const s=BSPRITES[type];for(let y=gy;y<gy+s.ht;y++)for(let x=gx;x<gx+s.wt;x++){if(x<0||y<0||x>=MAPW||y>=MAPH)return false;if(map[y][x]!==T.LOT)return false;}

function faceOf(gx,gy,w,h){ // lado com calçada/rua; prioriza a rua mais "nobre" (Wall St / ruas largas)
  const score=(tiles)=>{let s=0;for(const [x,y] of tiles){const t=tileAt(x,y);if(t===T.WALK||t===T.PED||t===T.ROAD)s+=1;}return s;};
  const S_=[],N_=[],E_=[],W_=[];for(let x=gx;x<gx+w;x++){S_.push([x,gy+h]);N_.push([x,gy-1]);}for(let y=gy;y<gy+h;y++){E_.push([gx+w,y]);W_.push([gx-1,y]);}
  const c=[['s',score(S_)],['n',score(N_)],['e',score(E_)],['w',score(W_)]];c.sort((a,b)=>b[1]-a[1]);return c[0][1]>0?c[0][0]:'s';}
function placeBuilding(type,gx,gy){const s=BSPRITES[type];const b={type,gx,gy,face:faceOf(gx,gy,s.wt,s.ht)};buildings.push(b);return b;}
function buildingAt(gx,gy){for(const b of buildings){const s=BSPRITES[b.type];if(gx>=b.gx&&gx<b.gx+s.wt&&gy>=b.gy&&gy<b.gy+s.ht)return b;}return null;}
function bFront(b){const s=BSPRITES[b.type];const f=b.face||'s';
  if(f==='s')return [(b.gx+s.wt/2)*TILE,(b.gy+s.ht+0.55)*TILE];if(f==='n')return [(b.gx+s.wt/2)*TILE,(b.gy-0.55)*TILE];
  if(f==='e')return [(b.gx+s.wt+0.55)*TILE,(b.gy+s.ht/2)*TILE];return [(b.gx-0.55)*TILE,(b.gy+s.ht/2)*TILE];}
function spawnWorker(b,co){const [fx,fy]=bFront(b);const w={x:fx+(Math.random()*2-1)*TILE*0.8,y:fy,tx:0,ty:0,spd:PX(1.1+Math.random()*0.5),home:{cx:fx,cy:fy,face:b.face||'s'},co:co||null,ph:Math.random()*6,moving:false,face:1,pause:0,seed:(Math.random()*1e9)|0,heading:0};
  pickTarget(w);workers.push(w);return w;}
function removeWorker(co){for(let i=workers.length-1;i>=0;i--){if(workers[i].co===co){workers.splice(i,1);return;}}}
function removeWorkersOf(key,val){for(let i=workers.length-1;i>=0;i--)if(workers[i][key]===val)workers.splice(i,1);}
function pickTarget(w){const f=w.home.face;const along=(Math.random()*2-1)*2.2*TILE,out=(0.05+Math.random()*0.7)*TILE;
  if(f==='s'){w.tx=w.home.cx+along;w.ty=w.home.cy+out;}else if(f==='n'){w.tx=w.home.cx+along;w.ty=w.home.cy-out;}
  else if(f==='e'){w.tx=w.home.cx+out;w.ty=w.home.cy+along;}else if(f==='w'){w.tx=w.home.cx-out;w.ty=w.home.cy+along;}

      if(t===T.WALK){g.fillStyle='#d6d1c6';const n=(dx,dy)=>tileAt(x+dx,y+dy)===T.ROAD;if(n(1,0))g.fillRect(px+GT-2,py,2,GT);if(n(-1,0))g.fillRect(px,py,2,GT);if(n(0,1))g.fillRect(px,py+GT-2,GT,2);if(n(0,-1))g.fillRect(px,py,GT,2);}}

      if(locked){g.strokeStyle='rgba(20,16,12,.45)';g.lineWidth=2;g.beginPath();for(let k=-GT;k<GT;k+=8){g.moveTo(px+k,py+GT);g.lineTo(px+k+GT,py);}g.stroke();}
      g.fillStyle=locked?'rgba(120,110,90,.35)':'rgba(232,192,96,.55)';const n=(dx,dy)=>tileAt(x+dx,y+dy)!==T.LOT;
      if(n(1,0))g.fillRect(px+GT-1.5,py,1.5,GT);if(n(-1,0))g.fillRect(px,py,1.5,GT);if(n(0,1))g.fillRect(px,py+GT-1.5,GT,1.5);if(n(0,-1))g.fillRect(px,py,GT,1.5);}
  }

function endDay(){if(S.over)return;let coNet=0;
  companies.forEach(co=>{co.age++;coNet+=coProfit(co)*stakeOf(co);co.ops=clamp(co.ops-(co.managed?rnd(0.05,0.35):rnd(0.4,1.1)),0,100);co.scale*=rnd(0.998,1.003);
    if(chance(NICHE[co.niche].risk*0.05)){co.scale*=rnd(.86,.94);log('⚠️ '+co.name+' perdeu um cliente grande.');}});
  S.cash+=coNet-dailyExpenses()-dailyInterest();S.energy=100;
  employeeTick();marketTick();rivalTick();contactTick();
  if(S.flags.scandal>0){S.flags.scandal--;repUp('public',-0.3);}
  S.day++;if(S.day%10===0)S.season=SEASONS[(SEASONS.indexOf(S.season)+1)%4];
  if(S.cash<0){S.negDays++;if(S.negDays<5)toast('⚠️ Caixa negativo! Falência em '+(5-S.negDays)+' dia(s) — pegue empréstimo ou venda algo.');}else S.negDays=0;
  if(S.negDays>=5)S.over=true;
  S.peakNet=Math.max(S.peakNet,netWorth());checkPhase();
  if(!S.over&&S.day>3&&chance(0.2))fireEvent();
  afterDay();}
function employeeTick(){companies.forEach(co=>{for(let i=co.employees.length-1;i>=0;i--){const e=co.employees[i];e.tenure++;const lead=(S.skills.leadership-8)*0.2;
  e.happy=clamp((e.happy||60)+(co.ops>55?0.8:-1)+lead*0.3+rnd(-2,2),0,100);if(e.happy<28&&chance(0.13)){co.employees.splice(i,1);removeWorker(co);log('🚪 '+e.name+' pediu demissão da '+co.name+'.');}}});}
function marketTick(){const m=S.market;m.mood=clamp(m.mood+rnd(-.1,.1),-1,1);if(chance(0.04)){const r=Math.random();if(r<.33){m.cycle="recessão";m.target=.78;m.rate=clamp(m.rate+rnd(.5,2),1,18);log('📉 Recessão em Wall Street. Juros sobem.');}else if(r<.66){m.cycle="aquecido";m.target=1.28;m.rate=clamp(m.rate-rnd(.3,1.2),1,18);log('📈 Boom! Capital barato.');}else{m.cycle="estável";m.target=1.0;}}m.mult+=(m.target-m.mult)*0.15+m.mood*0.01;m.mult=clamp(m.mult,0.6,1.5);}
/* concorrentes vivos: têm prédio no mapa, crescem, quebram, roubam gente, fazem guerra de preço */
function maxRivals(){return 5+S.phase;}
function rivalScale(){return Math.max(40000,netWorth()*0.08);}
function genRival(n,value){n=n||pick(NICHES);return {id:'rv'+Date.now()+ri(0,99999),name:coName(n),niche:n.id,value:Math.round(value||rnd(0.4,1.4)*rivalScale()),drift:rnd(0.993,1.012),staff:ri(2,5),b:null};}
function placeRival(r,gx,gy){const n=NICHE[r.niche];if(gx==null){const sp=findFreeSpot(n.spr,false);if(!sp)return r;gx=sp.gx;gy=sp.gy;}const b=placeBuilding(n.spr,gx,gy);b.rv=r;r.b=b;for(let k=0;k<r.staff;k++){const w=spawnWorker(b,null);w.rv=r;}return r;}
function spawnRival(n,value,name){const r=genRival(n,value);if(name)r.name=name;rivals.push(r);placeRival(r);log('🏢 Nova concorrente no distrito: '+r.name+' ('+NICHE[r.niche].name+').');return r;}
function removeRival(r){rivals=rivals.filter(x=>x!==r);if(r.b){const bi=buildings.indexOf(r.b);if(bi>=0)buildings.splice(bi,1);removeWorkersOf('rv',r);}}
function rivalTick(){const mf=0.985+S.market.mult*0.015;for(const r of rivals.slice()){r.value=Math.max(8000,Math.round(r.value*r.drift*rnd(0.985,1.015)*mf));
  if((r.value<=9000&&chance(0.2))||chance(0.003)){removeRival(r);log('💀 '+r.name+' fechou as portas.');}}
  if(rivals.length<maxRivals()&&chance(0.07))spawnRival();}
/* contatos (networking diegético: você caminha até eles na praça) */
function genContact(def){return {id:'ct'+Date.now()+ri(0,99999),name:pick(FIRST)+' '+pick(LAST),kind:def.kind,role:def.role,ico:def.ico,rel:8,last:-99,lastDeal:-99,mem:[]};}
function contactTick(){contacts.forEach(c=>{if(S.day-c.last>7)c.rel=Math.max(0,c.rel-0.3);});}
function remember(c,t){c.mem.unshift('Dia '+S.day+': '+t);if(c.mem.length>4)c.mem.length=4;}
/* ações do jogador (gastam energia — 100 por dia) */
function useEnergy(n){if(S.energy<n){toast('😮‍💨 Sem energia hoje (precisa '+n+'). Avance o dia.');return false;}S.energy-=n;return true;}
function actFreelance(){if(!useEnergy(30))return 0;const pay=Math.round(rnd(180,320)*(1+skillAvg()*0.02)*(S.phase===1?1:0.7));S.cash+=pay;gainSkill(pick(['negotiation','charisma','finance','leadership']),0.9);S.stats.freelas++;return pay;}
function actStudy(k){const cost=150*S.phase;if(S.cash<cost){toast('Caixa insuficiente');return false;}if(!useEnergy(25))return false;S.cash-=cost;gainSkill(k,1.6);return true;}
function actImproveOps(co){if(co.opsDay===S.day){toast('Já otimizou a '+co.name+' hoje.');return false;}const c=opsCost(co);if(S.cash<c){toast('Caixa insuficiente ('+money(c)+')');return false;}if(!useEnergy(20))return false;
  S.cash-=c;co.opsDay=S.day;co.ops=clamp(co.ops+ri(8,14)+Math.round((S.skills.leadership-8)*0.15),0,100);gainSkill('leadership',0.5);return true;}
function actExpand(co){const c=expandCost(co);if(S.cash<c){toast('Caixa insuficiente ('+money(c)+')');return false;}S.cash-=c;co.scale+=0.3;co.expandN=(co.expandN||0)+1;gainSkill('finance',0.4);log('🏗️ '+co.name+' expandiu a operação.');return true;}
function actHire(co,e){if(co.employees.length>=maxStaff(co)){toast('Prédio lotado ('+maxStaff(co)+') — expanda a operação.');return false;}if(totalStaff()>=staffCap()){toast('Limite do distrito ('+staffCap()+') — suba de fase.');return false;}
  const shave=clamp((S.skills.negotiation-8)*0.006,0,0.25);e.salary=Math.round(e.salary*(1-shave));addEmployee(co,e);gainSkill('negotiation',0.3);return true;}
function actManager(co){if(co.managed)return false;if(co.employees.length>=maxStaff(co)+1)return false;const mgr=genPerson();mgr.role='Gerente Geral';mgr.fam='any';mgr.competence=Math.max(mgr.competence,68);mgr.salary=Math.round(80+coRevenue(co)*0.12);co.managed=true;addEmployee(co,mgr);return true;}
function borrow(a){a=Math.min(a,loanLimit()-S.debt);if(a<=0){toast('Limite de crédito atingido');return 0;}S.debt+=a;S.cash+=a;return a;}
function repay(a){a=Math.min(a,S.debt,Math.max(0,S.cash));if(a<=0)return 0;S.debt-=a;S.cash-=a;return a;}
function rivalPrice(r){return Math.round(r.value*1.35*(1-clamp((S.skills.negotiation-10)*0.004,0,0.15)));}
function doAcquire(r){if(!rivals.includes(r))return null;const price=rivalPrice(r);if(S.cash<price)return null;S.cash-=price;const n=NICHE[r.niche];
  let b=r.b;if(!b){const sp=findFreeSpot(n.spr,false);b=placeBuilding(n.spr,sp?sp.gx:2,sp?sp.gy:2);}
  const co=makeCompany(r.niche,b);co.name=r.name;co.ops=55;co.age=30;co.acquired=true;b.rv=null;
  rivals=rivals.filter(x=>x!==r);removeWorkersOf('rv',r);
  const staff=Math.min(r.staff,1+Math.floor(r.value/40000));for(let k=0;k<staff;k++)addEmployee(co);companies.push(co);calibrate(co,r.value*rnd(0.95,1.08));
  repUp('market',3);S.founded++;S.stats.acq++;log('🦈 Você adquiriu a '+co.name+'.');gainSkill('negotiation',1);return co;}
function sellValue(co){return Math.round(coValue(co)*stakeOf(co));}
function doSell(co,price){S.cash+=price;removeCompany(co);log('🏷️ Você vendeu a '+co.name+' por '+money(price)+'.');}
function doIPO(co){if(co.public)return 0;const val=coValue(co);if(val<IPO_MIN)return 0;const raise=Math.round(val*0.35*rnd(1.0,1.2));S.cash+=raise;co.public=true;co.stake=stakeOf(co)*0.65;repUp('market',5);repUp('public',8);S.stats.ipos++;log('📊 IPO da '+co.name+' captou '+money(raise)+'.');return raise;}
function afterDay(){refreshHUD();refreshObj();if(S.day%3===0)saveLocal();MP.onDay();if(S.over)gameOver();}
function onPhaseUp(p){toast('🏆 Nova fase: '+p.name+' — o distrito cresceu!');log('🏆 Fase '+p.n+': '+p.name+'.');MP.news(S.name+' chegou à fase '+p.name+'!');if(p.n===5)S.won=true;}

function fireEvent(){const pool=EVENTS.map(e=>({e,w:e.w()})).filter(x=>x.w>0);if(!pool.length)return;let t=Math.random()*pool.reduce((a,x)=>a+x.w,0);for(const x of pool){t-=x.w;if(t<=0){S.stats.events++;x.e.run();return;}}}
function eventModal(ico,title,body,choices){modal(ico,title,'<p>'+body+'</p>',choices.map(c=>({t:c.t,d:c.d,fn:()=>{c.fn();closeModal();checkPhase();refreshHUD();refreshObj();}})));}

/* ============================ MODAIS / PAINÉIS ============================ */
function modal(ico,title,bodyHTML,actions){closeModal();const sc=document.createElement('div');sc.id='scrim';sc.className='scrim';
  const m=document.createElement('div');m.className='modal panel';m.innerHTML='<div class="mh">'+(ico||'')+' '+title+'</div><div class="mb">'+bodyHTML+'</div>';
  const ab=document.createElement('div');ab.className='mact';(actions||[{t:'Fechar',fn:closeModal}]).forEach(a=>{const btn=document.createElement('button');btn.className='mbtn'+(a.dis?' dis':'');btn.innerHTML='<b>'+a.t+'</b>'+(a.d?'<span>'+a.d+'</span>':'');if(!a.dis)btn.onclick=()=>a.fn&&a.fn();ab.appendChild(btn);});
  m.appendChild(ab);sc.appendChild(m);document.body.appendChild(sc);sc.onclick=e=>{if(e.target===sc&&!m.dataset.locked)closeModal();};return m;}
function closeModal(){const s=document.getElementById('scrim');if(s)s.remove();}
function kpi(k,v,c){return '<div class="kpi"><div class="k">'+k+'</div><div class="v" style="color:'+(c||'var(--cream)')+'">'+v+'</div></div>';}
function badges(co){return (co.managed?'<span class="tag">🧑‍✈️ gerida</span>':'')+(co.public?'<span class="tag">📊 aberta · você tem '+Math.round(stakeOf(co)*100)+'%</span>':(stakeOf(co)<1?'<span class="tag">🤝 você tem '+Math.round(stakeOf(co)*100)+'%</span>':''))+(co.acquired?'<span class="tag">🦈 adquirida</span>':'');}
const after=(fn)=>()=>{fn();checkPhase();refreshHUD();refreshObj();};
function openCompany(co){if(!companies.includes(co))return closeModal();const n=NICHE[co.niche];const rev=coRevenue(co),prof=rev-coCosts(co),val=coValue(co),syn=coSynergy(co),comp=competition(co);
  modal(n.ico,esc(co.name)+' · '+n.name,
   '<div class="kpis">'+kpi('Valuation',money(val),'var(--gold)')+kpi('Lucro/dia',(prof>=0?'+':'')+money(prof),prof>=0?'var(--green)':'var(--red)')+kpi('Equipe',co.employees.length+'/'+maxStaff(co))+kpi('Operação',Math.round(co.ops)+'%')+'</div>'+
   '<div style="margin:6px 0">'+badges(co)+(syn>1.001?'<span class="tag" style="color:var(--gold)">✦ sinergia ×'+syn.toFixed(2)+'</span>':'')+(comp<0.999?'<span class="tag" style="color:var(--red)">⚔️ concorrência −'+Math.round((1-comp)*100)+'%</span>':'')+'</div>'+
   '<p class="small">Escala ×'+co.scale.toFixed(2)+' · Expandir aumenta a capacidade (receita e vagas). Funcionários só se pagam com escala.</p>',
   [{t:'🧑‍💼 Contratar',d:'Vagas '+co.employees.length+'/'+maxStaff(co)+' · distrito '+totalStaff()+'/'+staffCap(),fn:()=>hireInto(co)},
    {t:'🏗️ Expandir operação ('+money(expandCost(co))+')',d:'Escala +0,3',fn:after(()=>{if(actExpand(co))toast('🏗️ Expandiu!');openCompany(co);}),dis:S.cash<expandCost(co)},
    {t:'📈 Otimizar operação ('+money(opsCost(co))+' · ⚡20)',d:co.opsDay===S.day?'Já feito hoje':'+eficiência (1×/dia)',fn:after(()=>{if(actImproveOps(co))toast('Operação otimizada');openCompany(co);}),dis:co.opsDay===S.day},
    co.managed?null:{t:'🧑‍✈️ Contratar gerente',d:'Operação decai bem mais devagar',fn:after(()=>{if(!actManager(co))toast('Sem vaga p/ gerente');openCompany(co);})},
    (!co.public&&S.phase>=3)?{t:'📊 IPO',d:val>=IPO_MIN?'Vende 35% na bolsa (~'+money(val*0.35)+')':'Precisa valer '+money(IPO_MIN),dis:val<IPO_MIN,fn:()=>ipoModal(co)}:null,
    {t:'🏷️ Vender ('+money(sellValue(co))+')',d:'Exit para um fundo',fn:()=>sellModal(co)},
    {t:'↩ Fechar',fn:closeModal}].filter(Boolean));}
function sellModal(co){const v=sellValue(co);modal('🏷️','Vender '+esc(co.name),'<p>Um fundo avalia sua parte em <b style="color:var(--gold)">'+moneyFull(v)+'</b>.</p>',[{t:'✅ Vender por '+money(v),fn:after(()=>{doSell(co,v);toast('Exit: '+money(v));closeModal();})},{t:'↩ Manter',fn:()=>openCompany(co)}]);}
function ipoModal(co){const val=coValue(co);modal('📊','Abrir capital — '+esc(co.name),'<p>A Bolsa compra <b>35%</b> da empresa por ~<b style="color:var(--gold)">'+money(val*0.35)+'</b>. Você segue no comando, mas passa a ter '+Math.round(stakeOf(co)*65)+'% dos lucros e do valor.</p><p class="small">Empresas abertas podem sofrer <b>aquisição hostil</b> de outros jogadores.</p>',
  [{t:'📈 Fazer IPO',fn:after(()=>{const r=doIPO(co);toast('IPO! +'+money(r));MP.news(S.name+' abriu o capital da '+co.name+' (+'+money(r)+')');closeModal();})},{t:'↩ Ainda não',fn:()=>openCompany(co)}]);}
function hireInto(co){const cands=[genPerson(),genPerson(),genPerson()];
  modal('🧑‍💼','Entrevistas · '+esc(co.name),'<p class="small">Competência puxa receita; salário puxa custo. Reputação de talento melhora os candidatos.</p>',
    cands.map(c=>({t:esc(c.name)+' — '+c.role,d:'Competência '+c.competence+' · '+moneyFull(c.salary)+'/dia',fn:after(()=>{if(actHire(co,c))toast('Contratado: '+c.name);openCompany(co);})})).concat([{t:'↩ Voltar',fn:()=>openCompany(co)}]));}
function openRival(r){if(!rivals.includes(r))return closeModal();const n=NICHE[r.niche];const price=rivalPrice(r);
  modal(n.ico,esc(r.name)+' · concorrente','<div class="kpis">'+kpi('Valuation',money(r.value),'var(--red)')+kpi('Setor',n.name)+kpi('Equipe',r.staff)+kpi('Preço (M&A)',money(price),'var(--gold)')+'</div><p class="small">Concorrentes no mesmo setor reduzem sua receita. Comprar elimina a concorrência e o prédio vira seu.</p>',
  [{t:'🦈 Adquirir por '+money(price),d:S.phase<2?'Liberado na fase Crescimento':(S.cash<price?'Caixa insuficiente':'O prédio e a equipe viram seus'),dis:S.phase<2||S.cash<price,fn:after(()=>{const co=doAcquire(r);if(co){toast('🦈 Adquiriu '+co.name);MP.news(S.name+' adquiriu a '+co.name);openCompany(co);}})},{t:'↩ Fechar',fn:closeModal}]);}
function openSede(){modal('⭐','Sua Sede — '+esc(S.name),'<div class="kpis">'+kpi('Patrimônio',money(netWorth()),'var(--gold)')+kpi('Energia','⚡'+Math.round(S.energy))+kpi('Negociação / Carisma',Math.round(S.skills.negotiation)+' / '+Math.round(S.skills.charisma))+kpi('Finanças / Liderança',Math.round(S.skills.finance)+' / '+Math.round(S.skills.leadership))+'</div>',
  [{t:'💻 Fazer freela (⚡30)',d:S.phase===1?'Dinheiro rápido para começar':'Rende menos agora que você é empresário',fn:after(()=>{const p=actFreelance();if(p)toast('💵 Freela: +'+money(p));openSede();})},
   {t:'📚 Curso de finanças ('+money(150*S.phase)+' · ⚡25)',d:'Finanças melhora seus negócios',fn:after(()=>{if(actStudy('finance'))toast('📚 Finanças +');openSede();})},
   {t:'🎖️ Curso de liderança ('+money(150*S.phase)+' · ⚡25)',d:'Equipes mais felizes e operação melhor',fn:after(()=>{if(actStudy('leadership'))toast('🎖️ Liderança +');openSede();})},
   {t:'🏦 Banco',fn:openBank},{t:'↩ Fechar',fn:closeModal}]);}
function openBank(){const lim=loanLimit(),avail=Math.max(0,lim-S.debt);
  modal('🏦','Banco · 23 Wall Street','<div class="kpis">'+kpi('Dívida',money(S.debt),S.debt>0?'var(--red)':'var(--cream)')+kpi('Crédito livre',money(avail),'var(--green)')+kpi('Juros',loanRate().toFixed(1)+'% a.a.'+(S.flags.banker?' (−30%)':''))+kpi('Juros/dia',money(dailyInterest()))+'</div><p class="small">1 ano = 40 dias. Juros sobem na recessão e quanto mais você deve. Caixa negativo por 5 dias = falência.</p>',
  [{t:'💵 Pegar '+money(Math.min(avail,Math.max(2000,Math.round(lim*0.25)))),dis:avail<=0,fn:after(()=>{const a=borrow(Math.max(2000,Math.round(lim*0.25)));if(a)toast('+'+money(a)+' emprestado');openBank();})},
   {t:'💰 Pegar tudo ('+money(avail)+')',dis:avail<=0,fn:after(()=>{const a=borrow(avail);if(a)toast('+'+money(a)+' emprestado');openBank();})},
   {t:'↩️ Pagar 25%',dis:S.debt<=0||S.cash<=0,fn:after(()=>{repay(Math.max(1,Math.round(S.debt*0.25)));openBank();})},
   {t:'✅ Quitar tudo',dis:S.debt<=0||S.cash<S.debt,fn:after(()=>{repay(S.debt);toast('Dívida quitada!');openBank();})},{t:'↩ Fechar',fn:closeModal}]);}
function openContact(c){const ok=S.day!==c.last;const rl=c.rel>=60?'aliado(a)':c.rel>=35?'próximo(a)':c.rel>=15?'conhecido(a)':'estranho(a)';const acts=[];
  acts.push({t:'☕ Conversar (⚡15)',d:ok?'Relação +, carisma +':'Já conversaram hoje',dis:!ok,fn:after(()=>{if(!useEnergy(15))return;c.rel=clamp(c.rel+6+S.skills.charisma*0.08,0,100);c.last=S.day;gainSkill('charisma',0.6);remember(c,'tomamos um café');
    if(c.kind==='mentor'){const k=pick(['finance','leadership']);gainSkill(k,c.rel>=20?1.4:0.5);toast('🎓 Mentoria: '+(k==='finance'?'finanças':'liderança')+' +');}else toast('☕ '+c.name.split(' ')[0]+' gostou da conversa');openContact(c);})});
  if(c.kind==='investor'){const co=companies.filter(x=>stakeOf(x)>0.5).sort((a,b)=>coValue(b)-coValue(a))[0];const cd=S.day-c.lastDeal>=20;const amt=co?Math.round(Math.max(5000,coValue(co)*0.15*1.1)):0;
    acts.push({t:'💼 Pedir aporte',d:!co?'Precisa de uma empresa':c.rel<45?'Relação mínima 45':!cd?'Ela investiu recentemente':'+'+money(amt)+' por 15% da '+esc(co.name),dis:!co||c.rel<45||!cd,fn:after(()=>{S.cash+=amt;co.stake=stakeOf(co)-0.15;c.lastDeal=S.day;remember(c,'investiu na '+co.name);toast('💼 Aporte de '+money(amt));openContact(c);})});}
  if(c.kind==='banker')acts.push({t:'🏦 Pedir condições especiais',d:S.flags.banker?'Já concedidas (juros −30%, crédito +20%)':c.rel<30?'Relação mínima 30':'Juros −30% e crédito +20%',dis:!!S.flags.banker||c.rel<30,fn:after(()=>{S.flags.banker=true;remember(c,'liberou condições especiais');toast('🏦 Condições especiais!');openContact(c);})});
  if(c.kind==='client'){const cd=S.day-c.lastDeal>=8;const pay=Math.round((500+S.skills.negotiation*15)*Math.pow(S.phase,1.6));acts.push({t:'🤝 Fechar contrato (⚡25)',d:c.rel<25?'Relação mínima 25':!cd?'Próximo contrato em '+(8-(S.day-c.lastDeal))+' dias':'+'+money(pay)+' e reputação de mercado',dis:c.rel<25||!cd,fn:after(()=>{if(!useEnergy(25))return;S.cash+=pay;c.lastDeal=S.day;repUp('market',1);gainSkill('negotiation',1);remember(c,'fechamos contrato');toast('🤝 Contrato: +'+money(pay));openContact(c);})});}
  if(c.kind==='headhunter'){const fee=1500*S.phase;acts.push({t:'🎯 Buscar um talento estrela ('+money(fee)+')',d:c.rel<30?'Relação mínima 30':!companies.length?'Precisa de uma empresa':'Competência 85–98',dis:c.rel<30||!companies.length||S.cash<fee,fn:()=>{const star=genPerson(true);modal('🎯','Talento: '+esc(star.name),'<p>'+star.role+' · competência <b>'+star.competence+'</b> · '+moneyFull(star.salary)+'/dia</p>',companies.map(co=>({t:'Contratar na '+esc(co.name),d:co.employees.length+'/'+maxStaff(co),fn:after(()=>{if(actHire(co,star)){S.cash-=fee;remember(c,'achou '+star.name+' para você');toast('⭐ '+star.name+' contratada');}closeModal();})})).concat([{t:'↩ Voltar',fn:()=>openContact(c)}]));}});}
  acts.push({t:'↩ Fechar',fn:closeModal});
  modal(c.ico,esc(c.name)+' · '+c.role,'<div class="lab"><span>Relação: '+rl+'</span><b>'+Math.round(c.rel)+'/100</b></div><div class="bar"><i style="width:'+c.rel+'%"></i></div>'+(c.mem.length?'<p class="small" style="margin-top:8px">Lembra de: '+c.mem.map(esc).join(' · ')+'</p>':'<p class="small" style="margin-top:8px">Vocês ainda não se conhecem.</p>'),acts);}
function openTeam(){const tot=totalStaff();
  modal('🏢','Suas empresas — '+tot+'/'+staffCap()+' funcionários',companies.length?companies.map(c=>{const n=NICHE[c.niche];const pf=coProfit(c)*stakeOf(c);return '<div class="lrow" data-co="'+c.id+'"><span>'+n.ico+' <b>'+esc(c.name)+'</b></span><span class="dim">'+c.employees.length+' func · <span style="color:'+(pf>=0?'var(--green)':'var(--red)')+'">'+(pf>=0?'+':'')+money(pf)+'/d</span></span></div>';}).join(''):'<div class="dim">Sem empresas. Use 🔨 Construir (ou faça freelas na ⭐ Sede para juntar caixa).</div>',[{t:'↩ Fechar',fn:closeModal}]);
  document.querySelectorAll('.lrow[data-co]').forEach(el=>el.onclick=()=>{const c=companies.find(x=>x.id===el.dataset.co);if(c)openCompany(c);});}
function openMarket(){const m=S.market;
  const npc=rivals.slice().sort((a,b)=>b.value-a.value).map(r=>{const n=NICHE[r.niche];return '<div class="lrow" data-rv="'+r.id+'"><span>'+n.ico+' <b>'+esc(r.name)+'</b></span><span class="dim">'+money(r.value)+' · ~<b style="color:var(--gold)">'+money(rivalPrice(r))+'</b></span></div>';}).join('')||'<div class="dim">Sem concorrentes no radar.</div>';
  const fr=MP.on?(MP.listings.length?MP.listings.map(l=>{const n=NICHE[l.niche]||NICHES[0];return '<div class="lrow" data-ls="'+esc(l.id)+'"><span>'+n.ico+' <b>'+esc(l.name)+'</b> <span class="dim">de '+esc(l.owner_name)+'</span>'+(l.is_public?' <span class="tag">📊 aberta</span>':'')+'</span><span class="dim">'+money(l.value)+'</span></div>';}).join(''):'<div class="dim">Nenhuma empresa de amigos ainda.</div>'):'<div class="dim">Offline — entre online para negociar com amigos.</div>';
  modal('📈','Mercado — Bolsa de Wall Street','<div class="kpis">'+kpi('Ciclo',m.cycle.toUpperCase(),m.cycle==='recessão'?'var(--red)':m.cycle==='aquecido'?'var(--green)':'var(--gold)')+kpi('Multiplic.','×'+m.mult.toFixed(2))+kpi('Juros',m.rate.toFixed(1)+'% a.a.')+kpi('Humor',m.mood>.2?'otimista':m.mood<-.2?'pessimista':'neutro')+'</div>'+
   '<div class="sec">🦈 CONCORRENTES (M&A'+(S.phase<2?' — liberado na fase 2':'')+')</div>'+npc+'<div class="sec">🌐 EMPRESAS DE AMIGOS</div>'+fr,[{t:'🔄 Atualizar',fn:async()=>{await MP.fetchListings();openMarket();}},{t:'↩ Fechar',fn:closeModal}]);
  document.querySelectorAll('.lrow[data-rv]').forEach(el=>el.onclick=()=>{const r=rivals.find(x=>x.id===el.dataset.rv);if(r)openRival(r);});
  document.querySelectorAll('.lrow[data-ls]').forEach(el=>el.onclick=()=>{const l=MP.listings.find(x=>x.id===el.dataset.ls);if(l)openListing(l);});}
function openListing(l){const n=NICHE[l.niche]||NICHES[0];const hp=Math.ceil(l.value*1.5*l.stake);const offers=[1.1,1.3,1.6].map(f=>Math.ceil(l.value*f));
  modal(n.ico,esc(l.name)+' · de '+esc(l.owner_name),'<div class="kpis">'+kpi('Valuation',money(l.value),'var(--gold)')+kpi('Lucro/dia',money(l.profit))+kpi('Equipe',l.employees)+kpi('Status',l.is_public?'Aberta ('+Math.round(l.stake*100)+'% do dono)':'Fechada')+'</div><p class="small">Ofertas ficam reservadas (o dinheiro sai do seu caixa) até '+esc(l.owner_name)+' responder. Recusou → você recebe de volta.</p>',
   offers.map(p=>({t:'✉️ Oferecer '+money(p),d:S.phase<2?'Fase 2+':S.cash<p?'Caixa insuficiente':'Proposta amigável',dis:S.phase<2||S.cash<p,fn:async()=>{closeModal();await MP.makeOffer(l,p);}}))
   .concat(l.is_public?[{t:'⚔️ Aquisição hostil ('+money(hp)+')',d:S.phase<3?'Fase 3+':S.cash<hp?'Caixa insuficiente':'Compra as ações na bolsa — sem pedir licença',dis:S.phase<3||S.cash<hp,fn:async()=>{closeModal();await MP.hostile(l,hp);}}]:[]).concat([{t:'↩ Voltar',fn:openMarket}]));}
function openFriends(){MP.unread=0;buildToolbar();const on=Object.values(MP.online);const deals=MP.deals.filter(d=>d.status==='pending');
  const inc=deals.filter(d=>d.seller===MP.uid),out=deals.filter(d=>d.buyer===MP.uid);
  const body=!MP.on?'<p>'+esc(MP.status)+'</p><p class="small">O jogo funciona offline (save local). Para jogar com amigos, o servidor precisa estar configurado — ver <b>town/README.md</b>.</p>':
   '<div class="sec">🟢 ONLINE AGORA ('+on.length+')</div>'+(on.map(p=>'<div class="lrow"><span><b>'+esc(p.name)+'</b>'+(p.id===MP.uid?' (você)':'')+'</span><span class="dim">Fase '+(p.phase|0)+' · '+money(p.net||0)+'</span></div>').join('')||'<div class="dim">Só você.</div>')+
   (inc.length?'<div class="sec">✉️ OFERTAS RECEBIDAS</div>'+inc.map(d=>'<div class="lrow"><span><b>'+esc(d.buyer_name)+'</b> quer a <b>'+esc(d.company.name)+'</b></span><span><b style="color:var(--gold)">'+money(d.price)+'</b> <button class="sbtn" data-acc="'+d.id+'">Aceitar</button><button class="sbtn" data-dec="'+d.id+'">Recusar</button></span></div>').join(''):'')+
   (out.length?'<div class="sec">📤 SUAS OFERTAS</div>'+out.map(d=>'<div class="lrow"><span>'+esc(d.company.name)+' de '+esc(d.seller_name)+'</span><span class="dim">'+money(d.price)+' · aguardando <button class="sbtn" data-can="'+d.id+'">Cancelar</button></span></div>').join(''):'')+
   '<div class="sec">🏆 RANKING DE PATRIMÔNIO</div>'+(MP.board.map((p,i)=>'<div class="lrow"><span>'+(i+1)+'. <b>'+esc(p.name)+'</b>'+(p.id===MP.uid?' (você)':'')+'</span><span class="dim">Fase '+p.phase+' · '+money(p.net_worth)+'</span></div>').join('')||'<div class="dim">Carregando…</div>')+
   '<div class="sec">💬 CHAT</div><div class="chat" id="chatBox">'+MP.chat.map(m=>'<div><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>').join('')+'</div><div class="chatin"><input id="chatIn" maxlength="200" placeholder="Mensagem para quem está online…"><button class="sbtn" id="chatSend">Enviar</button></div>';
  modal('🌐','Amigos — Wall Street online',body,[{t:'🔄 Atualizar',fn:async()=>{await MP.refreshAll();openFriends();}},{t:'↩ Fechar',fn:closeModal}]);
  const cb=document.getElementById('chatBox');if(cb)cb.scrollTop=cb.scrollHeight;
  const send=()=>{const i=document.getElementById('chatIn');if(i&&i.value.trim()){MP.say(i.value.trim());i.value='';}};
  const sb=document.getElementById('chatSend');if(sb)sb.onclick=send;const ci=document.getElementById('chatIn');if(ci)ci.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')send();};
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>MP.respond(+b.dataset.acc,true));
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>MP.respond(+b.dataset.dec,false));
  document.querySelectorAll('[data-can]').forEach(b=>b.onclick=()=>MP.cancel(+b.dataset.can));}

  '<div class="sec">📰 NOTÍCIAS</div>'+(FEED.slice(0,12).map(f=>'<div class="small">Dia '+f.d+' · '+esc(f.h)+'</div>').join('')||'<div class="dim">Nada ainda.</div>'),[{t:'↩ Fechar',fn:closeModal}]);}

function winModal(){S.wonSeen=true;modal('👑','LEGADO','<p>Você saiu dos freelas e virou uma lenda de Wall Street.</p><div class="kpis">'+kpi('Patrimônio',money(netWorth()),'var(--gold)')+kpi('Dias',S.day)+kpi('Empresas fundadas',S.founded)+kpi('Aquisições',S.stats.acq)+kpi('IPOs',S.stats.ipos)+kpi('Contratações',S.hires)+'</div>',[{t:'♾️ Continuar construindo',fn:closeModal}]);MP.news('👑 '+S.name+' alcançou o LEGADO!');}
/* objetivos dinâmicos (por fase) */
function currentObjective(){const p=S.phase,net=netWorth();const np=PHASES.find(ph=>ph.n===p+1);
  const objs=[{lab:'Empresas',cur:companies.length,max:Math.max(companies.length,p+1)},{lab:'Funcionários',cur:totalStaff(),max:staffCap()}];
  if(np)objs.push({lab:'Patrimônio → '+np.name,cur:Math.max(0,Math.min(net,np.net)),max:np.net,money:true});
  const cheapest=NICHES[0].cost;
  const quest=!companies.length?(S.cash<cheapest?'Faça freelas na ⭐ Sede: junte '+money(cheapest):'Funde sua 1ª empresa (🔨 Construir)'):np?('Chegue à fase “'+np.name+'” ('+money(np.net)+')'):'Construa seu legado — você chegou ao topo';
  const tip=['','Caminhe até a ⭐ Sede para freelas e banco. Converse com as pessoas de anel dourado na praça: elas abrem portas.','Expanda as empresas antes de contratar — funcionário só se paga com escala. Concorrentes viram alvos de M&A.','IPO liberado: capta caixa, mas você dilui e fica exposto a aquisição hostil de amigos.','Seu distrito é grande: sinergia entre setores da mesma família multiplica receita.','Você chegou ao topo. Agora é defender o trono.'][p];
  return {quest,objs,tip};}


/* ============================ HUD ============================ */
function refreshHUD(){if(!started)return;
  document.getElementById('hudTop').innerHTML='<span class="res" title="Caixa">💵 <span style="color:'+(S.cash<0?'var(--red)':'inherit')+'">'+money(S.cash)+'</span></span>'+(S.debt>0?'<span class="res" style="color:var(--red)" title="Dívida">🏦 −'+money(S.debt)+'</span>':'')+
    '<span class="res" title="Energia">⚡'+Math.round(S.energy)+'</span><span class="res" title="Funcionários">👥 '+totalStaff()+'/'+staffCap()+'</span><span class="res" title="Reputação">⭐ '+Math.round((S.rep.market+S.rep.public)/2)+'</span><span class="res" style="color:var(--gold)" title="Patrimônio">◆ '+money(netWorth())+'</span>';
  document.getElementById('dayTxt').textContent='Dia '+S.day+' · '+S.season;document.getElementById('phaseTxt').textContent='Fase '+S.phase+' · '+S.phaseName;
  document.getElementById('questTxt').textContent=currentObjective().quest;
  document.querySelectorAll('#speed button[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.speed));
  const ns=document.getElementById('netState');if(ns)ns.textContent=MP.on?'🟢 online · '+Object.keys(MP.online).length:'⚪ offline';
  if(S.won&&!S.wonSeen&&!modalOpen())winModal();}
function refreshObj(){if(!started)return;const o=currentObjective();document.getElementById('objPanel').innerHTML=o.objs.map(ob=>ob.lab).join(' · ');}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2400);}
function showHint(t,ms){const h=document.getElementById('hint');h.textContent=t;h.classList.add('on');clearTimeout(showHint._t);showHint._t=setTimeout(()=>h.classList.remove('on'),ms||3400);}

/* ============================ FERRAMENTAS + CONSTRUÇÃO ============================ */
const TOOLS=[{k:'build',ic:'🔨',l:'Construir'},{k:'emp',ic:'🏢',l:'Empresas'},{k:'market',ic:'📈',l:'Mercado'},{k:'bank',ic:'🏦',l:'Banco'},{k:'net',ic:'👥',l:'Amigos'},{k:'obj',ic:'📋',l:'Objetivos'}];
const BUILD=NICHES.map(n=>({id:n.id,spr:n.spr,name:n.name,ic:n.ico,cost:n.cost}));
function buildToolbar(){const pend=MP.deals.filter(d=>d.status==='pending'&&d.seller===MP.uid).length+MP.unread;
  document.getElementById('toolbar').innerHTML=TOOLS.map(t=>'<div class="tool" data-k="'+t.k+'"><div class="ti">'+t.ic+'</div><div class="tl">'+t.l+'</div>'+(t.k==='net'&&pend?'<span class="badge">'+pend+'</span>':'')+'</div>').join('');
  document.querySelectorAll('.tool').forEach(el=>el.onclick=()=>onTool(el.dataset.k,el));}
function onTool(k,el){if(!started)return;const tray=document.getElementById('tray');document.querySelectorAll('.tool').forEach(t=>t.classList.remove('on'));
  if(k==='build'){if(placing){cancelPlacing();return;}const open=!tray.classList.contains('on');if(open){if(el)el.classList.add('on');openBuildTray();}else tray.classList.remove('on');return;}
  tray.classList.remove('on');if(placing)cancelPlacing();
  if(k==='emp')openTeam();else if(k==='obj')openObjectives();else if(k==='market'){openMarket();MP.fetchListings().then(()=>{if(document.querySelector('.modal .sec'))openMarket();});}
  else if(k==='bank')openBank();else if(k==='net'){openFriends();MP.refreshAll().then(()=>{if(document.getElementById('chatBox'))openFriends();});}else if(k==='set')openSettings();}
function openBuildTray(){const tray=document.getElementById('tray');tray.classList.add('on');
  tray.innerHTML=BUILD.map(d=>'<div class="card'+(S.cash<d.cost?' no':'')+'" data-t="'+d.id+'"><div class="ce">'+d.ic+'</div><div class="cn">'+d.name+'</div><div class="cc">'+money(d.cost)+'</div></div>').join('');

      '<div class="sec">PATRIMÔNIO (ÚLTIMOS DIAS)</div>'+svg+'<div class="sec">SUAS EMPRESAS</div>'+(companies.length?'<table class="tbl"><tr><th>Empresa</th><th>Valor</th><th>Lucro/dia</th><th>Equipe</th></tr>'+
      companies.map(c=>'<tr><td>'+NICHE[c.niche].ico+' '+esc(c.name)+'</td><td>'+money(coValue(c))+'</td><td style="color:'+(coProfit(c)>=0?'var(--green)':'var(--red)')+'">'+money(coProfit(c))+'</td><td>'+c.employees.length+'</td></tr>').join('')+'</table>':'<p class="small">Nenhuma ainda — funde a primeira com 🔨 Construir.</p>')+
      '<div class="sec">ÚLTIMOS ACONTECIMENTOS</div>'+FEED.slice(0,6).map(f=>'<div class="small">Dia '+f.d+' · '+esc(f.h)+'</div>').join('');}
  if(page==='settings'){const seg=(k,opts)=>'<div class="seg">'+opts.map(([v,l])=>'<button data-set="'+k+'" data-v="'+v+'" class="'+(SETTINGS[k]===v?'on':'')+'">'+l+'</button>').join('')+'</div>';
    const tog=(k,l,d)=>'<div class="row2"><span>'+l+(d?'<br><span class="small">'+d+'</span>':'')+'</span>'+seg(k,[[true,'Sim'],[false,'Não']])+'</div>';
    return '<div class="ph1">⚙️ Ajustes</div><div class="opt">Qualidade gráfica</div>'+seg('quality',[['baixa','Baixa'],['media','Média'],['alta','Alta']])+'<p class="small" style="margin-top:4px">Baixa = mais leve e menos bateria. Alta = sombras finas e mais gente na rua.</p>'+
      '<div class="opt">Sensibilidade da câmera</div><input class="rng" type="range" id="sSens" min="0.4" max="2" step="0.1" value="'+SETTINGS.sens+'">'+
      tog('invertY','Inverter câmera vertical')+tog('cycle','Ciclo de dia e noite','As janelas acendem à noite')+tog('traffic','Trânsito','Táxis e carros nas ruas')+tog('fullscreen','Tela cheia ao jogar','No celular, trava na horizontal')+
      '<div class="mact">'+(isStandalone()?'':'<button class="mbtn" id="sInstall"><b>📲 Instalar app</b><span>Ícone na tela inicial, abre em tela cheia</span></button>')+
      (started?'<button class="mbtn" id="sSave"><b>💾 Salvar agora</b><span>Neste aparelho e na nuvem</span></button>':'')+'</div><p class="small" style="margin-top:10px">Multiplayer: '+esc(MP.status)+'</p>';}
  if(page==='help')return '<div class="ph1">❓ Como jogar</div><div class="mb">'+
    '<p><b>Controles:</b> joystick à esquerda anda (empurre até a borda para correr) · arraste a tela para girar a câmera · pinça = zoom · toque num prédio, pessoa ou no chão para ir até lá · o botão dourado à direita entra / conversa.</p>'+
    '<p><b>Começo:</b> você chega com $3k. Vá até sua ⭐ <b>sede</b> (placa dourada) e faça <b>freelas</b> até juntar caixa para fundar a 1ª empresa com <b>🔨 Construir</b> — os terrenos verdes ficam liberados.</p>'+
    '<p><b>Wall Street de verdade:</b> a <b>Bolsa</b> (colunas, bandeira) abre o pregão · o <b>23 Wall</b> é o banco · na praça em frente à Bolsa estão os contatos (anel dourado): investidora, banqueiro, mentor, cliente, headhunter.</p>'+
    '<p><b>Crescer:</b> expanda e contrate dentro de cada empresa — o prédio cresce junto. Compre concorrentes (placa vermelha), abra capital e cuidado com aquisições hostis dos amigos.</p>'+
    '<p><b>Fases:</b> Sobrevivência → Crescimento → Escala → Influência → Legado. A cada fase, mais terrenos de Lower Manhattan se abrem.</p></div>';
  return '';}
function bindPage(page){const $=id=>document.getElementById(id);
  if(page==='perso'){document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.k;const v=['skin','hair','top','pants'].includes(k)?+c.dataset.v:c.dataset.v;AVATAR[k]=v;saveAvatar();rebuildHero();renderMenu('perso');});
    $('pH').oninput=e=>{AVATAR.height=+e.target.value;saveAvatar();rebuildHero();};$('pName').onchange=e=>{const v=e.target.value.trim().slice(0,24);AVATAR.name=v;saveAvatar();if(started&&v.length>=2){S.name=v;MP.sync();}};
    $('pOk').onclick=()=>{const v=$('pName').value.trim().slice(0,24);if(v.length<2){toast('Digite um nome (2+ letras)');$('pName').focus();return;}AVATAR.name=v;saveAvatar();if(started){S.name=v;MP.sync();}renderMenu('home');};}
  if(page==='settings'){document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;SETTINGS[k]=v;saveSettings();if(k==='quality')applyQuality();renderMenu('settings');});
    $('sSens').oninput=e=>{SETTINGS.sens=+e.target.value;saveSettings();};if($('sInstall'))$('sInstall').onclick=installApp;if($('sSave'))$('sSave').onclick=async()=>{saveLocal();await MP.saveCloud();toast('💾 Salvo');};}}
function openSettings(){openMenu('settings');}
function confirmNew(){modal('🌱','Começar um novo império?',(hasSave()||started)?'<p>O save atual deste aparelho será substituído.</p>':'<p>Você chega a Wall Street com $3k.</p>',[{t:'Sim, começar do zero',fn:()=>{closeModal();wipeSave();LOCAL=null;startNew(true);}},{t:'Cancelar',fn:closeModal}]);}
function needName(){if(AVATAR.name&&AVATAR.name.length>=2)return false;toast('Escolha seu nome e visual primeiro');renderMenu('perso');setTimeout(()=>{const i=document.getElementById('pName');if(i)i.focus();},50);return true;}
let mpReady=Promise.resolve();
const mpWait=()=>{toast('Entrando em Wall Street…');return Promise.race([mpReady,new Promise(r=>setTimeout(r,2500))]);};
let joining=false;
async function play(){if(started){closeMenu();return;}if(needName()||joining)return;joining=true;try{
  if(hasSave()){await mpWait();let d=LOCAL;if(MP.on){const cloud=await MP.loadCloud();if(cloud&&(cloud.savedAt||0)>(d.savedAt||0))d=cloud;}loadGame(d);S.name=AVATAR.name;beginPlay();MP.sync();}
  else await startNew(false);}finally{joining=false;}}
async function startNew(forceFresh){if(needName())return;const nm=AVATAR.name;await mpWait();
  if(!forceFresh&&MP.on){const cloud=await MP.loadCloud();if(cloud&&cloud.S&&!cloud.S.over){loadGame(cloud);S.name=nm;beginPlay();toast('☁️ Save da nuvem carregado');return;}}
  newGame(nm);beginPlay();MP.sync();MP.news(nm+' acabou de chegar em Wall Street.');}
function beginPlay(){started=true;lastPhase=S.phase;paintGround();paintMiniBase();CAM.yaw=0;CAM.pitch=0.28;CAM.dist=7.5;closeMenu();buildToolbar();checkPhase();refreshHUD();refreshObj();saveLocal();LOCAL=readLocal();enterFullscreen();
  if(!HIST.length)HIST.push({d:S.day,n:Math.round(netWorth()),c:Math.round(S.cash)});
  setTimeout(()=>showHint('🕹️ Joystick anda · arraste a tela para olhar · ⭐ sua sede (placa dourada) tem freelas e banco.',5200),600);}
function enterFullscreen(){if(!isTouch||!SETTINGS.fullscreen||isStandalone())return;const el=document.documentElement;const p=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen?el.webkitRequestFullscreen():null;
  Promise.resolve(p).then(()=>{if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');}).catch(()=>{});}

/* ============================ APP (PWA) ============================ */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});addEventListener('appinstalled',()=>{installEvt=null;toast('📲 Auvra Club instalado');});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches)||navigator.standalone===true;}
function installApp(){if(installEvt){const ev=installEvt;installEvt=null;ev.prompt();return;}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  modal('📲','Instalar Auvra Club',ios?'<p>No Safari: toque em <b>Compartilhar</b> (quadrado com a seta ↑) → <b>Adicionar à Tela de Início</b> → <b>Adicionar</b>.</p>':'<p>No Chrome: menu <b>⋮</b> → <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</p>',[{t:'Ok',fn:closeModal}]);}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));

/* ============================ BOOT ============================ */
async function boot(){
  genWorld();paintGround();initScene();setupInput();
  LOCAL=readLocal();
  if(hasSave())loadGame(LOCAL);else newGame(AVATAR.name||'Visitante'); // o distrito aparece vivo atrás do menu
  rebuildHero();paintMiniBase();
  mpReady=MP.configured()?MP.start():Promise.resolve();mpReady.then(()=>{if(menuOpen&&!document.getElementById('mPage'))renderMenu('home');});
  document.getElementById('loading').classList.add('off');openMenu(AVATAR.name?'home':'perso');
  requestAnimationFrame(t=>{last=t;frame(t);});
  window.__townReady=true;
  window.__game={get S(){return S;},get hero(){return hero;},get companies(){return companies;},get buildings(){return buildings;},canBuild,foundCompany,tryPlace,startPlacing,BUILD,get placing(){return placing;},renderer:()=>renderer,camera:()=>camera,CAM,openMenu,closeMenu,TILE,TS,M,PX,WORLD:()=>WORLD,STATS:()=>renderer.info.render,setTod:v=>{tod=v;},sede:()=>sede,bFront,doInteract,get interact(){return interactTarget;}};}
boot().catch(e=>{console.error(e);window.__fail('Erro ao iniciar: '+(e&&e.message||e));});
</script>
