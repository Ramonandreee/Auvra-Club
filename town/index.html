  /* Wall Street — superfícies, controles e tipografia */
  :root{
    --bg:#080c12;--glass:rgba(13,19,27,.96);--glass2:#121a24;--surface:#1b2633;

    --r-sm:8px;--r-md:12px;--r-lg:16px;
    --e-1:0 2px 8px #0004;--e-2:0 6px 24px #0006;--e-3:0 12px 40px #0009;

    background:var(--surface);border-radius:var(--r-sm);color:var(--cream);

    background:var(--gold);color:var(--ink);border-color:var(--gold)

  .net{display:flex;align-items:center;justify-content:flex-end;gap:var(--s1)}
  .net svg{width:11px;height:11px}
  .dprog,.bar{background:var(--surface)}

const map=[]; const decor=[]; const buildings=[]; const workers=[];

const LM_INFO={
  trinity:{name:'Trinity Church',ico:'⛪',txt:'Igreja neogótica de 1846, no topo da Wall Street. Até 1890 foi o prédio mais alto de Nova York. No cemitério estão Alexander Hamilton e Robert Fulton.'},

  nyse:{name:'Bolsa de Valores',ico:'📈',txt:'Fachada neoclássica de 1903 com seis colunas coríntias e a bandeira gigante. É onde o mercado abre e fecha ao som do sino.',act:'market'},

  '14wall':{name:'14 Wall Street',ico:'🏢',txt:'Torre de 1912 coroada por uma pirâmide de degraus inspirada no Mausoléu de Halicarnasso.'},

function genWorld(){
  map.length=0;for(let y=0;y<MAPH;y++)map[y]=new Array(MAPW).fill(T.LOT);

  const st=(name,axis,a0,a1,b0,b1,kind,dirs)=>{if(axis==='v')fill(a0,b0,a1-a0+1,b1-b0+1,kind);else fill(b0,a0,b1-b0+1,a1-a0+1,kind);STREETS.push({name,axis,a0,a1,b0,b1,kind,dirs:dirs||0});};

  st('Pine St','h',6,7,8,61,T.ROAD,1);
  st('Wall St','h',18,20,8,11,T.ROAD,0);   // cruzamento com a Broadway (só sinalização)
  st('Wall St','h',18,20,12,36,T.PED);     // trecho de pedestres (Bolsa / Federal Hall)
  st('Wall St','h',18,20,37,65,T.ROAD,1);

  // parcelas: o que sobrou de lote vira prédio de enchimento (cânion de Manhattan) ou terreno à venda
  const r=rngSeed(1653), cx=24, cy=19;
  const blocks=[[13,9,21,16],[26,9,35,16],[40,9,49,16],[13,22,21,29],[28,22,35,29],[40,22,49,29],[13,0,21,4],[26,0,35,4],[40,0,49,4],
    [54,0,57,4],[54,9,57,16],[54,22,57,29],[54,34,57,39],[13,34,21,39],[28,34,35,39],[40,34,49,39],[63,0,64,16],[63,22,64,47],[0,0,5,4],[0,35,5,47],[20,43,21,47],[28,44,35,47],[40,44,49,47],[54,44,57,47]];
  const allLot=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(tileAt(x,y)!==T.LOT)return false;return true;};
  for(const [bx0,by0,bx1,by1] of blocks){const depth=by1-by0+1;const rows=depth>6?[[by0,by0+Math.floor(depth/2)-1],[by0+Math.floor(depth/2),by1]]:[[by0,by1]];
    for(const [ry0,ry1] of rows){let x=bx0;while(x<=bx1){let w=3+((r()*3)|0);if(bx1-(x+w-1)<2)w=bx1-x+1;const x1=Math.min(bx1,x+w-1);
      if(allLot(x,ry0,x1,ry1)){const d=Math.hypot((x+x1)/2-cx,(ry0+ry1)/2-cy);const east=x>=53;

  for(let i=0;i<90;i++){const gx=(rd()*7)|0,gy=6+((rd()*28)|0);if(tileAt(gx,gy)===T.PARK)decor.push({kind:'grave',gx:gx+rd(),gy:gy+rd(),s:0.7+rd()*0.6,a:rd()*0.3-0.15});}

    const P=o=>new THREE.MeshPhysicalMaterial(Object.assign({vertexColors:true,envMapIntensity:.4},o));
    return personMaterials[0]=[
      P({roughness:.86,sheen:.9,sheenRoughness:.65,sheenColor:new THREE.Color(0x8a8a8a)}),   // lã
      P({roughness:.76,sheen:.55,sheenRoughness:.55,sheenColor:new THREE.Color(0x9a9a9a)}),  // algodão

function facialTint(x,y,z,L,skin,hair){
  const gaussian=(v,width)=>Math.exp(-Math.pow(v/width,2));
  const front=sstep(.93,1.29,z);
  const corner=gaussian(Math.abs(x)-.32,.24);
  const cheek=front*corner*gaussian(y-6.96,.26);
  const socket=front*corner*gaussian(y-7.28,.20);
  const lipWidth=Math.max(0,1-Math.pow(x/.27,2));
  const lips=sstep(1.46,1.54,z)*lipWidth*gaussian(y-6.68,.115);
  const line=sstep(1.38,1.51,z)*lipWidth*gaussian(y-6.72,.034);
  const stubble=L.beard==='cheia'||L.beard==='sim'||L.beard===true?.76:L.beard==='por fazer'?.34:0;
  const beard=stubble*sstep(.64,1.22,z)*sstep(6.02,6.24,y)*
    (1-sstep(6.67+Math.abs(x)*.39,6.95+Math.abs(x)*.39,y))*(1-lips);
  const fem=L.build==='B';
  const noseSide=front*gaussian(Math.abs(x)-.16,.06)*gaussian(y-7.02,.22);           // sombra nas laterais do nariz
  const noseTip=sstep(1.55,1.7,z)*gaussian(x,.08)*gaussian(y-6.92,.09);              // ponta do nariz pega luz
  const under=front*gaussian(Math.abs(x)-.42,.13)*gaussian(y-6.82,.12);              // contorno sob as maçãs
  const lid=front*gaussian(Math.abs(x)-.31,.16)*gaussian(y-7.38,.05);                 // linha da pálpebra
  const variation=.024*Math.sin(x*68+y*97+z*110)+.012*Math.sin(x*190+y*230);
  const color=skin.clone().multiplyScalar(1+variation-.17*socket-.40*line-.09*noseSide+.06*noseTip-.06*under-(fem?.22:.12)*lid);
  const lipK=fem?1.7:1;color.r*=1+(fem?.16:.10)*cheek+.05*lips*lipK;
  color.g*=1-.19*lips*lipK-.047*cheek;
  color.b*=1-.10*lips*lipK-.028*cheek+(fem?.04*lips:0);
  return color.lerp(hair,Math.min(.92,beard)).getHex();
}

/* ============================ ROTAS (A*) — GPS e caminhada automática ============================ */
function tileCost(gx,gy,mode){const t=tileAt(gx,gy);if(t<0||t===T.BLD||t===T.WATER||buildingAt(gx,gy))return 0;

function updateTaxi(dt){const T_=TAXI;if(!T_||T_.ready||T_.riding)return;dt=Math.min(dt||0.016,0.1);const P=T_.path;T_.t0=T_.t0||performance.now();

  let rest=0;for(let i=T_.seg+1;i<P.length;i++)rest+=Math.hypot(P[i][0]-(i===T_.seg+1?T_.mesh.position.x:P[i-1][0]),P[i][1]-(i===T_.seg+1?T_.mesh.position.z:P[i-1][1]));
  const want=Math.min(10,Math.max(1.2,rest*0.7));T_.v+=(want-T_.v)*Math.min(1,dt*2);let step=T_.v*dt;
  while(step>0&&T_.seg<P.length-1){const m=T_.mesh.position,b=P[T_.seg+1],dx=b[0]-m.x,dz=b[1]-m.z,d=Math.hypot(dx,dz);

function staffKey(spec){return spec.kind+':'+(spec.job?spec.job.id:spec.co?spec.co.id:spec.rv?spec.rv.id:spec.key||'');}
function staffRole(spec){if(spec.kind==='shop')return spec.shop==='ravelle'?['estilo','Concierge do ateliê']:['estilo','Consultor(a) de estilo'];if(spec.kind==='nyse')return ['pregao','Especialista do pregão'];if(spec.kind==='broker')return ['corretora','Assessor(a) · '+brokerOf(spec.broker).n];if(spec.kind==='dealer')return ['vendedor','Consultor(a) de vendas'];if(spec.kind==='restaurant')return ['garcom','Garçom/garçonete'];if(spec.kind==='sede')return ['secretaria','Secretária executiva'];
  if(spec.kind==='office')return ['recepcao_own','Recepção'];if(spec.kind==='rival')return ['recepcao_rival','Recepção'];
  if(spec.kind==='job')return spec.job.style==='cafe'?['barista','Barista']:['recepcao_job','Recepção'];return null;}
function staffMem(spec){S.staff=S.staff||{};const k=staffKey(spec);if(!S.staff[k])S.staff[k]=Object.assign(persona(k),{rel:10,met:0,last:-1,talk:-1});return S.staff[k];}
function addStaff(spec){const role=staffRole(spec);if(!role)return;const W=INT.W,D=INT.D,ez=D/2-2.6;
  const free=(x,z)=>x>-W/2+0.7&&x<W/2-0.7&&z>-D/2+0.8&&z<D/2-0.6&&!INT.obst.some(o=>x>o.x0-0.6&&x<o.x1+0.6&&z>o.z0-0.6&&z<o.z1+0.6)&&!INT.people.some(p=>Math.hypot(p.x-x,p.z-z)<0.9)&&!INT.props.some(p=>Math.hypot(p.x-x,p.z-z)<0.9);
  let spot=null;for(const [dx,dz] of [[1.9,-0.9],[-1.9,-0.9],[2.6,-2.0],[-2.6,-2.0],[1.4,-2.6],[-1.4,-2.6],[3.2,-0.5],[-3.2,-0.5],[0,-3.4]]){if(free(dx,ez+dz)){spot=[dx,ez+dz];break;}}if(!spot)return;
  const mem=staffMem(spec),look=seededLook(staffKey(spec),spec.kind==='dealer'||spec.kind==='sede'?'banker':'worker');
  const p=addIntPerson(look,spot[0],spot[1],Math.atan2(0-spot[0],ez-spot[1]),'stand',{staff:role[0],roleName:role[1],mem,spec});INT.staffP=p;return p;}
function staffSay(mem,lines){return '"'+pick(lines)+'"';}
function openStaff(p,extra){INT.talkP=p;const mem=p.mem,T=TRAITS[mem.trait],spec=p.spec,first=mem.met===0,again=mem.last===S.day;
  if(!again){mem.met++;mem.last=S.day;}
  const greet=first?hello()+'! Eu sou '+mem.name.split(' ')[0]+'. '+pick(T.hi)+fameNote():again?pick(T.again):hello()+', '+esc(S.name.split(' ')[0])+'! '+pick(T.hi);
  const relBar='<div class="relbar"><span>Relação</span><i style="width:'+cl(mem.rel,0,100)+'%"></i></div>';
  const acts=staffActions(p).concat([{t:'💬 Conversar',d:mem.talk===S.day?'Já conversaram hoje':'Papo rápido (sem gastar energia)',dis:mem.talk===S.day,fn:()=>{mem.talk=S.day;mem.rel=Math.min(100,mem.rel+4+S.skills.charisma*0.05+lookBonus()*4);gainSkill('charisma',0.15);staffReply(p,smallTalk(mem.trait));}},
    {t:'↩ '+pick(T.bye).replace(/[!.]$/,''),fn:closeModal}]);
  modal('🧑‍💼',esc(mem.name)+' · '+p.roleName,'<p class="quote">'+(extra||'"'+greet+'"')+'</p><div class="small">'+T.n+'</div>'+relBar,acts);}
function staffReply(p,txt,more){modal('🧑‍💼',esc(p.mem.name),'<p class="quote">'+txt+'</p>',(more||[]).concat([{t:'↩ Voltar',fn:()=>openStaff(p,'"Mais alguma coisa?"')},{t:'Tchau',fn:closeModal}]));refreshHUD();}

    {t:'💡 Alguma recomendação?',d:mem.tip===S.day?'Já pediu hoje':'Opinião do(a) assessor(a)',dis:mem.tip===S.day,fn:()=>{mem.tip=S.day;ensureMk();const s=pick(STOCKS),a=analyst(s.t);staffReply(p,'"'+(a[0].startsWith('Compra')?'Eu olharia a '+s.n+' ('+s.t+'). '+s.txt:'Eu ficaria longe da '+s.n+' ('+s.t+') por enquanto.')+'" <span class="small">— não é garantia</span>');}}];}

  if(s==='garcom')return [{t:'☕ Café · $6',d:'⚡+4',fn:()=>eat(p,'Café',6,4,'"Café passado agora. Cuidado que tá quente."')},{t:'🍝 Prato executivo · $28',d:'⚡+12',fn:()=>eat(p,'Prato executivo',28,12,'"O de hoje é '+pick(['frango grelhado com purê','risoto de cogumelos','salmão com legumes','massa ao pomodoro'])+'. Excelente escolha."')},
    {t:'🥩 Jantar completo · $85',d:h<18?'A cozinha do jantar abre às 18:00':'⚡+22',dis:h<18,fn:()=>eat(p,'Jantar completo',85,22,'"O chef caprichou. Fica à vontade, a mesa é sua."')},{t:'👂 O que andam falando no salão?',fn:()=>staffReply(p,smallTalk(mem.trait))}];
  if(s==='barista'){const j=spec.job,mine=S.job&&S.job.id===j.id;return [{t:'☕ Espresso · $5',d:'⚡+5',fn:()=>eat(p,'Espresso',5,5,'"Um espresso duplo, do jeito que Wall Street gosta."')},{t:'🥐 Lanche · $12',d:'⚡+9',fn:()=>eat(p,'Lanche',12,9,'"Croissant quentinho. O de amêndoas acaba às dez."')},
    {t:mine?'💼 Falar com a gerência':'💼 Vocês estão contratando?',fn:()=>{closeModal();mine?openBoss(j):applyJob(j);}}];}
  if(s==='recepcao_job'){const j=spec.job,mine=S.job&&S.job.id===j.id;return [{t:mine?'💼 Falar com a chefia':'💼 Vim pela vaga de '+j.t,fn:()=>{closeModal();mine?openBoss(j):applyJob(j);}},
    {t:'☕ Aceito um café',d:mem.cafe===S.day?'Já tomou hoje':'Cortesia · ⚡+2',dis:mem.cafe===S.day,fn:()=>{mem.cafe=S.day;S.energy=Math.min(S.energy+2,120);staffReply(p,'"Da máquina mesmo, mas é cortesia. A chefia chega às '+fmtHour(j.hour)+'."');}}];}
  if(s==='recepcao_own'){const co=spec.co;return [{t:'📊 Como foi o dia?',fn:()=>{const pr=coProfit(co);staffReply(p,'"'+(pr>=0?'Dia bom! ':'Dia difícil… ')+'Lucro de '+money(pr)+'/dia, '+co.employees.length+' pessoas na equipe e operação em '+Math.round(co.ops)+'%.'+(co.ops<50?' A operação precisa de atenção.':'')+'"');}},
    {t:'🧾 Chamar o RH',fn:()=>{closeModal();openCompany(co);}}];}
  if(s==='secretaria')return [{t:'📅 Minha agenda',fn:()=>{closeModal();openOS('agenda');}},{t:'✉️ Algum recado?',fn:()=>{const n=(S.inbox||[]).filter(m=>!m.read).length;n?(closeModal(),openOS('msg')):staffReply(p,'"Nenhum recado novo. Silêncio raro por aqui."');}},{t:'🏦 Ligar para o banco',fn:()=>{closeModal();openBank();}}];

      else{mem.rel=Math.max(0,mem.rel-5);staffReply(p,'"Não posso falar sobre a empresa. Com licença."');}}}];}

  '<p class="small">Perguntas: '+c.asked+'/3</p>';const q=(key,t,d,fx)=>({t,d,dis:k[key]||c.asked>=3,fn:()=>{k[key]=true;c.asked++;if(fx)fx();interview(co,c,p);}});
  const hire=(sal,mood)=>{const acc=sal>=c.ask||Math.random()<0.25+(100-e.ambition)/160;if(!acc){co.cands.splice(co.cands.indexOf(c),1);S.rep.talent=Math.max(0,S.rep.talent-0.5);closeModal();toast(e.name+' recusou a proposta');removeCand(p);return;}
    e.salary=sal;e.happy=Math.min(100,(e.happy||62)+mood);if(c.red)e.competence=Math.max(30,e.competence-6);if(actHire(co,e)){co.cands.splice(co.cands.indexOf(c),1);closeModal();toast('🤝 '+e.name+' contratado(a) por '+money(sal)+'/dia');removeCand(p);refreshHUD();}};
  modal('🧑‍💼','Entrevista · '+esc(e.name),info,[q('exp','📄 "Fale da sua experiência"','Revela a competência real'),q('mot','🔥 "O que te motiva?"','Revela ambição e lealdade'),q('hard','⚠️ "Conte uma situação difícil"','Pode revelar um sinal de alerta',()=>{if(c.red)k.flag=true;}),q('ask','💵 "Qual a sua pretensão?"','Revela o salário pedido'),
    {t:'✅ Contratar pela pretensão'+(k.ask?' ('+money(c.ask)+')':''),fn:()=>hire(c.ask,4)},{t:'🤏 Oferecer 10% menos',d:'Pode recusar (depende da ambição)',fn:()=>hire(Math.round(c.ask*0.9),-4)},{t:'💎 Oferecer 10% mais',d:'Aceita e chega motivado(a)',fn:()=>hire(Math.round(c.ask*1.1),14)},{t:'↩ Dispensar',fn:()=>{co.cands.splice(co.cands.indexOf(c),1);closeModal();removeCand(p);}}]);}

  const key=pick(MEET_PLACES),pl=placeOf(key);if(!pl)return;const h=ri(10,18)+(Math.random()<.5?0.5:0);addAgenda({day:S.day+1,hour:h,kind:'meet',key,cid:c.id,title:'Reunião · '+c.name,who:c.role,place:pl});
  inbox(c.name,'Podemos conversar amanhã às '+fmtHour(h)+' em '+pl.name+'? Tenho uma proposta.',c.ico);}

  const cards=[['📊','Números','finance','Mostra dados da empresa'],['🗣️','Carisma','charisma','Conquista pela conversa'],['🧭','Visão','leadership','Fala do futuro'],['🤝','Histórico','rel','Lembra o que já fizeram juntos']];
  const play=()=>{if(round>=3)return finish();modal(c.ico,'Reunião com '+esc(c.name)+' · rodada '+(round+1)+'/3','<p class="small">'+esc(c.role)+(late>0.5?' · ⏰ você chegou '+Math.round(late*60)+' min atrasado(a)':' · ✔ pontual')+'</p>'+log_.map(l=>'<div class="small">'+l+'</div>').join('')+'<p>Escolha seu argumento:</p>',
    cards.map(([ico,n,sk,d])=>({t:ico+' '+n,d:d+' · força '+Math.round(sk==='rel'?c.rel:S.skills[sk]),fn:()=>{const v=sk==='rel'?c.rel:S.skills[sk];const ch=cl(0.32+v/90+(round===0&&late<0.5?0.08:0)-late*0.12,0.08,0.92);const ok=Math.random()<ch;if(ok)wins++;log_.push((ok?'✅ ':'❌ ')+n+(ok?' convenceu.':' não colou.'));round++;play();}})));};

      else if(c.kind==='banker'){if(S.debt>0){const v=Math.round(S.debt*0.15);S.debt-=v;res='🏦 Renegociou: −'+money(v)+' de dívida.';}else{S.rep.market+=2;res='🏦 Crédito pré-aprovado: +2 reputação no mercado.';}}
      else if(c.kind==='mentor'){for(const k of ['finance','leadership','negotiation'])gainSkill(k,0.6*wins);res='🎓 Conselhos valiosos: +habilidades.';}
      else if(c.kind==='client'){const co=pick(companies);if(co){co.scale+=0.25*wins;res='🤝 Contrato fechado: '+co.name+' ganhou escala.';}else{S.cash+=4000*S.phase;res='🤝 Projeto avulso: +'+money(4000*S.phase);}}
      else{const co=companies.find(x=>x.employees.length<maxStaff(x));if(co&&actHire(co,genPerson(true)))res='🎯 Talento estrela contratado para a '+co.name+'.';else{S.rep.talent+=2;res='🎯 +2 reputação com talentos.';}}}

    c.mem=c.mem||[];c.mem.unshift('Reunião dia '+S.day+': '+wins+'/3');log('🤝 Reunião com '+c.name+': '+res);closeModal();modal(c.ico,'Fim da reunião','<p>'+res+'</p><p class="small">Relação com '+esc(c.name)+': '+Math.round(c.rel)+'</p>',[{t:'Ok',fn:closeModal}]);refreshHUD();saveLocal();};play();}

/* ============================ TELA SEMPRE DEITADA (celular em pé = conteúdo girado) ============================ */
let ROT=false;
const PW=()=>window.__PW||window.innerWidth,PH=()=>window.__PH||window.innerHeight;
function VW(){return ROT?PH():window.innerWidth;}function VH(){return ROT?PW():window.innerHeight;}
function lp(x,y){return ROT?{x:y,y:PW()-x}:{x,y};}
function lrect(el){const r=el.getBoundingClientRect();if(!ROT)return r;const w=PW();return {left:r.top,top:w-r.right,width:r.height,height:r.width,right:r.top+r.height,bottom:w-r.right+r.width};}
function applyRot(){if(window.__measure)window.__measure();const want=isTouch&&PH()>PW();if(want!==ROT){ROT=want;if(!ROT)kbClose();}document.documentElement.classList.toggle('rot',ROT);}
applyRot();addEventListener('orientationchange',()=>setTimeout(()=>{applyRot();resize();},250));
/* ============================ TECLADO DEITADO (quando a tela está girada) ============================ */
let KB=null;
const KB_L={a:['qwertyuiop','asdfghjkl','⇧zxcvbnm⌫'],n:['1234567890','@._-!#$%&*','⇧+=?/()⌫']};
function kbOpen(inp){if(KB&&KB.inp===inp)return;kbClose();const el=document.createElement('div');el.id='kb';document.body.appendChild(el);KB={inp,el,mode:'a',up:false};
  inp.classList.add('kbon');kbRender();
  // sobe a caixa para o campo não ficar atrás do teclado
  const box=inp.closest('.abox,.modal,.panel');if(box){KB.box=box;KB.tf=box.style.transform;const over=lrect(inp).bottom-(VH()-lrect(el).height-12);
    if(over>0)box.style.transform=(KB.tf||(box.classList.contains('modal')?'translate(-50%,-50%)':''))+' translateY('+(-over)+'px)';}}
function kbClose(){if(!KB)return;KB.inp.classList.remove('kbon');if(KB.box)KB.box.style.transform=KB.tf||'';KB.el.remove();KB=null;}
function kbNext(){const box=KB.inp.closest('.abox,.modal,.panel')||document.body,f=[...box.querySelectorAll('input')].filter(kbField);return f[f.indexOf(KB.inp)+1]||null;}
function kbRender(){const {inp,el,mode,up}=KB,pw=inp.type==='password',v=inp.value;
  el.innerHTML='<div class="kprev"><span>'+esc(inp.placeholder||inp.getAttribute('aria-label')||'Digite')+'</span><b>'+esc(pw?'•'.repeat(v.length):v)+'▏</b></div>'+
    KB_L[mode].map(r=>'<div class="krow">'+[...r].map(c=>'<button data-k="'+esc(c)+'"'+(c==='⇧'||c==='⌫'?' class="w"':'')+'>'+esc(c==='⇧'?(mode==='a'?(up?'⬆':'⇧'):'⇧'):(up&&mode==='a'?c.toUpperCase():c))+'</button>').join('')+'</div>').join('')+
    '<div class="krow"><button class="w" data-k="mode">'+(mode==='a'?'123':'ABC')+'</button>'+(inp.type==='email'?'<button data-k="@">@</button><button data-k=".com">.com</button>':'')+'<button class="sp" data-k=" ">espaço</button><button class="ok" data-k="ok">'+(kbNext()?'Próximo':'OK')+'</button></div>';
  if(mode==='n')el.querySelectorAll('[data-k="⇧"]').forEach(b=>{b.style.visibility='hidden';});}
function kbKey(k){const {inp}=KB;const max=+inp.getAttribute('maxlength')||999;
  if(k==='ok'){const n=kbNext();kbClose();if(n)kbOpen(n);return;}if(k==='mode'){KB.mode=KB.mode==='a'?'n':'a';kbRender();return;}if(k==='⇧'){KB.up=!KB.up;kbRender();return;}
  if(k==='⌫')inp.value=inp.value.slice(0,-1);else{let c=KB.up&&KB.mode==='a'?k.toUpperCase():k;if(inp.value.length+c.length<=max)inp.value+=c;if(KB.up){KB.up=false;}}
  inp.dispatchEvent(new Event('input',{bubbles:true}));kbRender();}
const kbField=t=>t&&t.tagName==='INPUT'&&/^(text|email|password|search|)$/.test(t.type||'')&&!t.disabled&&!t.readOnly;
document.addEventListener('pointerdown',e=>{if(!ROT)return;const b=e.target.closest&&e.target.closest('#kb button');
  if(b){e.preventDefault();kbKey(b.dataset.k);return;}if(e.target.closest&&e.target.closest('#kb')){e.preventDefault();return;}
  if(kbField(e.target)){e.preventDefault();kbOpen(e.target);return;}if(KB&&!e.target.closest('button'))kbClose();},true);
document.addEventListener('focusin',e=>{if(ROT&&kbField(e.target)){e.target.blur();kbOpen(e.target);}},true);

let RS=null;
function rangeSet(inp,t){const r=lrect(inp),q=lp(t.clientX,t.clientY);const k=cl((q.x-r.left)/r.width,0,1),mn=+inp.min,mx=+inp.max,st=+inp.step||0.01;

function decorCost(home,lvl){return Math.max(3000,Math.round(HOME_DEF[home].p*[0,0.08,0.15,0.3][lvl]));}
function decorSpent(a){let t=0;for(let l=1;l<=(a.decor||0);l++)t+=decorCost(a.home,l);return t;}
function assetValue(){const a=S.assets;if(!a)return 0;return Math.round((a.cars&&a.cars.length?a.cars.reduce((t,c)=>t+CAR_DEF[c.tier].p,0):CAR_DEF[a.car||0].p)*0.7+HOME_DEF[a.home||0].p*0.9+decorSpent(a)*0.5);}
function loanLimit(){return Math.round((2000+Math.max(0,S.cash+S.escrow+equity()-S.debt)*0.22+S.rep.market*80)*(S.flags.banker?1.2:1));} // baseado no patrimônio LÍQUIDO (empréstimo não infla o próprio limite)
function loanRate(){const lev=S.debt/Math.max(1,loanLimit());return S.market.rate*(1+1.5*lev*lev)*(S.flags.banker?0.7:1);} // juros sobem com a alavancagem
function dailyInterest(){return S.debt*loanRate()/100/YEAR;}
function checkPhase(){const net=netWorth();for(let i=PHASES.length-1;i>=0;i--){const p=PHASES[i];if(net>=p.net&&(p.need!=="company"||companies.length>0)){if(p.n>S.phase){S.phase=p.n;S.phaseName=p.name;onPhaseUp(p);}break;}}}
function genPerson(star){const role=pick(ROLES);const t=S.rep.talent;const comp=star?ri(85,98):ri(Math.round(45+t/4),Math.round(85+t/6));
  return {id:'p'+Date.now()+ri(0,99999),name:pick(FIRST)+' '+pick(LAST),role:role.t,fam:role.fam,competence:Math.min(99,comp),ambition:ri(35,90),salary:Math.round((15+comp*0.8)*rnd(0.9,1.15)*(1+(S.phase-1)*0.15)),happy:62,tenure:0};}
/* fundação / equipe (empresa <-> prédio <-> funcionários-sprites) */
function makeCompany(nicheId,b){const n=NICHE[nicheId];const base=rnd(n.base[0],n.base[1])*(0.9+skillAvg()*0.01);
  const co={id:'co'+Date.now()+ri(0,99999),niche:nicheId,name:coName(n),baseRev:base,ops:42,scale:1,employees:[],overhead:Math.round(base*0.3),age:0,stake:1,expandN:0,b};if(b)b.co=co;return co;}
function buildDays(cost){return Math.max(2,Math.min(9,Math.round(1.5+cost/3500)));} // prazo da obra, em dias
function foundCompany(nicheId,gx,gy){const n=NICHE[nicheId];const b=placeBuilding(n.spr,gx,gy);const co=makeCompany(nicheId,b);co.build=co.buildTot=buildDays(n.cost);companies.push(co);S.cash-=n.cost;S.founded++;log('🏗️ Obra iniciada: '+co.name+' fica pronta em '+co.build+' dias.');return co;}
function placeSede(gx,gy){const b=placeBuilding('hq',gx,gy);b.sede=true;sede=b;return b;}
function addEmployee(co,e){e=e||genPerson();co.employees.push(e);if(co.b)spawnWorker(co.b,co);S.hires++;return e;}
function removeCompany(co){companies=companies.filter(c=>c!==co);const bi=buildings.indexOf(co.b);if(bi>=0)buildings.splice(bi,1);removeWorkersOf('co',co);}
/* ajusta a escala p/ o valuation bater com um alvo (aquisições: preço justo, não dinheiro grátis) */
function calibrate(co,target){co.scale=clamp(1+target/400000,1,6);for(let k=0;k<10;k++){const v=coValue(co);if(v<=0){co.baseRev*=1.6;continue;}co.baseRev=co.baseRev*Math.pow(target/v,0.85);}co.overhead=Math.round(co.baseRev*0.3);for(let k=0;k<6;k++){const v=coValue(co);if(v>0)co.baseRev*=Math.pow(target/v,0.85);}}
/* tick diário */
function endDay(){if(S.over)return;let coNet=0;
  companies.forEach(co=>{if(co.build>0){co.build--;if(co.build===0)log('🏗️ Obra concluída: '+co.name+' abriu as portas!');return;}co.age++;coNet+=coProfit(co)*stakeOf(co);co.ops=clamp(co.ops-(co.managed?rnd(0.05,0.35):rnd(0.4,1.1)),0,100);co.scale*=rnd(0.998,1.003);
    if(chance(NICHE[co.niche].risk*0.05)){co.scale*=rnd(.86,.94);log('⚠️ '+co.name+' perdeu um cliente grande.');}});
  S.cash+=coNet-dailyExpenses()-dailyInterest();S.energy=Math.min(100,(S.energy||0)+(S.slept?100:35));S.slept=false;
  employeeTick();marketTick();rivalTick();contactTick();
  if(S.flags.scandal>0){S.flags.scandal--;repUp('public',-0.3);}
  S.day++;if(S.day%10===0)S.season=SEASONS[(SEASONS.indexOf(S.season)+1)%4];
  if(S.cash<0){S.negDays++;if(S.negDays<5)toast('⚠️ Caixa negativo! Falência em '+(5-S.negDays)+' dia(s) — pegue empréstimo ou venda algo.');}else S.negDays=0;
  if(S.negDays>=5)S.over=true;
  S.peakNet=Math.max(S.peakNet,netWorth());checkPhase();
  if(!S.over&&S.day>3&&chance(0.2))fireEvent();
  afterDay();}
function employeeTick(){companies.forEach(co=>{for(let i=co.employees.length-1;i>=0;i--){const e=co.employees[i];e.tenure++;const lead=(S.skills.leadership-8)*0.2;
  e.happy=clamp((e.happy||60)+(co.ops>55?0.8:-1)+lead*0.3+rnd(-2,2),0,100);if(e.happy<28&&chance(0.13)){co.employees.splice(i,1);removeWorker(co);log('🚪 '+e.name+' pediu demissão da '+co.name+'.');}}});}
function marketTick(){const m=S.market;m.mood=clamp(m.mood+rnd(-.1,.1),-1,1);if(chance(0.04)){const r=Math.random();if(r<.33){m.cycle="recessão";m.target=.78;m.rate=clamp(m.rate+rnd(.5,2),1,18);log('📉 Recessão em Wall Street. Juros sobem.');}else if(r<.66){m.cycle="aquecido";m.target=1.28;m.rate=clamp(m.rate-rnd(.3,1.2),1,18);log('📈 Boom! Capital barato.');}else{m.cycle="estável";m.target=1.0;}}m.mult+=(m.target-m.mult)*0.15+m.mood*0.01;m.mult=clamp(m.mult,0.6,1.5);}
/* concorrentes vivos: têm prédio no mapa, crescem, quebram, roubam gente, fazem guerra de preço */
function maxRivals(){return 5+S.phase;}
function rivalScale(){return Math.max(40000,netWorth()*0.08);}
function genRival(n,value){n=n||pick(NICHES);return {id:'rv'+Date.now()+ri(0,99999),name:coName(n),niche:n.id,value:Math.round(value||rnd(0.4,1.4)*rivalScale()),drift:rnd(0.993,1.012),staff:ri(2,5),b:null};}
function placeRival(r,gx,gy){const n=NICHE[r.niche];if(gx==null){const sp=findFreeSpot(n.spr,false);if(!sp)return r;gx=sp.gx;gy=sp.gy;}const b=placeBuilding(n.spr,gx,gy);b.rv=r;r.b=b;for(let k=0;k<r.staff;k++){const w=spawnWorker(b,null);w.rv=r;}return r;}
function spawnRival(n,value,name){const r=genRival(n,value);if(name)r.name=name;rivals.push(r);placeRival(r);log('🏢 Nova concorrente no distrito: '+r.name+' ('+NICHE[r.niche].name+').');return r;}
function removeRival(r){rivals=rivals.filter(x=>x!==r);if(r.b){const bi=buildings.indexOf(r.b);if(bi>=0)buildings.splice(bi,1);removeWorkersOf('rv',r);}}
function rivalTick(){const mf=0.985+S.market.mult*0.015;for(const r of rivals.slice()){r.value=Math.max(8000,Math.round(r.value*r.drift*rnd(0.985,1.015)*mf));
  if((r.value<=9000&&chance(0.2))||chance(0.003)){removeRival(r);log('💀 '+r.name+' fechou as portas.');}}
  if(rivals.length<maxRivals()&&chance(0.07))spawnRival();}
/* contatos (networking diegético: você caminha até eles na praça) */
function genContact(def){return {id:'ct'+Date.now()+ri(0,99999),name:pick(FIRST)+' '+pick(LAST),kind:def.kind,role:def.role,ico:def.ico,rel:8,last:-99,lastDeal:-99,mem:[]};}
function contactTick(){contacts.forEach(c=>{if(S.day-c.last>7)c.rel=Math.max(0,c.rel-0.3);});}
function remember(c,t){c.mem.unshift('Dia '+S.day+': '+t);if(c.mem.length>4)c.mem.length=4;}
/* ações do jogador (gastam energia — 100 por dia) */
function useEnergy(n){if(S.energy<n){toast('😮‍💨 Sem energia para isso (precisa ⚡'+n+'). Networking, mercado e banco não gastam energia — para trabalhar de novo, coma algo ou durma em casa.');return false;}S.energy-=n;return true;}
function actFreelance(){if(!useEnergy(30))return 0;const pay=Math.round(rnd(180,320)*(1+skillAvg()*0.02)*(S.phase===1?1:0.7));S.cash+=pay;gainSkill(pick(['negotiation','charisma','finance','leadership']),0.9);S.stats.freelas++;return pay;}
function actStudy(k){const cost=150*S.phase;if(S.cash<cost){toast('Caixa insuficiente');return false;}if(!useEnergy(25))return false;S.cash-=cost;gainSkill(k,1.6);return true;}
function actImproveOps(co){if(co.opsDay===S.day){toast('Já otimizou a '+co.name+' hoje.');return false;}const c=opsCost(co);if(S.cash<c){toast('Caixa insuficiente ('+money(c)+')');return false;}if(!useEnergy(20))return false;
  S.cash-=c;co.opsDay=S.day;co.ops=clamp(co.ops+ri(8,14)+Math.round((S.skills.leadership-8)*0.15),0,100);gainSkill('leadership',0.5);return true;}
function actExpand(co){const c=expandCost(co);if(S.cash<c){toast('Caixa insuficiente ('+money(c)+')');return false;}S.cash-=c;co.scale+=0.3;co.expandN=(co.expandN||0)+1;gainSkill('finance',0.4);log('🏗️ '+co.name+' expandiu a operação.');return true;}
function actHire(co,e){if(co.build>0){toast('🏗️ '+co.name+' ainda está em obras — contrate quando abrir.');return false;}if(co.employees.length>=maxStaff(co)){toast('Prédio lotado ('+maxStaff(co)+') — expanda a operação.');return false;}if(totalStaff()>=staffCap()){toast('Limite do distrito ('+staffCap()+') — suba de fase.');return false;}
  const shave=clamp((S.skills.negotiation-8)*0.006,0,0.25);e.salary=Math.round(e.salary*(1-shave));addEmployee(co,e);gainSkill('negotiation',0.3);return true;}
function actManager(co){if(co.managed)return false;if(co.employees.length>=maxStaff(co)+1)return false;const mgr=genPerson();mgr.role='Gerente Geral';mgr.fam='any';mgr.competence=Math.max(mgr.competence,68);mgr.salary=Math.round(80+coRevenue(co)*0.12);co.managed=true;addEmployee(co,mgr);return true;}
function borrow(a){a=Math.min(a,loanLimit()-S.debt);if(a<=0){toast('Limite de crédito atingido');return 0;}S.debt+=a;S.cash+=a;return a;}
function repay(a){a=Math.min(a,S.debt,Math.max(0,S.cash));if(a<=0)return 0;S.debt-=a;S.cash-=a;return a;}
function rivalPrice(r){return Math.round(r.value*1.35*(1-clamp((S.skills.negotiation-10)*0.004,0,0.15)));}
function doAcquire(r){if(!rivals.includes(r))return null;const price=rivalPrice(r);if(S.cash<price)return null;S.cash-=price;const n=NICHE[r.niche];
  let b=r.b;if(!b){const sp=findFreeSpot(n.spr,false);b=placeBuilding(n.spr,sp?sp.gx:2,sp?sp.gy:2);}
  const co=makeCompany(r.niche,b);co.name=r.name;co.ops=55;co.age=30;co.acquired=true;b.rv=null;
  rivals=rivals.filter(x=>x!==r);removeWorkersOf('rv',r);
  const staff=Math.min(r.staff,1+Math.floor(r.value/40000));for(let k=0;k<staff;k++)addEmployee(co);companies.push(co);calibrate(co,r.value*rnd(0.95,1.08));
  repUp('market',3);S.founded++;S.stats.acq++;log('🦈 Você adquiriu a '+co.name+'.');gainSkill('negotiation',1);return co;}
function sellValue(co){return Math.round(coValue(co)*stakeOf(co));}
function doSell(co,price){S.cash+=price;removeCompany(co);log('🏷️ Você vendeu a '+co.name+' por '+money(price)+'.');}
function doIPO(co){if(co.public)return 0;const val=coValue(co);if(val<IPO_MIN)return 0;const raise=Math.round(val*0.35*rnd(1.0,1.2));S.cash+=raise;co.public=true;co.stake=stakeOf(co)*0.65;repUp('market',5);repUp('public',8);S.stats.ipos++;log('📊 IPO da '+co.name+' captou '+money(raise)+'.');return raise;}
function afterDay(){refreshHUD();refreshObj();if(S.day%3===0)saveLocal();MP.onDay();if(S.over)gameOver();}

/* ============================ MODAIS / PAINÉIS ============================ */
function modal(ico,title,bodyHTML,actions){closeModal();const sc=document.createElement('div');sc.id='scrim';sc.className='scrim';
  const m=document.createElement('div');m.className='modal panel';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-labelledby','modalTitle');m.innerHTML='<div class="mh" id="modalTitle">'+(ico||'')+' '+title+'</div><div class="mb">'+bodyHTML+'</div>';
  const ab=document.createElement('div');ab.className='mact';(actions||[{t:'Fechar',fn:closeModal}]).forEach(a=>{const btn=document.createElement('button');btn.className='mbtn'+(a.dis?' dis':'');btn.innerHTML='<b>'+a.t+'</b>'+(a.d?'<span>'+a.d+'</span>':'');btn.disabled=!!a.dis;if(!a.dis)btn.onclick=()=>a.fn&&a.fn();ab.appendChild(btn);});
  m.appendChild(ab);sc.appendChild(m);document.body.appendChild(sc);sc.onclick=e=>{if(e.target===sc&&!m.dataset.locked)closeModal();};return m;}
function closeModal(){talkingTo=null;const s=document.getElementById('scrim');if(s)s.remove();}
function kpi(k,v,c){return '<div class="kpi"><div class="k">'+k+'</div><div class="v" style="color:'+(c||'var(--cream)')+'">'+v+'</div></div>';}
function badges(co){return (co.managed?'<span class="tag">🧑‍✈️ gerida</span>':'')+(co.public?'<span class="tag">📊 aberta · você tem '+Math.round(stakeOf(co)*100)+'%</span>':(stakeOf(co)<1?'<span class="tag">🤝 você tem '+Math.round(stakeOf(co)*100)+'%</span>':''))+(co.acquired?'<span class="tag">🦈 adquirida</span>':'');}
const after=(fn)=>()=>{fn();checkPhase();refreshHUD();refreshObj();};
function openCompany(co){if(!companies.includes(co))return closeModal();const n=NICHE[co.niche];const rev=coRevenue(co),prof=rev-coCosts(co),val=coValue(co),syn=coSynergy(co),comp=competition(co);
  modal(n.ico,esc(co.name)+' · '+n.name,
   '<div class="kpis">'+kpi('Valuation',money(val),'var(--gold)')+kpi('Lucro/dia',(prof>=0?'+':'')+money(prof),prof>=0?'var(--green)':'var(--red)')+kpi('Equipe',co.employees.length+'/'+maxStaff(co))+kpi('Operação',Math.round(co.ops)+'%')+'</div>'+
   '<div style="margin:6px 0">'+badges(co)+(syn>1.001?'<span class="tag" style="color:var(--gold)">✦ sinergia ×'+syn.toFixed(2)+'</span>':'')+(comp<0.999?'<span class="tag" style="color:var(--red)">⚔️ concorrência −'+Math.round((1-comp)*100)+'%</span>':'')+'</div>'+
   '<p class="small">Escala ×'+co.scale.toFixed(2)+' · Expandir aumenta a capacidade (receita e vagas). Funcionários só se pagam com escala.</p>',
   [{t:'🧑‍💼 Contratar',d:'Vagas '+co.employees.length+'/'+maxStaff(co)+' · distrito '+totalStaff()+'/'+staffCap(),fn:()=>hireInto(co)},
    {t:'🏗️ Expandir operação ('+money(expandCost(co))+')',d:'Escala +0,3',fn:after(()=>{if(actExpand(co))toast('🏗️ Expandiu!');openCompany(co);}),dis:S.cash<expandCost(co)},
    {t:'📈 Otimizar operação ('+money(opsCost(co))+' · ⚡20)',d:co.opsDay===S.day?'Já feito hoje':'+eficiência (1×/dia)',fn:after(()=>{if(actImproveOps(co))toast('Operação otimizada');openCompany(co);}),dis:co.opsDay===S.day},
    co.managed?null:{t:'🧑‍✈️ Contratar gerente',d:'Operação decai bem mais devagar',fn:after(()=>{if(!actManager(co))toast('Sem vaga p/ gerente');openCompany(co);})},
    (!co.public&&S.phase>=3)?{t:'📊 IPO',d:val>=IPO_MIN?'Vende 35% na bolsa (~'+money(val*0.35)+')':'Precisa valer '+money(IPO_MIN),dis:val<IPO_MIN,fn:()=>ipoModal(co)}:null,
    {t:'🏷️ Vender ('+money(sellValue(co))+')',d:'Exit para um fundo',fn:()=>sellModal(co)},
    {t:'↩ Fechar',fn:closeModal}].filter(Boolean));}
function sellModal(co){const v=sellValue(co);modal('🏷️','Vender '+esc(co.name),'<p>Um fundo avalia sua parte em <b style="color:var(--gold)">'+moneyFull(v)+'</b>.</p>',[{t:'✅ Vender por '+money(v),fn:after(()=>{doSell(co,v);toast('Exit: '+money(v));closeModal();})},{t:'↩ Manter',fn:()=>openCompany(co)}]);}
function ipoModal(co){const val=coValue(co);modal('📊','Abrir capital — '+esc(co.name),'<p>A Bolsa compra <b>35%</b> da empresa por ~<b style="color:var(--gold)">'+money(val*0.35)+'</b>. Você segue no comando, mas passa a ter '+Math.round(stakeOf(co)*65)+'% dos lucros e do valor.</p><p class="small">Empresas abertas podem sofrer <b>aquisição hostil</b> de outros jogadores.</p>',
  [{t:'📈 Fazer IPO',fn:after(()=>{const r=doIPO(co);toast('IPO! +'+money(r));MP.news(S.name+' abriu o capital da '+co.name+' (+'+money(r)+')');closeModal();})},{t:'↩ Ainda não',fn:()=>openCompany(co)}]);}
function hireInto(co){const cands=[genPerson(),genPerson(),genPerson()];
  modal('🧑‍💼','Entrevistas · '+esc(co.name),'<p class="small">Competência puxa receita; salário puxa custo. Reputação de talento melhora os candidatos.</p>',
    cands.map(c=>({t:esc(c.name)+' — '+c.role,d:'Competência '+c.competence+' · '+moneyFull(c.salary)+'/dia',fn:after(()=>{if(actHire(co,c))toast('Contratado: '+c.name);openCompany(co);})})).concat([{t:'↩ Voltar',fn:()=>openCompany(co)}]));}
function openRival(r){if(!rivals.includes(r))return closeModal();const n=NICHE[r.niche];const price=rivalPrice(r);
  modal(n.ico,esc(r.name)+' · concorrente','<div class="kpis">'+kpi('Valuation',money(r.value),'var(--red)')+kpi('Setor',n.name)+kpi('Equipe',r.staff)+kpi('Preço (M&A)',money(price),'var(--gold)')+'</div><p class="small">Concorrentes no mesmo setor reduzem sua receita. Comprar elimina a concorrência e o prédio vira seu.</p>',
  [{t:'🦈 Adquirir por '+money(price),d:S.phase<2?'Liberado na fase Crescimento':(S.cash<price?'Caixa insuficiente':'O prédio e a equipe viram seus'),dis:S.phase<2||S.cash<price,fn:after(()=>{const co=doAcquire(r);if(co){toast('🦈 Adquiriu '+co.name);MP.news(S.name+' adquiriu a '+co.name);openCompany(co);}})},{t:'↩ Fechar',fn:closeModal}]);}
function openSede(){modal('⭐','Sua Sede — '+esc(S.name),'<div class="kpis">'+kpi('Patrimônio',money(netWorth()),'var(--gold)')+kpi('Energia','⚡'+Math.round(S.energy))+kpi('Negociação / Carisma',Math.round(S.skills.negotiation)+' / '+Math.round(S.skills.charisma))+kpi('Finanças / Liderança',Math.round(S.skills.finance)+' / '+Math.round(S.skills.leadership))+'</div>',
  [{t:'💻 Fazer freela (⚡30)',d:S.phase===1?'Dinheiro rápido para começar':'Rende menos agora que você é empresário',fn:after(()=>{const p=actFreelance();if(p)toast('💵 Freela: +'+money(p));openSede();})},
   {t:'📚 Curso de finanças ('+money(150*S.phase)+' · ⚡25)',d:'Finanças melhora seus negócios',fn:after(()=>{if(actStudy('finance'))toast('📚 Finanças +');openSede();})},
   {t:'🎖️ Curso de liderança ('+money(150*S.phase)+' · ⚡25)',d:'Equipes mais felizes e operação melhor',fn:after(()=>{if(actStudy('leadership'))toast('🎖️ Liderança +');openSede();})},
   {t:'🏦 Banco',fn:openBank},{t:'↩ Fechar',fn:closeModal}]);}
function openBank(){const lim=loanLimit(),avail=Math.max(0,lim-S.debt);
  modal('🏦','Banco · 23 Wall Street','<div class="kpis">'+kpi('Dívida',money(S.debt),S.debt>0?'var(--red)':'var(--cream)')+kpi('Crédito livre',money(avail),'var(--green)')+kpi('Juros',loanRate().toFixed(1)+'% a.a.'+(S.flags.banker?' (−30%)':''))+kpi('Juros/dia',money(dailyInterest()))+'</div><p class="small">1 ano = 40 dias. Juros sobem na recessão e quanto mais você deve. Caixa negativo por 5 dias = falência.</p>',
  [{t:'💵 Pegar '+money(Math.min(avail,Math.max(2000,Math.round(lim*0.25)))),dis:avail<=0,fn:after(()=>{const a=borrow(Math.max(2000,Math.round(lim*0.25)));if(a)toast('+'+money(a)+' emprestado');openBank();})},
   {t:'💰 Pegar tudo ('+money(avail)+')',dis:avail<=0,fn:after(()=>{const a=borrow(avail);if(a)toast('+'+money(a)+' emprestado');openBank();})},
   {t:'↩️ Pagar 25%',dis:S.debt<=0||S.cash<=0,fn:after(()=>{repay(Math.max(1,Math.round(S.debt*0.25)));openBank();})},
   {t:'✅ Quitar tudo',dis:S.debt<=0||S.cash<S.debt,fn:after(()=>{repay(S.debt);toast('Dívida quitada!');openBank();})},{t:'↩ Fechar',fn:closeModal}]);}
function openContact(c){const ok=S.day!==c.last;const rl=c.rel>=60?'aliado(a)':c.rel>=35?'próximo(a)':c.rel>=15?'conhecido(a)':'estranho(a)';const acts=[];
  acts.push({t:'☕ Conversar',d:ok?'Relação +, carisma +':'Já conversaram hoje',dis:!ok,fn:after(()=>{c.rel=clamp(c.rel+6+S.skills.charisma*0.08,0,100);c.last=S.day;gainSkill('charisma',0.6);remember(c,'tomamos um café');
    if(c.kind==='mentor'){const k=pick(['finance','leadership']);gainSkill(k,c.rel>=20?1.4:0.5);toast('🎓 Mentoria: '+(k==='finance'?'finanças':'liderança')+' +');}else toast('☕ '+c.name.split(' ')[0]+' gostou da conversa');openContact(c);})});
  if(c.kind==='investor'){const co=companies.filter(x=>stakeOf(x)>0.5).sort((a,b)=>coValue(b)-coValue(a))[0];const cd=S.day-c.lastDeal>=20;const amt=co?Math.round(Math.max(5000,coValue(co)*0.15*1.1)):0;
    acts.push({t:'💼 Pedir aporte',d:!co?'Precisa de uma empresa':c.rel<45?'Relação mínima 45':!cd?'Ela investiu recentemente':'+'+money(amt)+' por 15% da '+esc(co.name),dis:!co||c.rel<45||!cd,fn:after(()=>{S.cash+=amt;co.stake=stakeOf(co)-0.15;c.lastDeal=S.day;remember(c,'investiu na '+co.name);toast('💼 Aporte de '+money(amt));openContact(c);})});}
  if(c.kind==='banker')acts.push({t:'🏦 Pedir condições especiais',d:S.flags.banker?'Já concedidas (juros −30%, crédito +20%)':c.rel<30?'Relação mínima 30':'Juros −30% e crédito +20%',dis:!!S.flags.banker||c.rel<30,fn:after(()=>{S.flags.banker=true;remember(c,'liberou condições especiais');toast('🏦 Condições especiais!');openContact(c);})});
  if(c.kind==='client'){const cd=S.day-c.lastDeal>=8;const pay=Math.round((500+S.skills.negotiation*15)*Math.pow(S.phase,1.6));acts.push({t:'🤝 Fechar contrato (⚡25)',d:c.rel<25?'Relação mínima 25':!cd?'Próximo contrato em '+(8-(S.day-c.lastDeal))+' dias':'+'+money(pay)+' e reputação de mercado',dis:c.rel<25||!cd,fn:after(()=>{S.cash+=pay;c.lastDeal=S.day;repUp('market',1);gainSkill('negotiation',1);remember(c,'fechamos contrato');toast('🤝 Contrato: +'+money(pay));openContact(c);})});}
  if(c.kind==='headhunter'){const fee=1500*S.phase;acts.push({t:'🎯 Buscar um talento estrela ('+money(fee)+')',d:c.rel<30?'Relação mínima 30':!companies.length?'Precisa de uma empresa':'Competência 85–98',dis:c.rel<30||!companies.length||S.cash<fee,fn:()=>{const star=genPerson(true);modal('🎯','Talento: '+esc(star.name),'<p>'+star.role+' · competência <b>'+star.competence+'</b> · '+moneyFull(star.salary)+'/dia</p>',companies.map(co=>({t:'Contratar na '+esc(co.name),d:co.employees.length+'/'+maxStaff(co),fn:after(()=>{if(actHire(co,star)){S.cash-=fee;remember(c,'achou '+star.name+' para você');toast('⭐ '+star.name+' contratada');}closeModal();})})).concat([{t:'↩ Voltar',fn:()=>openContact(c)}]));}});}
  if(c.kind==='trader'||c.kind==='investor'){const cd=c.tipDay!==S.day;acts.push({t:'📈 Pedir uma dica de ação',d:c.rel<20?'Relação mínima 20':!cd?'Já pediu hoje':'Dica de quem está no mercado',dis:c.rel<20||!cd,fn:()=>{c.tipDay=S.day;ensureMk();const s=pick(STOCKS.filter(x=>x.t!=='NX500'));const good=chance(0.55+c.rel/250);S.mk.tips[s.t]={k:good?0.009+c.rel/9000:-0.008,until:S.day+3};remember(c,'deu uma dica de '+s.t);
      modal('📈','Dica de '+esc(c.name.split(' ')[0]),'<p class="quote">"'+(good?'Fica de olho na '+s.n+' ('+s.t+'). Vem notícia boa por aí.':'Se tiver '+s.t+', eu venderia. Tem coisa feia vindo.')+'"</p><p class="small">Dicas valem por alguns dias — e ninguém acerta sempre.</p>',[{t:'📈 Abrir investimentos',fn:()=>{closeModal();openInvest();}},{t:'↩ Voltar',fn:()=>openContact(c)}]);}});}
  if(c.kind==='press'){const cd=S.day-(c.lastDeal||-99)>=7;acts.push({t:'📰 Dar uma entrevista',d:!cd?'Próxima em '+(7-(S.day-c.lastDeal))+' dias':c.rel<20?'Relação mínima 20':'Reputação pública +',dis:!cd||c.rel<20,fn:after(()=>{c.lastDeal=S.day;const g=2+c.rel/25;repUp('public',g);remember(c,'publicou uma matéria');MP.news(S.name+' deu entrevista sobre Wall Street');toast('📰 Matéria publicada · ⭐ +'+g.toFixed(1));openContact(c);})});}
  acts.push({t:'↩ Fechar',fn:closeModal});
  modal(c.ico,esc(c.name)+' · '+c.role+(c.trait&&TRAITS[c.trait]?' · '+TRAITS[c.trait].n.toLowerCase():''),'<div class="lab"><span>Relação: '+rl+'</span><b>'+Math.round(c.rel)+'/100</b></div><div class="bar"><i style="width:'+c.rel+'%"></i></div>'+(c.mem.length?'<p class="small" style="margin-top:8px">Lembra de: '+c.mem.map(esc).join(' · ')+'</p>':'<p class="small" style="margin-top:8px">Vocês ainda não se conhecem.</p>'),acts);
  talkingTo=workers.find(w=>w.contact===c)??null;
}
function openTeam(){const tot=totalStaff();
  modal('🏢','Suas empresas — '+tot+'/'+staffCap()+' funcionários',companies.length?companies.map(c=>{const n=NICHE[c.niche];const pf=coProfit(c)*stakeOf(c);return '<div class="lrow" data-co="'+c.id+'"><span>'+n.ico+' <b>'+esc(c.name)+'</b></span><span class="dim">'+c.employees.length+' func · <span style="color:'+(pf>=0?'var(--green)':'var(--red)')+'">'+(pf>=0?'+':'')+money(pf)+'/d</span></span></div>';}).join(''):'<div class="dim">Sem empresas. Use 🔨 Construir (ou faça freelas na ⭐ Sede para juntar caixa).</div>',[{t:'↩ Fechar',fn:closeModal}]);
  document.querySelectorAll('.lrow[data-co]').forEach(el=>el.onclick=()=>{const c=companies.find(x=>x.id===el.dataset.co);if(c)openCompany(c);});}
function openMarket(){const m=S.market;
  const npc=rivals.slice().sort((a,b)=>b.value-a.value).map(r=>{const n=NICHE[r.niche];return '<div class="lrow" data-rv="'+r.id+'"><span>'+n.ico+' <b>'+esc(r.name)+'</b></span><span class="dim">'+money(r.value)+' · ~<b style="color:var(--gold)">'+money(rivalPrice(r))+'</b></span></div>';}).join('')||'<div class="dim">Sem concorrentes no radar.</div>';
  const fr=MP.on?(MP.listings.length?MP.listings.map(l=>{const n=NICHE[l.niche]||NICHES[0];return '<div class="lrow" data-ls="'+esc(l.id)+'"><span>'+n.ico+' <b>'+esc(l.name)+'</b> <span class="dim">de '+esc(l.owner_name)+'</span>'+(l.is_public?' <span class="tag">📊 aberta</span>':'')+'</span><span class="dim">'+money(l.value)+'</span></div>';}).join(''):'<div class="dim">Nenhuma empresa de amigos ainda.</div>'):'<div class="dim">Offline — entre online para negociar com amigos.</div>';
  modal('📈','Mercado — Bolsa de Wall Street','<div class="kpis">'+kpi('Ciclo',m.cycle.toUpperCase(),m.cycle==='recessão'?'var(--red)':m.cycle==='aquecido'?'var(--green)':'var(--gold)')+kpi('Multiplic.','×'+m.mult.toFixed(2))+kpi('Juros',m.rate.toFixed(1)+'% a.a.')+kpi('Humor',m.mood>.2?'otimista':m.mood<-.2?'pessimista':'neutro')+'</div>'+
   '<div class="sec">🦈 CONCORRENTES (M&A'+(S.phase<2?' — liberado na fase 2':'')+')</div>'+npc+'<div class="sec">🌐 EMPRESAS DE AMIGOS</div>'+fr,[{t:'🔄 Atualizar',fn:async()=>{await MP.fetchListings();openMarket();}},{t:'↩ Fechar',fn:closeModal}]);
  document.querySelectorAll('.lrow[data-rv]').forEach(el=>el.onclick=()=>{const r=rivals.find(x=>x.id===el.dataset.rv);if(r)openRival(r);});
  document.querySelectorAll('.lrow[data-ls]').forEach(el=>el.onclick=()=>{const l=MP.listings.find(x=>x.id===el.dataset.ls);if(l)openListing(l);});}
function openListing(l){const n=NICHE[l.niche]||NICHES[0];const hp=Math.ceil(l.value*1.5*l.stake);const offers=[1.1,1.3,1.6].map(f=>Math.ceil(l.value*f));
  modal(n.ico,esc(l.name)+' · de '+esc(l.owner_name),'<div class="kpis">'+kpi('Valuation',money(l.value),'var(--gold)')+kpi('Lucro/dia',money(l.profit))+kpi('Equipe',l.employees)+kpi('Status',l.is_public?'Aberta ('+Math.round(l.stake*100)+'% do dono)':'Fechada')+'</div><p class="small">Ofertas ficam reservadas (o dinheiro sai do seu caixa) até '+esc(l.owner_name)+' responder. Recusou → você recebe de volta.</p>',
   offers.map(p=>({t:'✉️ Oferecer '+money(p),d:S.phase<2?'Fase 2+':S.cash<p?'Caixa insuficiente':'Proposta amigável',dis:S.phase<2||S.cash<p,fn:async()=>{closeModal();await MP.makeOffer(l,p);}}))
   .concat(l.is_public?[{t:'⚔️ Aquisição hostil ('+money(hp)+')',d:S.phase<3?'Fase 3+':S.cash<hp?'Caixa insuficiente':'Compra as ações na bolsa — sem pedir licença',dis:S.phase<3||S.cash<hp,fn:async()=>{closeModal();await MP.hostile(l,hp);}}]:[]).concat([{t:'↩ Voltar',fn:openMarket}]));}
function openFriends(){MP.unread=0;buildToolbar();const on=Object.values(MP.online);const deals=MP.deals.filter(d=>d.status==='pending');
  const inc=deals.filter(d=>d.seller===MP.uid),out=deals.filter(d=>d.buyer===MP.uid);
  const body=!MP.on?'<p>'+esc(MP.status)+'</p><p class="small">O jogo funciona offline (save local). Para jogar com amigos, o servidor precisa estar configurado — ver <b>town/README.md</b>.</p>':
   '<div class="sec">🟢 ONLINE AGORA ('+on.length+')</div>'+(on.map(p=>'<div class="lrow"><span><b>'+esc(p.name)+'</b>'+(p.id===MP.uid?' (você)':'')+'</span><span class="dim">Fase '+(p.phase|0)+' · '+money(p.net||0)+'</span></div>').join('')||'<div class="dim">Só você.</div>')+
   (inc.length?'<div class="sec">✉️ OFERTAS RECEBIDAS</div>'+inc.map(d=>'<div class="lrow"><span><b>'+esc(d.buyer_name)+'</b> quer a <b>'+esc(d.company.name)+'</b></span><span><b style="color:var(--gold)">'+money(d.price)+'</b> <button class="sbtn" data-acc="'+d.id+'">Aceitar</button><button class="sbtn" data-dec="'+d.id+'">Recusar</button></span></div>').join(''):'')+
   (out.length?'<div class="sec">📤 SUAS OFERTAS</div>'+out.map(d=>'<div class="lrow"><span>'+esc(d.company.name)+' de '+esc(d.seller_name)+'</span><span class="dim">'+money(d.price)+' · aguardando <button class="sbtn" data-can="'+d.id+'">Cancelar</button></span></div>').join(''):'')+
   '<div class="sec">🏆 RANKING DE PATRIMÔNIO</div>'+(MP.board.map((p,i)=>'<div class="lrow"><span>'+(i+1)+'. <b>'+esc(p.name)+'</b>'+(p.id===MP.uid?' (você)':'')+'</span><span class="dim">Fase '+p.phase+' · '+money(p.net_worth)+'</span></div>').join('')||'<div class="dim">Carregando…</div>')+
   '<div class="sec">💬 CHAT</div><div class="chat" id="chatBox">'+MP.chat.map(m=>'<div><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>').join('')+'</div><div class="chatin"><input id="chatIn" maxlength="200" placeholder="Mensagem para quem está online…"><button class="sbtn" id="chatSend">Enviar</button></div>';
  modal('🌐','Amigos — Wall Street online',body,[{t:'🔄 Atualizar',fn:async()=>{await MP.refreshAll();openFriends();}},{t:'↩ Fechar',fn:closeModal}]);
  const cb=document.getElementById('chatBox');if(cb)cb.scrollTop=cb.scrollHeight;
  const send=()=>{const i=document.getElementById('chatIn');if(i&&i.value.trim()){MP.say(i.value.trim());i.value='';}};
  const sb=document.getElementById('chatSend');if(sb)sb.onclick=send;const ci=document.getElementById('chatIn');if(ci)ci.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')send();};
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>MP.respond(+b.dataset.acc,true));
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>MP.respond(+b.dataset.dec,false));

    else if(data&&data.status==='cancelled')toast('Essa empresa não está mais à venda.');else toast('Oferta recusada');
    checkPhase();refreshHUD();refreshObj();saveLocal();this.saveCloud();this.sync();await this.fetchDeals();openFriends();},
  async cancel(id){const {error}=await this.sb.rpc('cancel_offer',{p_deal:id});if(error)return toast('Erro: '+error.message);await this.processDeals();openFriends();},
  joinRealtime(){const ch=this.sb.channel('meridian',{config:{presence:{key:this.uid}}});this.ch=ch;
    ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState();this.online={};for(const k in st){const p=st[k][0];if(p)this.online[k]=p;}refreshHUD();})
      .on('broadcast',{event:'chat'},({payload})=>{this.chat.push(payload);if(this.chat.length>60)this.chat.shift();const cb=document.getElementById('chatBox');if(cb){cb.insertAdjacentHTML('beforeend','<div><b>'+esc(payload.name)+':</b> '+esc(payload.text)+'</div>');cb.scrollTop=cb.scrollHeight;}else{this.unread++;buildToolbar();toast('💬 '+payload.name+': '+String(payload.text).slice(0,60));}})
      .on('broadcast',{event:'news'},({payload})=>{log('🌐 '+payload.text);toast('📰 '+payload.text);})
      .on('postgres_changes',{event:'*',schema:'public',table:'deals',filter:'seller=eq.'+this.uid},()=>{this.processDeals();})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'deals',filter:'buyer=eq.'+this.uid},()=>{this.processDeals();})
      .subscribe(st=>{if(st==='SUBSCRIBED')ch.track({id:this.uid,name:S.name,phase:S.phase,net:Math.round(netWorth())});});},
  say(text){if(!this.ch)return;const m={name:S.name,text:text.slice(0,200),t:Date.now()};this.ch.send({type:'broadcast',event:'chat',payload:m});this.chat.push(m);const cb=document.getElementById('chatBox');if(cb){cb.insertAdjacentHTML('beforeend','<div><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>');cb.scrollTop=cb.scrollHeight;}},
  news(text){if(this.ch)this.ch.send({type:'broadcast',event:'news',payload:{text}});},
  onDay(){if(!this.on)return;this.sync();this.saveCloud();this.processDeals();},
  async start(){if(!(await this.init()))return;await this.begin();},
  async begin(){if(!this.on)return;this.joinRealtime();await this.sync();this.processDeals();this.fetchBoard();}};

function bindCharacter(){

  panel.addEventListener('click',e=>{const b=e.target.closest('.rstep');if(!b)return;const i=$(b.dataset.for);if(!i)return;i.value=cl(+i.value+(+b.dataset.d)*(i.max-i.min)/12,+i.min,+i.max);i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));});
  const remember=()=>{
    const {name,...look}=AVATAR;avatarUndo.push(look);
    if(avatarUndo.length>24)avatarUndo.shift();
    $('pUndo').disabled=false;
  };
  const change=()=>{saveAvatar();rebuildHero();};
  function refreshView(){
    const close=previewFace();
    $('pMotion').value=previewMotion;
    $('pView').textContent=close?'Corpo inteiro':'Aproximar';
    $('pView').setAttribute('aria-pressed',close);
  }
  function options(reset){
    const active=document.activeElement;
    const activeChip=active?.matches('#pOptions .chip')?[active.dataset.k,active.dataset.v]:null;
    const scroll=reset?0:panel.scrollTop;
    panel.innerHTML=avatarOptions();panel.scrollTop=scroll;
    const tabs=document.querySelectorAll('[data-tab]');
    for(const tab of tabs){
      const on=tab.dataset.tab===avatarTab;tab.setAttribute('aria-selected',on);tab.tabIndex=on?0:-1;
      if(on){panel.setAttribute('aria-labelledby',tab.id);tab.scrollIntoView({block:'nearest',inline:'nearest'});}
    }
    if(activeChip){
      const match=Array.from(panel.querySelectorAll('.chip')).find(c=>c.dataset.k===activeChip[0]&&c.dataset.v===activeChip[1]);
      match?.focus({preventScroll:true});
    }
    $('pUndo').disabled=!avatarUndo.length;
    refreshView();
  }
  const chooseTab=tab=>{avatarTab=tab.dataset.tab;previewClose=null;options(true);};
  const tabs=[...document.querySelectorAll('[data-tab]')];
  for(const tab of tabs){
    tab.onclick=()=>chooseTab(tab);
    tab.onkeydown=e=>{
      const i=tabs.indexOf(tab), direction=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
      if(!direction&&e.key!=='Home'&&e.key!=='End')return;
      e.preventDefault();
      const next=tabs[direction?(i+direction+tabs.length)%tabs.length:e.key==='Home'?0:tabs.length-1];
      chooseTab(next);next.focus();
    };
  }
  panel.onclick=e=>{
    if(e.target.closest('#pPhaseLook')){
      const [topStyle,top,pants,shoeStyle]=PHASE_OUTFITS[S.phase-1];if(!owned('topStyle',topStyle)||!owned('shoeStyle',shoeStyle))return toast('🔒 Esse visual tem peças que você ainda não comprou.');
      remember();Object.assign(AVATAR,{topStyle,top,pants,shoeStyle});change();options(false);
      $('pPhaseLook').focus();return;

    if(chip.dataset.lock){const wi=witem(chip.dataset.k,chip.dataset.v),sp=SPECIAL['shop:'+wi[4]];toast('🔒 '+itemName(wi[0],wi[1])+' · '+money(wi[2])+' na '+SHOPS[wi[4]].n+(started&&sp?' — marcado no mapa':''));if(started&&sp)setWaypoint(sp.front[0],sp.front[1],SHOPS[wi[4]].n);return;}
    const {k,v}=chip.dataset, value=chip.classList.contains('sw')?Number(v):v;
    if(AVATAR[k]===value)return;
    remember();AVATAR[k]=value;if(k==='gender'){AVATAR.build=value==='f'?'B':'A';if(value==='f')AVATAR.beard='não';fixGender();}change();options(false);
  };
  panel.oninput=e=>{
    const {shape}=e.target.dataset;if(!shape)return;
    if(!e.target.dataset.editing){remember();e.target.dataset.editing='true';}
    AVATAR[shape]=Number(e.target.value);change();
  };
  panel.onchange=e=>{delete e.target.dataset.editing;};
  $('pRandom').onclick=()=>{
    remember();
    for(const rows of Object.values(AVATAR_CHOICES)){
      for(const [k,,vals,color] of rows){
        const i=Math.floor(Math.random()*vals.length);AVATAR[k]=color?i:vals[i];
      }

    for(const [k,[,min,max]] of Object.entries(AVATAR_RANGES)){
      AVATAR[k]=Math.round(lerp(min,max,Math.random())*100)/100;
    }

  };
  $('pUndo').onclick=()=>{
    if(!avatarUndo.length)return;

    if(!avatarUndo.length)$('pRandom').focus();
  };
  $('pView').onclick=()=>{
    previewClose=!previewFace();refreshView();
  };

    previewMotion=e.target.value;previewClose=null;refreshView();
  };
  const view=document.querySelector('.avatar-view');

  view.onpointerdown=e=>{
    if(!e.isPrimary||e.target.closest('button,select'))return;
    dragX=lp(e.clientX,e.clientY).x;view.setPointerCapture(e.pointerId);
  };
  view.onpointermove=e=>{
    if(!view.hasPointerCapture(e.pointerId))return;
    previewAngle+=(lp(e.clientX,e.clientY).x-dragX)*.013;dragX=lp(e.clientX,e.clientY).x;
  };
  $('pName').onchange=e=>{
    const v=e.target.value.trim().slice(0,24);AVATAR.name=v;saveAvatar();
    if(started&&v.length>=2){S.name=v;MP.sync();}
  };
  $('pOk').onclick=()=>{
    const v=$('pName').value.trim().slice(0,24);
    if(v.length<2){toast('Digite um nome (2+ letras)');$('pName').focus();return;}
    AVATAR.name=v;saveAvatar();if(started){S.name=v;MP.sync();}renderMenu('home');
  };
  options(true);
}

  if(page==='help')return '<div class="ph1">❓ Como jogar</div><div class="mb">'+
    '<p><b>Controles:</b> joystick à esquerda anda (empurre até a borda para correr) · arraste a tela para girar a câmera · pinça = zoom · toque num prédio, pessoa ou no chão para ir até lá · o botão dourado à direita entra / conversa. No teclado, ande com WASD ou as setas e segure Shift para correr.</p>'+
    '<p><b>Começo:</b> você chega com $3k. Vá até sua ⭐ <b>sede</b> (placa dourada) e faça <b>freelas</b> até juntar caixa para fundar a 1ª empresa com <b>🔨 Construir</b> — os terrenos verdes ficam liberados.</p>'+
    '<p><b>Wall Street de verdade:</b> a <b>Bolsa</b> (colunas, bandeira) abre o pregão · o <b>23 Wall</b> é o banco · na praça em frente à Bolsa estão os contatos (anel dourado): investidora, banqueiro, mentor, cliente, headhunter.</p>'+
    '<p><b>Crescer:</b> expanda e contrate dentro de cada empresa — o prédio cresce junto. Compre concorrentes (placa vermelha), abra capital e cuidado com aquisições hostis dos amigos.</p>'+
    '<p><b>Fases:</b> Sobrevivência → Crescimento → Escala → Influência → Legado. A cada fase, mais terrenos de Lower Manhattan se abrem.</p></div>';
  return '';}
function bindPage(page){const $=id=>document.getElementById(id);
  if(page==='perso')bindCharacter();
  if(page==='settings'){document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;SETTINGS[k]=v;saveSettings();if(k==='quality')applyQuality();renderMenu('settings');});
    $('sSens').oninput=e=>{SETTINGS.sens=+e.target.value;saveSettings();};if($('sInstall'))$('sInstall').onclick=installApp;if($('sOut'))$('sOut').onclick=logout;if($('sSave'))$('sSave').onclick=async()=>{saveLocal();await MP.saveCloud();toast('💾 Salvo');};}}
function openSettings(){openMenu('settings');}
function confirmNew(){modal('🌱','Começar um novo império?',(hasSave()||started)?'<p>O save atual deste aparelho será substituído.</p>':'<p>Você chega a Wall Street com $3k.</p>',[{t:'Sim, começar do zero',fn:()=>{closeModal();wipeSave();LOCAL=null;startNew(true);}},{t:'Cancelar',fn:closeModal}]);}
function needName(){if(AVATAR.name&&AVATAR.name.length>=2)return false;toast('Escolha seu nome e visual primeiro');renderMenu('perso');setTimeout(()=>{const i=document.getElementById('pName');if(i)i.focus();},50);return true;}
let mpReady=Promise.resolve();
const mpWait=()=>{toast('Entrando em Wall Street…');return Promise.race([mpReady,new Promise(r=>setTimeout(r,2500))]);};
let joining=false;
async function play(){if(started){closeMenu();return;}if(needName()||joining)return;joining=true;try{
  if(hasSave()){await mpWait();let d=LOCAL;if(MP.on){const cloud=await MP.loadCloud();if(cloud&&(cloud.savedAt||0)>(d.savedAt||0))d=cloud;}loadGame(d);S.name=AVATAR.name;beginPlay();MP.sync();}
  else await startNew(false);}finally{joining=false;}}
async function startNew(forceFresh){if(needName())return;const nm=AVATAR.name;await mpWait();
  if(!forceFresh&&MP.on){const cloud=await MP.loadCloud();if(cloud&&cloud.S&&!cloud.S.over){loadGame(cloud);S.name=nm;beginPlay();toast('☁️ Save da nuvem carregado');return;}}
  newGame(nm);beginPlay();MP.sync();MP.news(nm+' acabou de chegar em Wall Street.');}
function beginPlay(){started=true;ensureCareer();ensureWardrobe();rebuildHero();spawnPlayerCar(false);lastPhase=S.phase;paintGround();paintMiniBase();CAM.yaw=0;CAM.pitch=0.28;CAM.dist=7.5;closeMenu();buildToolbar();checkPhase();refreshHUD();refreshObj();saveLocal();LOCAL=readLocal();enterFullscreen();
  if(!HIST.length)HIST.push({d:S.day,n:Math.round(netWorth()),c:Math.round(S.cash)});
}
function enterFullscreen(){if(!isTouch||!SETTINGS.fullscreen||isStandalone())return;const el=document.documentElement;const p=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen?el.webkitRequestFullscreen():null;
  Promise.resolve(p).then(()=>{if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');}).catch(()=>{});}

/* ============================ APP (PWA) ============================ */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});addEventListener('appinstalled',()=>{installEvt=null;toast('📲 Auvra Club instalado');});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches)||navigator.standalone===true;}
function installApp(){if(installEvt){const ev=installEvt;installEvt=null;ev.prompt();return;}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  modal('📲','Instalar Auvra Club',ios?'<p>No Safari: toque em <b>Compartilhar</b> (quadrado com a seta ↑) → <b>Adicionar à Tela de Início</b> → <b>Adicionar</b>.</p>':'<p>No Chrome: menu <b>⋮</b> → <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</p>',[{t:'Ok',fn:closeModal}]);}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));

/* ============================ BOOT ============================ */
async function boot(){
  normalizeAvatar();genWorld();paintGround();initScene();setupSpecialPlaces();setupCareerPlaces();setupInput();
  newGame('Visitante');rebuildHero();paintMiniBase(); // o distrito aparece vivo atrás das telas
  requestAnimationFrame(t=>{last=t;frame(t);});window.__townReady=true; // 3D pronto: o aviso de falha não dispara durante o login
  const t0=performance.now();await MP.init();await new Promise(r=>setTimeout(r,Math.max(0,1700-(performance.now()-t0))));
  document.getElementById('loading').classList.add('off');
  if(!MP.on)await showAuth('login',MP.sb?'':'Sem conexão com o servidor. Confira a internet e tente de novo.');
  await enterAccount();
  window.__townReady=true;
  window.__game={AVATAR,rebuildHero,get ROUTE(){return ROUTE;},solidAt,bodyFree,setWaypoint,clearWaypoint,openBigMap,closeBigMap,goTo,get S(){return S;},get hero(){return hero;},get companies(){return companies;},get buildings(){return buildings;},canBuild,foundCompany,tryPlace,startPlacing,BUILD,get placing(){return placing;},renderer:()=>renderer,camera:()=>camera,CAM,openMenu,closeMenu,TILE,TS,M,PX,WORLD:()=>WORLD,STATS:()=>renderer.info.render,setDayAcc:v=>{dayAcc=v;},scheduleShiftX:()=>scheduleShift(),contactsX:()=>contacts,addAgenda,CARSX:()=>CARS,heroFree,WP:()=>WAYPOINT,actHire,genPerson,enterInterior,exitInterior,get SPECIAL(){return SPECIAL;},get PCAR(){return PCAR;},get INT(){return INT;},CROWD,setTod:v=>{tod=v;},sede:()=>sede,bFront,doInteract,get interact(){return interactTarget;}};}
boot().catch(e=>{console.error(e);window.__fail('Erro ao iniciar: '+(e&&e.message||e));});
</script>
