     O jogo em si continua 100% Canvas 2D — se isto não carregar (offline/CDN fora), os prédios caem
     de volta pro desenho 2D atual automaticamente (ver bakeAllBuildingSprites no script principal). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" onerror="window.__noSupabase=true"></script>

<style>
  :root{
    --wood:#4a3524; --wood2:#3a2919; --wood-edge:#241810; --wood-hi:#6a4d33;
    --cream:#f2e4c8; --dim:#c9b48c; --gold:#e8c060; --green:#8fd07a; --red:#e08a6a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#1a140e;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--cream);user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}
  .panel{position:fixed;background:linear-gradient(#4a3524,#3a2919);border:3px solid var(--wood-edge);border-radius:8px;
    box-shadow:inset 0 2px 0 var(--wood-hi),inset 0 -3px 0 #2a1d12,0 4px 10px rgba(0,0,0,.5);padding:8px 10px}
  .hud-top{top:10px;left:10px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:15px;letter-spacing:.3px}
  .res{display:flex;gap:6px;align-items:center;white-space:nowrap}
  .res .ic{width:18px;height:18px;display:inline-block;image-rendering:pixelated}
  .hud-day{top:10px;right:10px;text-align:right;font-weight:700;font-size:14px;min-width:150px}
  .hud-day .ph{color:var(--gold);font-size:12px;letter-spacing:1px;text-transform:uppercase}
  .quest{top:64px;left:10px;max-width:230px}
  .quest .t{color:var(--gold);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
  .quest .q{font-size:14px;font-weight:700;line-height:1.25}
  .obj{top:64px;right:10px;width:240px}
  .obj .row{margin:7px 0}
  .obj .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
  .obj .lab b{color:var(--dim);font-weight:700}
  .bar{height:9px;background:#241810;border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .bar i{display:block;height:100%;background:linear-gradient(#e8c060,#c89a3a);border-radius:5px}
  .bar.g i{background:linear-gradient(#8fd07a,#5aa04a)}
  .toolbar{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px 8px}
  .tool{width:70px;height:58px;background:linear-gradient(#5a4230,#443019);border:2px solid var(--wood-edge);border-radius:7px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
    box-shadow:inset 0 2px 0 var(--wood-hi);transition:transform .06s,filter .1s}
  .tool:hover{filter:brightness(1.12)} .tool:active{transform:translateY(2px)}
  .tool.on{background:linear-gradient(#7a5a38,#5a4022);box-shadow:inset 0 0 0 2px var(--gold),inset 0 2px 0 var(--wood-hi)}
  .tool .ti{font-size:22px;line-height:1} .tool .tl{font-size:10.5px;font-weight:700;color:var(--dim)}
  .tool .badge{position:absolute;margin:-42px 0 0 44px;background:var(--red);color:#3a1810;font-size:10px;font-weight:800;border-radius:8px;padding:0 4px;border:1px solid #7a2a18}
  .mini{bottom:78px;right:12px;width:132px;height:104px;padding:5px}
  .mini canvas{width:100%;height:100%;image-rendering:pixelated;border-radius:4px;border:2px solid var(--wood-edge)}
  .hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,14,8,.85);border:1px solid var(--wood-hi);
    border-radius:6px;padding:6px 12px;font-size:13px;color:var(--cream);pointer-events:none;opacity:0;transition:opacity .3s}
  .hint.on{opacity:1}
  /* build tray */
  .tray{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;display:none;gap:6px;padding:8px}
  .tray.on{display:flex}
  .card{width:96px;background:linear-gradient(#5a4230,#443019);border:2px solid var(--wood-edge);border-radius:7px;padding:7px 6px;text-align:center;cursor:pointer;box-shadow:inset 0 2px 0 var(--wood-hi)}
  .card:hover{filter:brightness(1.12)}
  .card canvas{width:56px;height:56px;image-rendering:pixelated}
  .card .cn{font-size:11px;font-weight:700;margin-top:2px}
  .card .cc{font-size:11px;color:var(--gold);font-weight:700}
  .card.no{opacity:.5;cursor:not-allowed}
  #toast{position:fixed;top:104px;left:50%;transform:translateX(-50%);background:rgba(20,14,8,.92);border:2px solid var(--gold);
    border-radius:8px;padding:8px 16px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  #toast.on{opacity:1}
  .scrim{position:fixed;inset:0;background:rgba(10,7,4,.55);z-index:29}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,92vw);max-height:86vh;overflow:auto;z-index:30}
  .mh{color:var(--gold);font-weight:800;font-size:17px;margin-bottom:8px}
  .mb{font-size:14px;line-height:1.4} .mb p{margin:4px 0}
  .mact{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .mbtn{background:linear-gradient(#5a4230,#443019);border:2px solid var(--wood-edge);border-radius:7px;color:var(--cream);padding:9px 10px;text-align:left;cursor:pointer;box-shadow:inset 0 2px 0 var(--wood-hi);font:inherit}
  .mbtn:hover{filter:brightness(1.12)} .mbtn b{display:block;font-size:14px} .mbtn span{display:block;font-size:11.5px;color:var(--dim)}
  .mbtn.dis{opacity:.5;cursor:not-allowed}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
  .kpi{background:#241810;border:1px solid var(--wood-hi);border-radius:6px;padding:5px 8px}
  .kpi .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px} .kpi .v{font-size:16px;font-weight:800}
  .tag{display:inline-block;background:#241810;border:1px solid var(--wood-hi);border-radius:6px;padding:1px 6px;font-size:11px;margin-right:4px;color:var(--dim)}
  .lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-bottom:1px dashed #3a2919;cursor:pointer;font-size:13px}
  .lrow:hover{background:rgba(255,255,255,.04)} .dim{color:var(--dim)} .small{font-size:12px;color:var(--dim)}
  .lab{display:flex;justify-content:space-between;font-size:12.5px;margin:6px 0 3px}
  .dprog{height:4px;background:#241810;border-radius:3px;margin:4px 0;overflow:hidden}.dprog i{display:block;height:100%;width:0;background:var(--gold)}
  #speed{display:flex;gap:3px;justify-content:flex-end}#speed button{background:#2a1d12;border:1px solid var(--wood-hi);color:var(--cream);border-radius:5px;font-size:11px;padding:2px 6px;cursor:pointer}
  #speed button.on{background:var(--gold);color:#2a1d12;border-color:var(--gold)}
  .hud-day .net{font-size:11px;color:var(--dim);margin-top:3px}
  .hud-top{flex-wrap:wrap;max-width:calc(100vw - 200px);row-gap:4px}
  .tool{position:relative}.tool .badge{position:absolute;top:2px;right:4px;margin:0}
  .sec{color:var(--gold);font-size:11px;letter-spacing:1px;margin:12px 0 2px;font-weight:700}
  .sbtn{background:#2a1d12;border:1px solid var(--wood-hi);color:var(--cream);border-radius:5px;padding:3px 7px;font:inherit;font-size:12px;cursor:pointer;margin-left:4px}
  .chat{max-height:150px;overflow:auto;background:#241810;border-radius:6px;padding:6px;font-size:12.5px;margin-top:4px;user-select:text}
  .chatin{display:flex;gap:4px;margin-top:5px}.chatin input,#start input{flex:1;background:#241810;border:1px solid var(--wood-hi);color:var(--cream);border-radius:6px;padding:7px;font:inherit;user-select:text}
  #start{position:fixed;inset:0;background:rgba(10,7,4,.62);z-index:40;display:flex;align-items:center;justify-content:center}#start.off{display:none}
  #start .sbox{position:relative;width:min(400px,92vw);display:flex;flex-direction:column;gap:8px;padding:16px}
  #start input{width:100%}#start label{font-size:12px;color:var(--dim)}
  .stitle{color:var(--gold);font-weight:800;font-size:24px}.ssub{color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:-6px}
  @media (max-width:640px){ .tool{width:46px;height:52px}.tool .ti{font-size:19px}.tool .tl{font-size:8.5px} .obj{display:none} .quest{top:auto;bottom:80px;max-width:calc(100vw - 172px);padding:6px 8px}.quest .q{font-size:12.5px} .hint{bottom:auto;top:128px;max-width:92vw;text-align:center} .hud-top{font-size:12px;gap:8px;max-width:calc(100vw - 204px)} .hud-day{min-width:120px;font-size:12px} .tray{flex-wrap:wrap;width:94vw;justify-content:center} .card{width:80px} }
  @media (max-height:470px){ .mini{display:none} .obj{width:210px} }
</style>

<body>
<canvas id="c"></canvas>

<div class="panel hud-top" id="hudTop"></div>
<div class="panel hud-day"><div id="dayTxt">Dia 1 · Primavera</div><div class="ph" id="phaseTxt">Sobrevivência</div><div class="dprog"><i id="dayProg"></i></div>
  <div id="speed"><button data-s="0" title="Pausar (Espaço)">⏸</button><button data-s="1" title="1× (1)">▶</button><button data-s="2" title="2× (2)">▶▶</button><button data-s="4" title="4× (3)">⏩</button><button id="heroBtn" title="Ir até você">📍</button></div><div class="net" id="netState">⚪ offline</div></div>
<div class="panel quest"><div class="t">Missão atual</div><div class="q" id="questTxt">Funde sua primeira empresa</div></div>

<div class="tray" id="tray"></div>

<div id="start"><div class="panel sbox">
  <div class="stitle">Auvra Club</div><div class="ssub">Construa seu império em Meridian</div>
  <p>Você chega com <b>$3k</b> e um notebook velho. Faça freelas, funde empresas, roube talentos, compre concorrentes — inclusive as empresas dos seus amigos.</p>
  <label>Seu nome de empresário(a)</label><input id="nameIn" maxlength="24" placeholder="ex.: Ramon">
  <button class="mbtn" id="btnCont"><b>▶ Continuar império</b><span>Retoma o save deste aparelho (ou da nuvem)</span></button>

  <div class="small" id="startNet"></div>
</div></div>

<script>
/* ============================================================
   Auvra Club — Distrito · protótipo 2D top-down (pixel art)
   Núcleo visual primeiro: mapa + prédios + funcionários + HUD.
   (economia Auvra Club entra na próxima etapa)
   ============================================================ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=innerWidth, H=innerHeight, DPR=Math.min(devicePixelRatio||1,2);
var ZOOM=1, VW=W, VH=H; // zoom da câmera (VW/VH = viewport em px de mundo)
function resize(){W=innerWidth;H=innerHeight;VW=W/ZOOM;VH=H/ZOOM;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();

/* ---- pixel helpers ---- */
const AP=3;                 // art-pixel = 3 screen px
const TILE=16*AP;           // 48px tiles (16 art-px)
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return {c,g};}
// draw art-pixel rect onto ctx g (coords in art-pixels)
function P(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(x*AP,y*AP,w*AP,h*AP);}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rngSeed(s){return ()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
function tileHash(x,y,n){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177;h^=h>>>16;return ((h>>>0)%n+n)%n;} // hash determinístico (evita padrão diagonal do módulo linear)
function paintSoftShadow(g,cx,cy,rx,ry,alpha){ // sombra elíptica suave (gradiente), coords em art-pixels como P()
  cx*=AP;cy*=AP;rx*=AP;ry*=AP;const rad=Math.max(rx,ry);
  const grd=g.createRadialGradient(cx,cy,0,cx,cy,rad);
  grd.addColorStop(0,'rgba(0,0,0,'+alpha+')');grd.addColorStop(0.65,'rgba(0,0,0,'+(alpha*0.5)+')');grd.addColorStop(1,'rgba(0,0,0,0)');
  g.save();g.translate(cx,cy);g.scale(rx/rad,ry/rad);g.translate(-cx,-cy);
  g.fillStyle=grd;g.beginPath();g.arc(cx,cy,rad,0,7);g.fill();g.restore();
}

/* ---- palette ---- */
const COL={
  grass:['#6a9a3f','#5f9038','#74a447','#5a8a34','#7fae52','#527c30'], grassDot:['#7cad4a','#537f30'],
  path:'#a07c4c', path2:'#916d3f', pathEdge:'#7a5a34',
  plaza:'#b9a888', plaza2:'#a89877',
  water:'#4a82ad', water2:'#5a92bd',
};

/* ---- tile sprites (pre-rendered) ---- */
function grassTile(seed){const {c,g}=makeCanvas(TILE,TILE);const r=rngSeed(seed);
  g.fillStyle=COL.grass[(r()*COL.grass.length)|0];g.fillRect(0,0,TILE,TILE);
  for(let i=0;i<10;i++){const x=(r()*16)|0,y=(r()*16)|0;P(g,x,y,1,1,COL.grassDot[(r()*2)|0]);}
  // occasional tufts / flowers
  if(r()<0.28){const x=(r()*12+2)|0,y=(r()*12+2)|0;P(g,x,y,1,2,'#3f6a2a');P(g,x+1,y,1,2,'#3f6a2a');}
  if(r()<0.12){const x=(r()*12+2)|0,y=(r()*12+2)|0;const fc=['#e8d84a','#e88a8a','#d8d8f0'][(r()*3)|0];P(g,x,y,1,1,fc);P(g,x,y-1,1,1,'#6a9a3f');}
  if(r()<0.16){const x=(r()*10+3)|0,y=(r()*10+3)|0;P(g,x,y,2,1,'#7a6440');P(g,x,y+1,1,1,'#6a5636');} // remendo de terra à mostra (variação natural)
  return c;}
function pathTile(seed){const {c,g}=makeCanvas(TILE,TILE);const r=rngSeed(seed);
  g.fillStyle=COL.path;g.fillRect(0,0,TILE,TILE);
  for(let i=0;i<16;i++){const x=(r()*16)|0,y=(r()*16)|0;P(g,x,y,1,1,r()<.5?COL.path2:'#b08a56');}
  for(let i=0;i<3;i++){const x=(r()*14)|0,y=(r()*14)|0;P(g,x,y,2,1,'#8a6838');}
  return c;}
function plazaTile(seed){const {c,g}=makeCanvas(TILE,TILE);const r=rngSeed(seed);
  g.fillStyle=COL.plaza;g.fillRect(0,0,TILE,TILE);
  // paving grid
  for(let i=0;i<16;i+=8)for(let j=0;j<16;j+=8){P(g,i,j,7,7,r()<.5?COL.plaza2:COL.plaza);}
  P(g,0,0,16,1,'#8a7a5a');P(g,0,8,16,1,'#8a7a5a');P(g,0,0,1,16,'#8a7a5a');P(g,8,0,1,16,'#8a7a5a');
  return c;}
function waterTile(seed){const {c,g}=makeCanvas(TILE,TILE);const r=rngSeed(seed);
  g.fillStyle=COL.water;g.fillRect(0,0,TILE,TILE);
  for(let i=0;i<6;i++){const x=(r()*13)|0,y=(r()*14)|0;P(g,x,y,3,1,COL.water2);}
  return c;}

const tileCache={grass:[],path:[],plaza:[],water:[]};
for(let i=0;i<12;i++){tileCache.grass.push(grassTile(1000+i*7));tileCache.path.push(pathTile(2000+i*7));tileCache.plaza.push(plazaTile(3000+i*7));tileCache.water.push(waterTile(4000+i*7));}

/* ---- decor: trees / rocks (pre-rendered, drawn above ground) ---- */
function treeSprite(seed){const S=22;const {c,g}=makeCanvas(S*AP,S*AP);const r=rngSeed(seed);
  paintSoftShadow(g,11,20,7,2.4,0.30);
  // trunk
  P(g,10,15,2,5,'#6b4a2a');P(g,10,15,1,5,'#7d5a34');
  // foliage clusters
  const gy=['#3f7a3a','#4f8f45','#357030'];
  const blobs=[[11,7,6],[7,9,5],[15,9,5],[9,5,4],[13,5,4],[11,11,5]];
  for(const [x,y,rad] of blobs){g.fillStyle=gy[(r()*3)|0];g.beginPath();g.arc(x*AP,y*AP,rad*AP,0,7);g.fill();}
  // highlights
  for(let i=0;i<10;i++){const x=(r()*10+6)|0,y=(r()*8+3)|0;P(g,x,y,1,1,'#6aad5a');}
  return {c,ox:11,oy:19};}
function rockSprite(seed){const S=12;const {c,g}=makeCanvas(S*AP,S*AP);const r=rngSeed(seed);
  paintSoftShadow(g,6,9.5,5,1.8,0.26);
  P(g,3,4,6,5,'#8a8f96');P(g,3,4,6,1,'#a6abb2');P(g,3,8,6,1,'#6a6f76');P(g,4,5,2,2,'#b6bbc2');
  return {c,ox:6,oy:9};}
function fountainSprite(){const S=18;const {c,g}=makeCanvas(S*AP,S*AP);
  paintSoftShadow(g,9,15,8,2.2,0.30);
  P(g,2,8,14,7,'#9a9088');P(g,2,8,14,1,'#b0a69a');P(g,2,14,14,1,'#7a7068');
  P(g,3,10,12,4,'#4a82ad');P(g,3,10,12,1,'#6aa0cd');            // basin + water
  P(g,8,4,2,6,'#8a8078');P(g,7,3,4,2,'#9a9088');                // spout
  P(g,6,5,1,1,'#8fc0e8');P(g,11,6,1,1,'#8fc0e8');P(g,9,4,1,1,'#bfe0f4');
  return {c,ox:9,oy:15};}
const treeSprites=[treeSprite(11),treeSprite(23),treeSprite(37),treeSprite(51)];
const rockSprites=[rockSprite(9),rockSprite(19)];
function lampSprite(){const S=6,SH=20;const {c,g}=makeCanvas(S*AP,SH*AP);
  paintSoftShadow(g,3,18.5,2.6,1,0.24);
  P(g,2,4,2,15,'#3a3026');P(g,2,4,1,15,'#4a4032');           // poste
  P(g,1,1,4,4,'#2a241c');P(g,1,1,4,1,'#4a4032');             // luminária
  P(g,2,2,2,2,'#ffe6a0');                                     // luz quente
  return {c,ox:3,oy:18};}
function cropSprite(seed){const S=TILE/AP,r=rngSeed(seed);const {c,g}=makeCanvas(TILE,TILE);
  g.fillStyle='#7a5a38';g.fillRect(0,0,TILE,TILE);                  // terra arada
  for(let y=2;y<16;y+=3){P(g,1,y,14,1,'#6a4a2a');for(let x=2;x<15;x+=3)P(g,x,y-1,1,1,r()<.7?'#4f8f45':'#6aad5a');} // sulcos + brotos
  return c;}
function wellSprite(){const {c,g}=makeCanvas(14*AP,16*AP);
  paintSoftShadow(g,7,14,6,2,0.28);
  P(g,2,8,10,6,'#8a8078');P(g,2,8,10,1,'#a09890');P(g,2,13,10,1,'#6a6058');   // parede de pedra
  P(g,3,9,8,4,'#2f2822');P(g,3,9,8,2,'#4a82ad');                              // buraco + água
  P(g,2,2,2,7,'#6a4a2a');P(g,10,2,2,7,'#6a4a2a');                             // postes do telhado
  P(g,1,1,12,3,'#8a4a3a');P(g,1,1,12,1,'#a05a48');P(g,6,3,2,5,'#5a3a24');     // telhado + balde
  return {c,ox:7,oy:14};}
function barrelSprite(){const {c,g}=makeCanvas(8*AP,10*AP);
  paintSoftShadow(g,4,8.5,4,1.4,0.26);

/* ---- upgrade progressivo: "assa" luz/sombra 3D real (Three.js) nos sprites de prédio, uma vez, em segundo
   plano. O 2D acima já deixa o jogo 100% jogável na hora; se isto carregar, os prédios ganham volume/
   sombreamento real e substituem o sprite antigo em BSPRITES (mesmo wt/ht/ox/oy — nada de gameplay muda).
   Se falhar (offline, CDN fora), o catch mantém o 2D — nunca quebra o jogo. ---- */
function bake3DBuilding(THREE,spec){
  const SS=5,FW=spec.fw,FH=spec.fh,RW=FW*SS,RH=FH*SS;
  const renderer=new THREE.WebGLRenderer({canvas:document.createElement('canvas'),antialias:true,alpha:true});
  renderer.setSize(RW,RH);renderer.setClearColor(0,0);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xcfe0ff,0x45402c,0.75));
  const sun=new THREE.DirectionalLight(0xfff2d8,2.15);sun.position.set(1.5,7.6,2.0);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-2.6;sun.shadow.camera.right=2.6;sun.shadow.camera.top=2.8;sun.shadow.camera.bottom=-0.6;
  sun.shadow.camera.near=0.5;sun.shadow.camera.far=10;sun.shadow.bias=-0.0015;
  scene.add(sun);
  const fill=new THREE.DirectionalLight(0x9ab0d8,0.85);fill.position.set(-2,3,3);scene.add(fill);
  spec.build(THREE,scene);
  const cam=new THREE.OrthographicCamera(-spec.camHW,spec.camHW,spec.camTop,spec.camBot,0.1,20);
  cam.position.set(0,1.65,3.0);cam.lookAt(0,0.85,0);cam.updateMatrixWorld();cam.updateProjectionMatrix();
  renderer.render(scene,cam);
  const anchor=new THREE.Vector3(0,0,0).project(cam);
  const pxFracX=(anchor.x+1)/2,pxFracY=(1-anchor.y)/2;
  const outC=document.createElement('canvas');outC.width=FW;outC.height=FH;
  const outG=outC.getContext('2d');outG.imageSmoothingEnabled=true;outG.imageSmoothingQuality='high';
  outG.drawImage(renderer.domElement,0,0,FW,FH);
  renderer.dispose();
  return {c:outC,wt:spec.wt,ht:spec.ht,ox:(pxFracX*FW)/AP,oy:(pxFracY*FH)/AP,name:spec.name};
}

/* ============================ WORLD ============================ */
const MAPW=44, MAPH=44;
const map=[]; // tile type per cell: 0 grass,1 path,2 plaza,3 water
const decor=[]; // {kind:'tree'|'rock', gx,gy, sprite}
const buildings=[]; // {type,gx,gy,wt,ht}
const workers=[]; // {x,y,tx,ty,spd,spr,home}

function genWorld(){
  const rr=rngSeed(777);
  for(let y=0;y<MAPH;y++){map[y]=[];for(let x=0;x<MAPW;x++){map[y][x]=0;}}
  // main crossroads (like the reference)
  const cxA=Math.floor(MAPW*0.5), cyA=Math.floor(MAPH*0.42);
  for(let x=0;x<MAPW;x++){map[cyA][x]=1;map[cyA+1][x]=1;}
  for(let y=0;y<MAPH;y++){map[y][cxA]=1;map[y][cxA+1]=1;}
  // a central plaza at the cross
  for(let y=cyA-1;y<=cyA+2;y++)for(let x=cxA-1;x<=cxA+2;x++)if(map[y]&&map[y][x]!=null)map[y][x]=2;
  // a pond
  for(let y=6;y<10;y++)for(let x=34;x<39;x++){if(rr()<.85)map[y][x]=3;}
  // scatter trees (avoid roads/buildings later)
  for(let i=0;i<150;i++){const gx=(rr()*MAPW)|0,gy=(rr()*MAPH)|0;if(map[gy][gx]===0){decor.push({kind:'tree',gx,gy,spr:treeSprites[(rr()*treeSprites.length)|0]});}}
  for(let i=0;i<24;i++){const gx=(rr()*MAPW)|0,gy=(rr()*MAPH)|0;if(map[gy][gx]===0)decor.push({kind:'rock',gx,gy,spr:rockSprites[(rr()*rockSprites.length)|0]});}
  // fountain centerpiece in the plaza
  decor.push({kind:'fountain',gx:cxA,gy:cyA,spr:fountain});
  // sede do jogador (marco) + empresas iniciais do distrito — fundadas com a economia Auvra Club de verdade
  // (sede, concorrentes iniciais e VOCÊ são criados em newGame()/loadGame() — o terreno é determinístico)
  const SEDE_AT=[cxA-4,cyA-4], STARTER_LOTS=[[cxA+3,cyA-5],[cxA-8,cyA+3],[cxA+3,cyA+3],[cxA-5,cyA+3],[cxA-8,cyA-5],[cxA+7,cyA+3],[cxA+7,cyA-5]];
  const resv=[SEDE_AT,...STARTER_LOTS]; // reserva os lotes para postes/props não nascerem neles
  const nearLot=(x,y)=>resv.some(l=>x>=l[0]-1&&x<l[0]+4&&y>=l[1]-1&&y<l[1]+3);
  // postes de luz ao longo das avenidas (só em grama livre, fora de prédios)
  for(let x=3;x<MAPW-2;x+=5){for(const gy of [cyA-1,cyA+2]){if(map[gy]&&map[gy][x]===0&&!nearLot(x,gy))decor.push({kind:'lamp',gx:x,gy,spr:lamp});}}
  for(let y=3;y<MAPH-2;y+=5){for(const gx of [cxA-1,cxA+2]){if(map[y]&&map[y][gx]===0&&!nearLot(gx,y))decor.push({kind:'lamp',gx,gy:y,spr:lamp});}}
  // hortas/campos (como a vila de referência)
  for(const cp of [[cxA-13,cyA+6],[cxA-13,cyA+9]]){for(let y=0;y<3;y++)for(let x=0;x<4;x++){const gx=cp[0]+x,gy=cp[1]+y;if(map[gy]&&map[gy][gx]===0){map[gy][gx]=4;for(let i=decor.length-1;i>=0;i--)if(decor[i].gx===gx&&decor[i].gy===gy)decor.splice(i,1);}}}
  // props: poço, cerca na horta, barris e engradados (fidelidade ao print)
  fenceRing(cxA-13,cyA+6,4,6);
  const putDecor=(gx,gy,spr)=>{if(map[gy]&&map[gy][gx]===0&&!nearLot(gx,gy)){for(let i=decor.length-1;i>=0;i--)if(decor[i].gx===gx&&decor[i].gy===gy)decor.splice(i,1);decor.push({kind:'prop',gx,gy,spr});}};
  putDecor(cxA-3,cyA-3,well);
  [[cxA+2,cyA-6],[cxA+6,cyA+2],[cxA-6,cyA+2],[cxA-9,cyA-6],[cxA+9,cyA+6]].forEach(p=>putDecor(p[0],p[1],barrel));
  [[cxA-7,cyA+2],[cxA+7,cyA+2],[cxA+2,cyA+6],[cxA-3,cyA-6]].forEach(p=>putDecor(p[0],p[1],crate));
  // moldura do mapa: montanhas (topo/esquerda, como a referência) + mata densa (demais lados) — 2 fileiras de profundidade
  const rb=rngSeed(9001);
  for(let x=-2;x<MAPW+2;x++){
    for(const gy of [-1,-2]){const j=rb()*0.7-0.35; if(rb()<0.68)decor.push({kind:'mtn',gx:x+j,gy,spr:pick(mountainSprites)});else decor.push({kind:'ftree',gx:x+j,gy,spr:pick(denseTreeSprites)});}
    for(const gy of [MAPH,MAPH+1]){const j=rb()*0.7-0.35; if(rb()<0.85)decor.push({kind:'ftree',gx:x+j,gy,spr:pick(denseTreeSprites)});}
  }
  for(let y=-2;y<MAPH+2;y++){
    for(const gx of [-1,-2]){const j=rb()*0.7-0.35; if(rb()<0.55)decor.push({kind:'mtn',gx,gy:y+j,spr:pick(mountainSprites)});else decor.push({kind:'ftree',gx,gy:y+j,spr:pick(denseTreeSprites)});}
    for(const gx of [MAPW,MAPW+1]){const j=rb()*0.7-0.35; if(rb()<0.85)decor.push({kind:'ftree',gx,gy:y+j,spr:pick(denseTreeSprites)});}
  }
  WORLD={cxA,cyA,SEDE_AT,STARTER_LOTS};
}
let WORLD=null;
function footprintFree(type,gx,gy){const s=BSPRITES[type];for(let y=gy;y<gy+s.ht;y++)for(let x=gx;x<gx+s.wt;x++){if(x<0||y<0||x>=MAPW||y>=MAPH)return false;if(map[y][x]===3)return false;}
  for(const b of buildings){const bs=BSPRITES[b.type];if(gx<b.gx+bs.wt&&gx+s.wt>b.gx&&gy<b.gy+bs.ht&&gy+s.ht>b.gy)return false;}return true;}
function placeBuilding(type,gx,gy){const s=BSPRITES[type];
  // clear decor under footprint
  for(let i=decor.length-1;i>=0;i--){const d=decor[i];if(d.gx>=gx-1&&d.gx<gx+s.wt&&d.gy>=gy-1&&d.gy<gy+s.ht)decor.splice(i,1);}
  const b={type,gx,gy};buildings.push(b);return b;}
function buildingAt(gx,gy){for(const b of buildings){const s=BSPRITES[b.type];if(gx>=b.gx&&gx<b.gx+s.wt&&gy>=b.gy&&gy<b.gy+s.ht)return b;}return null;}
function spawnWorker(b,co){const s=BSPRITES[b.type];const cx=(b.gx+s.wt/2)*TILE,cy=(b.gy+s.ht/2)*TILE;
  const w={x:cx+(Math.random()*2-1)*TILE,y:cy+(Math.random()*1.5)*TILE,tx:0,ty:0,spd:16+Math.random()*10,spr:workerCache[(Math.random()*workerCache.length)|0],home:{cx,cy},co:co||null,ph:Math.random()*6,moving:false,face:1,pause:0};
  pickTarget(w);workers.push(w);return w;}
function removeWorker(co){for(let i=workers.length-1;i>=0;i--){if(workers[i].co===co){workers.splice(i,1);return;}}}
function removeWorkersOf(key,val){for(let i=workers.length-1;i>=0;i--)if(workers[i][key]===val)workers.splice(i,1);}
function pickTarget(w){w.tx=w.home.cx+(Math.random()*4-2)*TILE;w.ty=w.home.cy+(Math.random()*3-0.5)*TILE;}

/* ============================ CAMERA ============================ */
let camX=0,camY=0; let hero=null;
let vignetteImg=null,vignetteW=0,vignetteH=0;
function ensureVignette(){ // cacheada; só regenera no resize (1 gradiente, não por frame)
  if(vignetteImg&&vignetteW===W&&vignetteH===H)return;
  vignetteW=W;vignetteH=H;const {c,g}=makeCanvas(W,H);
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(10,14,8,0)');vg.addColorStop(1,'rgba(6,10,5,0.4)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);vignetteImg=c;
}
function clampCam(){const worldW=MAPW*TILE,worldH=MAPH*TILE;camX=Math.max(-40,Math.min(Math.max(-40,worldW-VW+40),camX));camY=Math.max(-40,Math.min(Math.max(-40,worldH-VH+40),camY));}
function centerCam(){camX=(MAPW*TILE-VW)/2;camY=(MAPH*TILE-VH)/2-40;clampCam();}
function centerOnHero(){if(!hero)return centerCam();camX=hero.x-VW/2;camY=hero.y-VH/2;clampCam();}

/* ============================ RENDER ============================ */
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);ctx.imageSmoothingEnabled=false;
  const W=VW,H=VH; // viewport em px de mundo (zoom)
  // sky/ground base
  ctx.fillStyle='#2a3a1e';ctx.fillRect(0,0,W,H);
  const vx0=Math.floor(camX/TILE), vy0=Math.floor(camY/TILE);
  const vx1=Math.ceil((camX+W)/TILE), vy1=Math.ceil((camY+H)/TILE);
  // moldura: terreno "distante" fora do mapa jogável — nunca revela cor chapada na borda
  for(let y=vy0;y<vy1;y++)for(let x=vx0;x<vx1;x++){
    if(x>=0&&x<MAPW&&y>=0&&y<MAPH)continue;
    const img=farTiles[tileHash(x,y,farTiles.length)];
    ctx.drawImage(img,Math.round(x*TILE-camX),Math.round(y*TILE-camY));
  }
  const x0=Math.max(0,vx0), y0=Math.max(0,vy0);
  const x1=Math.min(MAPW,vx1), y1=Math.min(MAPH,vy1);
  // tiles
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const t=map[y][x];const arr=t===1?tileCache.path:t===2?tileCache.plaza:t===3?tileCache.water:t===4?cropTiles:tileCache.grass;
    const img=arr[tileHash(x,y,arr.length)];
    const px=Math.round(x*TILE-camX),py=Math.round(y*TILE-camY);
    ctx.drawImage(img,px,py);
    // caminho/praça "cavados" na grama: aresta escura onde encostam em grama (fidelidade ao print)
    if(t===1||t===2){const soft=xx=>xx!==1&&xx!==2;const E=4,ec=t===1?'#6a4a28':'#8a7a5a';ctx.fillStyle=ec;
      if(!map[y-1]||soft(map[y-1][x]))ctx.fillRect(px,py,TILE,E);
      if(!map[y+1]||soft(map[y+1][x]))ctx.fillRect(px,py+TILE-E,TILE,E);
      if(soft(map[y][x-1]))ctx.fillRect(px,py,E,TILE);
      if(soft(map[y][x+1]))ctx.fillRect(px+TILE-E,py,E,TILE);
      // dither leve: quebra a linha reta da transição (mais orgânico, menos "colado")
      for(let k=0;k<4;k++){const hk=tileHash(x*97+k*13,y*89+k*7,TILE*TILE);const ex=hk%TILE,ey=(hk/TILE|0)%TILE;
        if(ex<E+3||ex>TILE-E-3||ey<E+3||ey>TILE-E-3)ctx.fillRect(px+ex,py+ey,2,2);}
    }
  }
  // distrito ainda não liberado (expande a cada fase)
  ctx.fillStyle='rgba(12,9,5,0.42)';for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(!tileUnlocked(x,y))ctx.fillRect(Math.round(x*TILE-camX),Math.round(y*TILE-camY),TILE,TILE);
  // depth-sorted sprites (decor + buildings + workers) by baseline y
  const ents=[];
  for(const d of decor){if(d.gx<x0-2||d.gx>x1+2||d.gy<y0-2||d.gy>y1+2)continue;ents.push({y:d.gy*TILE+TILE,draw:()=>{const sx=Math.round(d.gx*TILE-camX+TILE/2-d.spr.ox*AP),sy=Math.round(d.gy*TILE-camY+TILE-d.spr.oy*AP);ctx.drawImage(d.spr.c,sx,sy);}});}
  for(const b of buildings){const s=BSPRITES[b.type];ents.push({y:(b.gy+s.ht)*TILE,draw:()=>{const sx=Math.round(b.gx*TILE-camX+ (s.wt*TILE)/2 - s.ox*AP),sy=Math.round((b.gy+s.ht)*TILE-camY - s.oy*AP);ctx.drawImage(s.c,sx,sy);drawFlag(b,s);}});}
  for(const w of workers){ents.push({y:w.y,draw:()=>{if(w.contact)drawContactMark(w);const sp=w.spr;const bob=w.moving?Math.round(Math.abs(Math.sin(performance.now()*0.011+w.ph))*2*AP):0;
    const dx=Math.round(w.x-camX-6*AP),dy=Math.round(w.y-camY-16*AP)-bob;
    if(w.face<0){ctx.save();ctx.translate(dx+sp.width,dy);ctx.scale(-1,1);ctx.drawImage(sp,0,0);ctx.restore();}else ctx.drawImage(sp,dx,dy);}});}
  if(hero){const H=hero;ents.push({y:H.y+2,draw:()=>{
    const rx=Math.round(H.x-camX),ry=Math.round(H.y-camY);
    // anel dourado pulsante no chão — ajuda a localizar "você"
    const pulse=0.45+0.35*Math.sin(performance.now()*0.005);
    ctx.save();ctx.globalAlpha=pulse;ctx.strokeStyle='#e8c060';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(rx,ry,20,8,0,0,7);ctx.stroke();ctx.globalAlpha=1;ctx.restore();
    // sprite do herói (bob + direção)
    const bob=H.moving?Math.round(Math.abs(Math.sin(performance.now()*0.013+H.ph))*2*AP):0;
    const dx=Math.round(H.x-camX-7*AP),dy=Math.round(H.y-camY-18*AP)-bob;
    if(H.face<0){ctx.save();ctx.translate(dx+heroImg.width,dy);ctx.scale(-1,1);ctx.drawImage(heroImg,0,0);ctx.restore();}else ctx.drawImage(heroImg,dx,dy);
    // etiqueta VOCÊ acima da cabeça
    ctx.font='bold 12px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=ctx.measureText('VOCÊ').width, ly=dy-16;
    ctx.fillStyle='rgba(20,14,8,0.88)';roundRect(ctx,rx-tw/2-7,ly,tw+14,17,6);ctx.fill();
    ctx.fillStyle='#e8c060';ctx.fillText('VOCÊ',rx,ly+9);
    ctx.beginPath();ctx.moveTo(rx-4,ly+17);ctx.lineTo(rx+4,ly+17);ctx.lineTo(rx,ly+21);ctx.fill();
  }});}
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents)e.draw();
  // placement ghost
  if(placing){drawGhost();}
  // vinheta sutil (moldura do enquadramento — cacheada, 1 blit por frame)
  ctx.setTransform(DPR,0,0,DPR,0,0);ensureVignette();ctx.drawImage(vignetteImg,0,0);
}

/* bandeirinha sobre o prédio: dourada = seu, vermelha = concorrente (NPC ou amigo) */

  ctx.save();ctx.globalAlpha=pulse;ctx.strokeStyle='#e8c060';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(rx,ry,13,5,0,0,7);ctx.stroke();ctx.restore();

/* ============================ DISTRITO (expande por fase) ============================ */
const UNLOCK_R=[0,9,13,17,22,99];
function tileUnlocked(x,y){if(!WORLD||!started)return true;const r=UNLOCK_R[S.phase]||99;return Math.max(Math.abs(x-WORLD.cxA-0.5),Math.abs(y-WORLD.cyA-0.5))<=r+0.5;}
function lotFree(type,gx,gy){if(!footprintFree(type,gx,gy))return false;const s=BSPRITES[type];for(let y=gy;y<gy+s.ht;y++)for(let x=gx;x<gx+s.wt;x++){const t=map[y][x];if(t===1||t===2||t===4)return false;}return true;}
function canBuild(type,gx,gy){if(!lotFree(type,gx,gy))return false;const s=BSPRITES[type];for(let y=gy;y<gy+s.ht;y++)for(let x=gx;x<gx+s.wt;x++)if(!tileUnlocked(x,y))return false;return true;}
function findFreeSpot(type,mustUnlock){const bx=sede?sede.gx:MAPW>>1,by=sede?sede.gy:MAPH>>1;for(let rad=3;rad<26;rad++)for(let a=0;a<18;a++){const gx=clamp(bx+Math.round((Math.random()*2-1)*rad),1,MAPW-4),gy=clamp(by+Math.round((Math.random()*2-1)*rad),1,MAPH-4);if(mustUnlock?canBuild(type,gx,gy):lotFree(type,gx,gy))return {gx,gy};}return null;}

const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>a+((Math.random()*(b-a+1))|0), chance=p=>Math.random()<p, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[(Math.random()*a.length)|0];
function money(n){n=Math.round(n);const s=n<0?'-':'';n=Math.abs(n);if(n>=1e9)return s+'$'+(n/1e9).toFixed(1)+'B';if(n>=1e6)return s+'$'+(n/1e6).toFixed(n>=1e7?0:1)+'M';if(n>=1e3)return s+'$'+(n/1e3).toFixed(n>=1e4?0:1)+'k';return s+'$'+n;}
function moneyFull(n){n=Math.round(n);const s=n<0?'-':'';return s+'$'+Math.abs(n).toLocaleString('pt-BR');}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const NICHES=[
  {id:"retail",name:"Varejo",ico:"🛍️",spr:"cafe",cost:3500,base:[55,95],risk:.12,growth:1.10,family:"real"},
  {id:"saas",name:"SaaS B2B",ico:"🧩",spr:"startup",cost:4000,base:[60,110],risk:.10,growth:1.18,family:"tech"},
  {id:"logi",name:"Logística",ico:"🚚",spr:"factory",cost:5500,base:[70,120],risk:.13,growth:1.12,family:"real"},
  {id:"media",name:"Mídia",ico:"🎬",spr:"cafe",cost:5500,base:[60,150],risk:.24,growth:1.20,family:"soft"},
  {id:"fintech",name:"Fintech",ico:"💳",spr:"office",cost:6500,base:[80,140],risk:.18,growth:1.22,family:"tech"},
  {id:"ai",name:"IA / Deep Tech",ico:"🧠",spr:"office",cost:7500,base:[90,160],risk:.22,growth:1.30,family:"tech"},
  {id:"health",name:"Saúde",ico:"🩺",spr:"office",cost:8000,base:[100,170],risk:.12,growth:1.14,family:"soft"},
  {id:"energy",name:"Energia",ico:"⚡",spr:"factory",cost:12000,base:[130,210],risk:.14,growth:1.16,family:"real"},
];
const NICHE={};NICHES.forEach(n=>NICHE[n.id]=n);
const PHASES=[{n:1,name:"Sobrevivência",net:0},{n:2,name:"Crescimento",net:25000,need:"company"},{n:3,name:"Escala",net:300000},{n:4,name:"Influência",net:5000000},{n:5,name:"Legado",net:30000000}];
const IPO_MIN=350000, YEAR=40, SAT=10; // 1 ano de jogo = 4 estações × 10 dias
const FIRST=["Alex","Sam","Noa","Liv","Cris","Vic","Dani","Theo","Mara","Iris","Leo","Nina","Caio","Bia","Hugo","Lara","Rafa","Yuki","Omar","Sofia","Marco","Eva","Priya","Enzo","Mila"];
const LAST=["Moreau","Sterling","Okafor","Vance","Reyes","Cho","Bianchi","Haddad","Costa","Nakamura","Adeyemi","Volkov","Mensah","Duarte","Khan","Romano","Silva","Aoki","Vega","Brandt"];
const ROLES=[{t:"Engenheiro(a)",fam:"tech"},{t:"Cientista de Dados",fam:"tech"},{t:"Designer",fam:"tech"},{t:"Head de Vendas",fam:"soft"},{t:"Operações",fam:"real"},{t:"Marketing",fam:"soft"},{t:"Financeiro(a)",fam:"any"}];
const SEASONS=["Primavera","Verão","Outono","Inverno"];
const CONTACT_DEFS=[{kind:'investor',role:'Investidora anjo',ico:'💼'},{kind:'banker',role:'Gerente do banco',ico:'🏦'},{kind:'mentor',role:'Mentor de negócios',ico:'🎓'},{kind:'client',role:'Cliente corporativo',ico:'🤝'},{kind:'headhunter',role:'Headhunter',ico:'🎯'}];
function newState(name){return {v:2,name:name||'Você',cash:3000,debt:0,escrow:0,energy:100,rep:{market:5,talent:5,public:6},skills:{negotiation:10,charisma:12,finance:8,leadership:8},
  market:{cycle:"estável",mult:1.0,rate:6.0,mood:0,target:1.0},phase:1,phaseName:"Sobrevivência",day:1,season:"Primavera",over:false,won:false,wonSeen:false,
  peakNet:0,founded:0,hires:0,negDays:0,speed:1,flags:{},stats:{freelas:0,acq:0,ipos:0,events:0}};}
let S=newState(); let companies=[]; let rivals=[]; let contacts=[]; let sede=null; let started=false; const FEED=[];
function log(h){FEED.unshift({d:S.day,h});if(FEED.length>40)FEED.length=40;}
const skillAvg=()=>(S.skills.negotiation+S.skills.charisma+S.skills.finance+S.skills.leadership)/4;
function gainSkill(k,a){S.skills[k]=Math.min(100,S.skills[k]+a*(1-S.skills[k]/120));}
function repUp(k,a){S.rep[k]=clamp(S.rep[k]+a,0,100);}
const roleFit=(e,n)=>!n?1:e.fam==="any"?1.05:e.fam===n.family?1.18:0.9;
function coName(n){const a=["Nova","Apex","Vertex","Lumen","Iron","Atlas","Meridian","Cobalt","Halcyon","Orion","Vanta","Praxis","Zenith","Aurora","Quanta","Solace"];const b={tech:["Labs","AI","Soft","Stack","Systems"],real:["Group","Works","Ind.","Log.","Build"],soft:["Media","Health","Studio","House"]};return pick(a)+" "+pick(b[n.family]);}
function coSynergy(co){const n=companies.length;if(n<=1)return 1;let s=1+Math.min(0.22,(n-1)*0.045);const nn=NICHE[co.niche];if(companies.some(c=>c!==co&&NICHE[c.niche].family===nn.family))s+=0.06;return s;}
function competition(co){let w=0;for(const r of rivals)if(r.niche===co.niche)w+=Math.min(1.5,0.3+r.value/Math.max(60000,coValueRaw(co)*2));return 1/(1+0.07*w);}
function coRevenueRaw(co,comp){const n=NICHE[co.niche];let emp=0;co.employees.forEach(e=>emp+=e.competence*0.013*roleFit(e,n));const rep=1+(S.rep.market-5)*0.012+(S.rep.public-5)*0.006;const ops=0.45+co.ops/100*0.95;const f=1+(skillAvg()-8)*0.01;
  return Math.max(0,co.baseRev*effScale(co)*(1+emp)*ops*S.market.mult*rep*f*coSynergy(co)*comp);}
/* saturação de mercado: escala tem retorno decrescente (evita crescimento explosivo no fim do jogo) */
function effScale(co){return co.scale/(1+co.scale/SAT);}
function coRevenue(co){return coRevenueRaw(co,competition(co));}
function coCosts(co){let s=0;co.employees.forEach(e=>s+=e.salary);return s+co.overhead*Math.pow(co.scale,1.05);}
function coProfit(co){return coRevenue(co)-coCosts(co);}
function valueFrom(co,rev,prof){const n=NICHE[co.niche];const mult=(2+n.growth*1.5)*(0.7+S.market.mult*0.4);return Math.max(0,Math.round(Math.max(rev*30,prof*YEAR*mult)));}
function coValueRaw(co){const rev=coRevenueRaw(co,1);return valueFrom(co,rev,rev-coCosts(co));}
function coValue(co){const rev=coRevenue(co);return valueFrom(co,rev,rev-coCosts(co));}
const stakeOf=co=>co.stake==null?1:co.stake;
function maxStaff(co){return 2+Math.floor(effScale(co)*2.2)+(co.managed?1:0);}
function staffCap(){return 6+S.phase*12;}
function totalStaff(){return companies.reduce((a,c)=>a+c.employees.length,0);}
function expandCost(co){return Math.round(co.baseRev*co.scale*60*(1+(co.expandN||0)*0.18));}
function opsCost(co){return Math.round(150+co.baseRev*co.scale*4);}
function dailyExpenses(){return 45+S.phase*S.phase*8+companies.length*8;}
function equity(){let n=0;companies.forEach(c=>n+=coValue(c)*stakeOf(c));return n;}
function netWorth(){return Math.round(S.cash+S.escrow+equity()-S.debt);}
function loanLimit(){return Math.round((2000+Math.max(0,S.cash+S.escrow+equity()-S.debt)*0.22+S.rep.market*80)*(S.flags.banker?1.2:1));} // baseado no patrimônio LÍQUIDO (empréstimo não infla o próprio limite)
function loanRate(){const lev=S.debt/Math.max(1,loanLimit());return S.market.rate*(1+1.5*lev*lev)*(S.flags.banker?0.7:1);} // juros sobem com a alavancagem
function dailyInterest(){return S.debt*loanRate()/100/YEAR;}
function checkPhase(){const net=netWorth();for(let i=PHASES.length-1;i>=0;i--){const p=PHASES[i];if(net>=p.net&&(p.need!=="company"||companies.length>0)){if(p.n>S.phase){S.phase=p.n;S.phaseName=p.name;onPhaseUp(p);}break;}}}
function genPerson(star){const role=pick(ROLES);const t=S.rep.talent;const comp=star?ri(85,98):ri(Math.round(45+t/4),Math.round(85+t/6));
  return {id:'p'+Date.now()+ri(0,99999),name:pick(FIRST)+' '+pick(LAST),role:role.t,fam:role.fam,competence:Math.min(99,comp),ambition:ri(35,90),salary:Math.round((15+comp*0.8)*rnd(0.9,1.15)*(1+(S.phase-1)*0.15)),happy:62,tenure:0};}
/* fundação / equipe (empresa <-> prédio <-> funcionários-sprites) */
function makeCompany(nicheId,b){const n=NICHE[nicheId];const base=rnd(n.base[0],n.base[1])*(0.9+skillAvg()*0.01);
  const co={id:'co'+Date.now()+ri(0,99999),niche:nicheId,name:coName(n),baseRev:base,ops:42,scale:1,employees:[],overhead:Math.round(base*0.3),age:0,stake:1,expandN:0,b};if(b)b.co=co;return co;}
function foundCompany(nicheId,gx,gy){const n=NICHE[nicheId];const b=placeBuilding(n.spr,gx,gy);const co=makeCompany(nicheId,b);companies.push(co);S.cash-=n.cost;S.founded++;log('🏗️ Você fundou a '+co.name+'.');return co;}
function placeSede(gx,gy){const b=placeBuilding('hq',gx,gy);b.sede=true;sede=b;return b;}
function addEmployee(co,e){e=e||genPerson();co.employees.push(e);if(co.b)spawnWorker(co.b,co);S.hires++;return e;}
function removeCompany(co){companies=companies.filter(c=>c!==co);const bi=buildings.indexOf(co.b);if(bi>=0)buildings.splice(bi,1);removeWorkersOf('co',co);}
/* ajusta a escala p/ o valuation bater com um alvo (aquisições: preço justo, não dinheiro grátis) */
function calibrate(co,target){co.scale=clamp(1+target/400000,1,6);for(let k=0;k<10;k++){const v=coValue(co);if(v<=0){co.baseRev*=1.6;continue;}co.baseRev=co.baseRev*Math.pow(target/v,0.85);}co.overhead=Math.round(co.baseRev*0.3);for(let k=0;k<6;k++){const v=coValue(co);if(v>0)co.baseRev*=Math.pow(target/v,0.85);}}
/* tick diário */
function endDay(){if(S.over)return;let coNet=0;
  companies.forEach(co=>{co.age++;coNet+=coProfit(co)*stakeOf(co);co.ops=clamp(co.ops-(co.managed?rnd(0.05,0.35):rnd(0.4,1.1)),0,100);co.scale*=rnd(0.998,1.003);
    if(chance(NICHE[co.niche].risk*0.05)){co.scale*=rnd(.86,.94);log('⚠️ '+co.name+' perdeu um cliente grande.');}});
  S.cash+=coNet-dailyExpenses()-dailyInterest();S.energy=100;
  employeeTick();marketTick();rivalTick();contactTick();
  if(S.flags.scandal>0){S.flags.scandal--;repUp('public',-0.3);}
  S.day++;if(S.day%10===0)S.season=SEASONS[(SEASONS.indexOf(S.season)+1)%4];
  if(S.cash<0){S.negDays++;if(S.negDays<5)toast('⚠️ Caixa negativo! Falência em '+(5-S.negDays)+' dia(s) — pegue empréstimo ou venda algo.');}else S.negDays=0;
  if(S.negDays>=5)S.over=true;
  S.peakNet=Math.max(S.peakNet,netWorth());checkPhase();
  if(!S.over&&S.day>3&&chance(0.2))fireEvent();
  afterDay();}
function employeeTick(){companies.forEach(co=>{for(let i=co.employees.length-1;i>=0;i--){const e=co.employees[i];e.tenure++;const lead=(S.skills.leadership-8)*0.2;
  e.happy=clamp((e.happy||60)+(co.ops>55?0.8:-1)+lead*0.3+rnd(-2,2),0,100);if(e.happy<28&&chance(0.13)){co.employees.splice(i,1);removeWorker(co);log('🚪 '+e.name+' pediu demissão da '+co.name+'.');}}});}
function marketTick(){const m=S.market;m.mood=clamp(m.mood+rnd(-.1,.1),-1,1);if(chance(0.04)){const r=Math.random();if(r<.33){m.cycle="recessão";m.target=.78;m.rate=clamp(m.rate+rnd(.5,2),1,18);log('📉 Recessão em Meridian. Juros sobem.');}else if(r<.66){m.cycle="aquecido";m.target=1.28;m.rate=clamp(m.rate-rnd(.3,1.2),1,18);log('📈 Boom! Capital barato.');}else{m.cycle="estável";m.target=1.0;}}m.mult+=(m.target-m.mult)*0.15+m.mood*0.01;m.mult=clamp(m.mult,0.6,1.5);}
/* concorrentes vivos: têm prédio no mapa, crescem, quebram, roubam gente, fazem guerra de preço */
function maxRivals(){return 5+S.phase;}
function rivalScale(){return Math.max(40000,netWorth()*0.08);}
function genRival(n,value){n=n||pick(NICHES);return {id:'rv'+Date.now()+ri(0,99999),name:coName(n),niche:n.id,value:Math.round(value||rnd(0.4,1.4)*rivalScale()),drift:rnd(0.993,1.012),staff:ri(2,5),b:null};}
function placeRival(r,gx,gy){const n=NICHE[r.niche];if(gx==null){const sp=findFreeSpot(n.spr,false);if(!sp)return r;gx=sp.gx;gy=sp.gy;}const b=placeBuilding(n.spr,gx,gy);b.rv=r;r.b=b;for(let k=0;k<r.staff;k++){const w=spawnWorker(b,null);w.rv=r;}return r;}
function spawnRival(n,value,name){const r=genRival(n,value);if(name)r.name=name;rivals.push(r);placeRival(r);log('🏢 Nova concorrente no distrito: '+r.name+' ('+NICHE[r.niche].name+').');return r;}
function removeRival(r){rivals=rivals.filter(x=>x!==r);if(r.b){const bi=buildings.indexOf(r.b);if(bi>=0)buildings.splice(bi,1);removeWorkersOf('rv',r);}}
function rivalTick(){const mf=0.985+S.market.mult*0.015;for(const r of rivals.slice()){r.value=Math.max(8000,Math.round(r.value*r.drift*rnd(0.985,1.015)*mf));
  if((r.value<=9000&&chance(0.2))||chance(0.003)){removeRival(r);log('💀 '+r.name+' fechou as portas.');}}
  if(rivals.length<maxRivals()&&chance(0.07))spawnRival();}
/* contatos (networking diegético: você caminha até eles na praça) */
function genContact(def){return {id:'ct'+Date.now()+ri(0,99999),name:pick(FIRST)+' '+pick(LAST),kind:def.kind,role:def.role,ico:def.ico,rel:8,last:-99,lastDeal:-99,mem:[]};}
function contactTick(){contacts.forEach(c=>{if(S.day-c.last>7)c.rel=Math.max(0,c.rel-0.3);});}
function remember(c,t){c.mem.unshift('Dia '+S.day+': '+t);if(c.mem.length>4)c.mem.length=4;}
/* ações do jogador (gastam energia — 100 por dia) */
function useEnergy(n){if(S.energy<n){toast('😮‍💨 Sem energia hoje (precisa '+n+'). Avance o dia.');return false;}S.energy-=n;return true;}
function actFreelance(){if(!useEnergy(30))return 0;const pay=Math.round(rnd(180,320)*(1+skillAvg()*0.02)*(S.phase===1?1:0.7));S.cash+=pay;gainSkill(pick(['negotiation','charisma','finance','leadership']),0.9);S.stats.freelas++;return pay;}
function actStudy(k){const cost=150*S.phase;if(S.cash<cost){toast('Caixa insuficiente');return false;}if(!useEnergy(25))return false;S.cash-=cost;gainSkill(k,1.6);return true;}
function actImproveOps(co){if(co.opsDay===S.day){toast('Já otimizou a '+co.name+' hoje.');return false;}const c=opsCost(co);if(S.cash<c){toast('Caixa insuficiente ('+money(c)+')');return false;}if(!useEnergy(20))return false;
  S.cash-=c;co.opsDay=S.day;co.ops=clamp(co.ops+ri(8,14)+Math.round((S.skills.leadership-8)*0.15),0,100);gainSkill('leadership',0.5);return true;}
function actExpand(co){const c=expandCost(co);if(S.cash<c){toast('Caixa insuficiente ('+money(c)+')');return false;}S.cash-=c;co.scale+=0.3;co.expandN=(co.expandN||0)+1;gainSkill('finance',0.4);log('🏗️ '+co.name+' expandiu a operação.');return true;}
function actHire(co,e){if(co.employees.length>=maxStaff(co)){toast('Prédio lotado ('+maxStaff(co)+') — expanda a operação.');return false;}if(totalStaff()>=staffCap()){toast('Limite do distrito ('+staffCap()+') — suba de fase.');return false;}
  const shave=clamp((S.skills.negotiation-8)*0.006,0,0.25);e.salary=Math.round(e.salary*(1-shave));addEmployee(co,e);gainSkill('negotiation',0.3);return true;}
function actManager(co){if(co.managed)return false;if(co.employees.length>=maxStaff(co)+1)return false;const mgr=genPerson();mgr.role='Gerente Geral';mgr.fam='any';mgr.competence=Math.max(mgr.competence,68);mgr.salary=Math.round(80+coRevenue(co)*0.12);co.managed=true;addEmployee(co,mgr);return true;}
function borrow(a){a=Math.min(a,loanLimit()-S.debt);if(a<=0){toast('Limite de crédito atingido');return 0;}S.debt+=a;S.cash+=a;return a;}
function repay(a){a=Math.min(a,S.debt,Math.max(0,S.cash));if(a<=0)return 0;S.debt-=a;S.cash-=a;return a;}
function rivalPrice(r){return Math.round(r.value*1.35*(1-clamp((S.skills.negotiation-10)*0.004,0,0.15)));}
function doAcquire(r){if(!rivals.includes(r))return null;const price=rivalPrice(r);if(S.cash<price)return null;S.cash-=price;const n=NICHE[r.niche];
  let b=r.b;if(!b){const sp=findFreeSpot(n.spr,false);b=placeBuilding(n.spr,sp?sp.gx:2,sp?sp.gy:2);}
  const co=makeCompany(r.niche,b);co.name=r.name;co.ops=55;co.age=30;co.acquired=true;b.rv=null;
  rivals=rivals.filter(x=>x!==r);removeWorkersOf('rv',r);
  const staff=Math.min(r.staff,1+Math.floor(r.value/40000));for(let k=0;k<staff;k++)addEmployee(co);companies.push(co);calibrate(co,r.value*rnd(0.95,1.08));
  repUp('market',3);S.founded++;S.stats.acq++;log('🦈 Você adquiriu a '+co.name+'.');gainSkill('negotiation',1);return co;}
function sellValue(co){return Math.round(coValue(co)*stakeOf(co));}
function doSell(co,price){S.cash+=price;removeCompany(co);log('🏷️ Você vendeu a '+co.name+' por '+money(price)+'.');}
function doIPO(co){if(co.public)return 0;const val=coValue(co);if(val<IPO_MIN)return 0;const raise=Math.round(val*0.35*rnd(1.0,1.2));S.cash+=raise;co.public=true;co.stake=stakeOf(co)*0.65;repUp('market',5);repUp('public',8);S.stats.ipos++;log('📊 IPO da '+co.name+' captou '+money(raise)+'.');return raise;}
function afterDay(){refreshHUD();refreshObj();if(S.day%3===0)saveLocal();MP.onDay();if(S.over)gameOver();}
function onPhaseUp(p){toast('🏆 Nova fase: '+p.name+' — o distrito cresceu!');log('🏆 Fase '+p.n+': '+p.name+'.');MP.news(S.name+' chegou à fase '+p.name+'!');if(p.n===5)S.won=true;}

/* ============================ EVENTOS COM ESCOLHAS (consequência persistente) ============================ */
function bigCo(){return companies.filter(c=>coValue(c)>80000).sort((a,b)=>coValue(b)-coValue(a))[0];}
function anyEmp(){const all=[];companies.forEach(c=>c.employees.forEach(e=>all.push([c,e])));return all;}
const EVENTS=[

   {t:'💰 Vender por '+money(off),d:'Exit agora',fn:()=>{doSell(co,off);toast('Exit: '+money(off));MP.news(S.name+' vendeu a '+co.name+' por '+money(off));}},
   {t:'🛡️ Recusar',d:'+reputação de mercado',fn:()=>repUp('market',3)}]);}},

 {w:()=>companies.some(c=>c.employees.length>=3)?1.1:0,run(){const co=pick(companies.filter(c=>c.employees.length>=3));eventModal('✊','Greve na '+esc(co.name),'A equipe parou por melhores salários.',[

   {t:'🗣️ Negociar pessoalmente',d:'Chance ~'+Math.round(clamp(S.skills.negotiation/60,0.15,0.9)*100)+'% (negociação)',fn:()=>{if(chance(clamp(S.skills.negotiation/60,0.15,0.9))){toast('🤝 Acordo fechado sem custo.');gainSkill('negotiation',1.5);}else{co.ops=clamp(co.ops-15,0,100);co.employees.forEach(e=>e.happy-=8);toast('😠 Negociação falhou — operação caiu.');}}},
   {t:'🙅 Ignorar',d:'Operação −25, reputação de talento cai',fn:()=>{co.ops=clamp(co.ops-25,0,100);co.employees.forEach(e=>e.happy-=15);repUp('talent',-4);}}]);}},
 {w:()=>S.phase>=2?0.9:0,run(){const cost=Math.max(1500,Math.round(netWorth()*0.03));eventModal('📰','Escândalo na imprensa','Uma matéria acusa suas empresas de práticas duvidosas.',[
   {t:'🧯 Contratar PR ('+money(cost)+')',d:'Abafa o caso',fn:()=>{if(S.cash>=cost){S.cash-=cost;}else{S.flags.scandal=20;repUp('public',-4);toast('Sem caixa p/ PR — o caso pegou.');}}},
   {t:'🎤 Pedir desculpas em público',d:'Carisma decide',fn:()=>{if(chance(clamp(S.skills.charisma/55,0.2,0.9))){repUp('public',3);gainSkill('charisma',1.5);toast('👏 A cidade gostou da sinceridade.');}else{S.flags.scandal=12;repUp('public',-3);}}},
   {t:'🙈 Ignorar',d:'Reputação pública sangra por 20 dias',fn:()=>{S.flags.scandal=20;repUp('public',-5);}}]);}},
 {w:()=>S.phase>=2&&companies.length?0.8:0,run(){const co=pick(companies);const gain=Math.round(Math.max(3000,coValue(co)*0.08));eventModal('🏛️','Contrato com a prefeitura','A prefeitura oferece um contrato polêmico para a <b>'+esc(co.name)+'</b>.',[

function currentObjective(){const p=S.phase,net=netWorth();const np=PHASES.find(ph=>ph.n===p+1);
  const objs=[{lab:'Empresas',cur:companies.length,max:Math.max(companies.length,p+1)},{lab:'Funcionários',cur:totalStaff(),max:staffCap()}];
  if(np)objs.push({lab:'Patrimônio → '+np.name,cur:Math.max(0,Math.min(net,np.net)),max:np.net,money:true});
  const cheapest=NICHES[0].cost;
  const quest=!companies.length?(S.cash<cheapest?'Faça freelas na ⭐ Sede: junte '+money(cheapest):'Funde sua 1ª empresa (🔨 Construir)'):np?('Chegue à fase “'+np.name+'” ('+money(np.net)+')'):'Construa seu legado — você chegou ao topo';
  const tip=['','Caminhe até a ⭐ Sede para freelas e banco. Converse com as pessoas de anel dourado na praça: elas abrem portas.','Expanda as empresas antes de contratar — funcionário só se paga com escala. Concorrentes viram alvos de M&A.','IPO liberado: capta caixa, mas você dilui e fica exposto a aquisição hostil de amigos.','Seu distrito é grande: sinergia entre setores da mesma família multiplica receita.','Você chegou ao topo. Agora é defender o trono.'][p];
  return {quest,objs,tip};}

function makeHero(x,y){hero={x,y,tx:x,ty:y,spd:190,moving:false,face:1,ph:Math.random()*6,onArrive:null,follow:false};}
function spawnContacts(){for(const c of contacts){const w=spawnWorker(sede,null);const cx=(WORLD.cxA+1)*TILE,cy=(WORLD.cyA+1)*TILE;w.home={cx,cy};w.x=cx+rnd(-2,2)*TILE;w.y=cy+rnd(-1,2)*TILE;w.contact=c;w.spd=14;pickTarget(w);}}

  placeSede(WORLD.SEDE_AT[0],WORLD.SEDE_AT[1]);
  const startNiches=['ai','saas','logi','retail','fintech','media','health'];
  WORLD.STARTER_LOTS.forEach((l,i)=>{const r=genRival(NICHE[startNiches[i]],rnd(30000,140000));rivals.push(r);placeRival(r,l[0],l[1]);});
  contacts=CONTACT_DEFS.map(genContact);spawnContacts();ambient();
  makeHero((WORLD.cxA+0.5)*TILE,(WORLD.cyA+3.4)*TILE);log('🌱 '+S.name+' chegou a Meridian com '+money(S.cash)+' e um notebook velho.');}
function loadGame(d){S=Object.assign(newState(),d.S);companies=[];rivals=[];buildings.length=0;workers.length=0;FEED.length=0;(d.feed||[]).forEach(f=>FEED.push(f));
  const sd=d.sede||{gx:WORLD.SEDE_AT[0],gy:WORLD.SEDE_AT[1]};placeSede(sd.gx,sd.gy);
  for(const c of d.companies||[]){const gx=c.gx,gy=c.gy;delete c.gx;delete c.gy;let b=null;const spr=NICHE[c.niche].spr;if(gx!=null&&footprintFree(spr,gx,gy))b=placeBuilding(spr,gx,gy);else{const sp=findFreeSpot(spr,false);if(sp)b=placeBuilding(spr,sp.gx,sp.gy);}c.b=b;if(b)b.co=c;companies.push(c);if(b)c.employees.forEach(()=>spawnWorker(b,c));}
  for(const r of d.rivals||[]){const gx=r.gx,gy=r.gy;delete r.gx;delete r.gy;r.b=null;rivals.push(r);if(gx!=null&&footprintFree(NICHE[r.niche].spr,gx,gy))placeRival(r,gx,gy);}
  contacts=d.contacts&&d.contacts.length?d.contacts:CONTACT_DEFS.map(genContact);spawnContacts();ambient();

/* ============================ MULTIPLAYER (Supabase: save na nuvem, ranking, M&A entre amigos, presença e chat) ============================ */
/* Preencha com a URL e a publishable/anon key do seu projeto Supabase (são públicas por design — a segurança vem do RLS em supabase/schema.sql). */
const MP_CONFIG={url:'',key:''};
const MP={sb:null,uid:null,on:false,status:'offline (servidor não configurado)',online:{},chat:[],unread:0,deals:[],listings:[],board:[],ch:null,busy:false,
  configured(){return !!(MP_CONFIG.url&&MP_CONFIG.key);},
  async init(){if(!this.configured())return false;if(!(window.supabase&&window.supabase.createClient)){this.status='offline (não carregou a biblioteca de rede)';return false;}
    try{this.sb=window.supabase.createClient(MP_CONFIG.url,MP_CONFIG.key,{auth:{persistSession:true,storageKey:'bs_auth'}});
      let {data:{session}}=await this.sb.auth.getSession();
      if(!session){const r=await this.sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session;}
      this.uid=session.user.id;this.on=true;this.status='online';return true;
    }catch(e){console.warn('MP init',e);this.status='offline ('+(e.message||e)+')';this.on=false;return false;}},
  async loadCloud(){if(!this.on)return null;const {data,error}=await this.sb.from('saves').select('data,updated_at').eq('user_id',this.uid).maybeSingle();if(error){console.warn(error);return null;}return data?data.data:null;},
  async saveCloud(){if(!this.on||!started)return;try{await this.sb.from('saves').upsert({user_id:this.uid,data:serialize(),updated_at:new Date().toISOString()});}catch(e){console.warn(e);}},
  async sync(){if(!this.on||!started)return;try{
    await this.sb.from('players').upsert({id:this.uid,name:S.name,net_worth:Math.round(netWorth()),phase:S.phase,day:S.day,companies:companies.length,updated_at:new Date().toISOString()});
    const rows=companies.map(c=>({id:c.id,owner:this.uid,owner_name:S.name,name:c.name,niche:c.niche,value:Math.round(coValue(c)),profit:Math.round(coProfit(c)),employees:c.employees.length,is_public:!!c.public,stake:stakeOf(c),
      data:{baseRev:c.baseRev,scale:c.scale,ops:c.ops,overhead:c.overhead,expandN:c.expandN||0,managed:!!c.managed,emp:c.employees.slice(0,40).map(e=>({n:e.name,r:e.role,f:e.fam,c:e.competence,s:e.salary}))},updated_at:new Date().toISOString()}));
    if(rows.length)await this.sb.from('listings').upsert(rows);
    const ids=companies.map(c=>c.id);let q=this.sb.from('listings').delete().eq('owner',this.uid);if(ids.length)q=q.not('id','in','('+ids.map(i=>'"'+i+'"').join(',')+')');await q;
    if(this.ch)this.ch.track({id:this.uid,name:S.name,phase:S.phase,net:Math.round(netWorth())});
  }catch(e){console.warn('sync',e);}},
  async fetchListings(){if(!this.on)return;const {data}=await this.sb.from('listings').select('*').neq('owner',this.uid).order('value',{ascending:false}).limit(40);this.listings=data||[];},
  async fetchBoard(){if(!this.on)return;const {data}=await this.sb.from('players').select('id,name,net_worth,phase,day').order('net_worth',{ascending:false}).limit(20);this.board=data||[];},
  async fetchDeals(){if(!this.on)return;const {data}=await this.sb.from('deals').select('*').order('created_at',{ascending:false}).limit(60);this.deals=data||[];},
  async refreshAll(){await Promise.all([this.fetchBoard(),this.fetchDeals(),this.fetchListings()]);},
  /* processa negócios resolvidos: buyer recebe empresa/reembolso; seller perde empresa na hostil */
  async processDeals(){if(!this.on||this.busy)return;this.busy=true;try{await this.fetchDeals();let changed=false;
    for(const d of this.deals){
      if(d.buyer===this.uid&&!d.buyer_done&&d.status!=='pending'){
        if(d.status==='accepted'){S.escrow=Math.max(0,S.escrow-d.price);this.receiveCompany(d);modal('🎉','Oferta aceita!','<p><b>'+esc(d.seller_name)+'</b> aceitou: a <b>'+esc(d.company.name)+'</b> agora é sua.</p>');}
        else{S.escrow=Math.max(0,S.escrow-d.price);S.cash+=d.price;toast('✉️ '+d.seller_name+(d.status==='declined'?' recusou':' cancelou')+' — '+money(d.price)+' de volta');}
        await this.sb.rpc('mark_deal_done',{p_deal:d.id});changed=true;}
      if(d.seller===this.uid&&!d.seller_done&&d.kind==='hostile'){const co=companies.find(c=>c.id===d.listing_id);if(co)removeCompany(co);S.cash+=d.price;
        modal('⚔️','Aquisição hostil!','<p><b>'+esc(d.buyer_name)+'</b> comprou suas ações da <b>'+esc(d.company.name)+'</b> na bolsa. Você recebeu <b style="color:var(--gold)">'+moneyFull(d.price)+'</b>.</p><p class="small">Empresas de capital aberto ficam expostas. Vingança?</p>');
        await this.sb.rpc('mark_deal_done',{p_deal:d.id});changed=true;}}
    if(changed){checkPhase();refreshHUD();refreshObj();saveLocal();this.saveCloud();this.sync();}
    buildToolbar();}catch(e){console.warn('deals',e);}this.busy=false;},
  receiveCompany(d){const c=d.company,dt=c.data||{};const n=NICHE[c.niche]||NICHES[0];const sp=findFreeSpot(n.spr,false);const b=sp?placeBuilding(n.spr,sp.gx,sp.gy):null;
    const co=makeCompany(n.id,b);Object.assign(co,{name:c.name,baseRev:+dt.baseRev||co.baseRev,scale:+dt.scale||1,ops:+dt.ops||50,overhead:+dt.overhead||co.overhead,expandN:dt.expandN|0,managed:!!dt.managed,acquired:true,public:!!c.is_public,stake:+c.stake||1});
    (dt.emp||[]).forEach(e=>addEmployee(co,{id:'p'+Date.now()+ri(0,99999),name:e.n,role:e.r,fam:e.f,competence:e.c|0,ambition:ri(35,90),salary:e.s|0,happy:60,tenure:0}));
    companies.push(co);S.stats.acq++;log('🦈 Você comprou a '+co.name+' de '+d.seller_name+'.');return co;},
  async makeOffer(l,price){if(S.cash<price)return toast('Caixa insuficiente');const {data,error}=await this.sb.rpc('make_offer',{p_listing:l.id,p_price:price});
    if(error)return toast('Oferta falhou: '+error.message);S.cash-=price;S.escrow+=price;toast('✉️ Oferta enviada a '+l.owner_name);this.news(S.name+' fez uma oferta pela '+l.name);refreshHUD();saveLocal();this.saveCloud();this.fetchDeals();void data;},
  async hostile(l,price){if(S.cash<price)return toast('Caixa insuficiente');const {data,error}=await this.sb.rpc('hostile_takeover',{p_listing:l.id});
    if(error)return toast('Aquisição falhou: '+error.message);const d=data;S.cash-=d.price;const co=this.receiveCompany({company:d.company,seller_name:l.owner_name});
    toast('⚔️ Você tomou a '+co.name+'!');this.news('⚔️ '+S.name+' fez uma aquisição hostil da '+co.name+' ('+l.owner_name+')');checkPhase();refreshHUD();refreshObj();saveLocal();this.saveCloud();this.sync();this.fetchListings();},
  async respond(id,accept){const d=this.deals.find(x=>x.id===id);const {data,error}=await this.sb.rpc('respond_offer',{p_deal:id,p_accept:accept});
    if(error){toast('Erro: '+error.message);return;}
    if(data&&data.status==='accepted'){const co=companies.find(c=>c.id===d.listing_id);if(co)removeCompany(co);S.cash+=d.price;toast('💰 Vendida para '+d.buyer_name+' por '+money(d.price));this.news(d.buyer_name+' comprou a '+d.company.name+' de '+S.name);}
    else if(data&&data.status==='cancelled')toast('Essa empresa não está mais à venda.');else toast('Oferta recusada');
    checkPhase();refreshHUD();refreshObj();saveLocal();this.saveCloud();this.sync();await this.fetchDeals();openFriends();},
  async cancel(id){const {error}=await this.sb.rpc('cancel_offer',{p_deal:id});if(error)return toast('Erro: '+error.message);await this.processDeals();openFriends();},
  joinRealtime(){const ch=this.sb.channel('meridian',{config:{presence:{key:this.uid}}});this.ch=ch;
    ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState();this.online={};for(const k in st){const p=st[k][0];if(p)this.online[k]=p;}refreshHUD();})
      .on('broadcast',{event:'chat'},({payload})=>{this.chat.push(payload);if(this.chat.length>60)this.chat.shift();const cb=document.getElementById('chatBox');if(cb){cb.insertAdjacentHTML('beforeend','<div><b>'+esc(payload.name)+':</b> '+esc(payload.text)+'</div>');cb.scrollTop=cb.scrollHeight;}else{this.unread++;buildToolbar();toast('💬 '+payload.name+': '+String(payload.text).slice(0,60));}})
      .on('broadcast',{event:'news'},({payload})=>{log('🌐 '+payload.text);toast('📰 '+payload.text);})
      .on('postgres_changes',{event:'*',schema:'public',table:'deals',filter:'seller=eq.'+this.uid},()=>{this.processDeals();})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'deals',filter:'buyer=eq.'+this.uid},()=>{this.processDeals();})
      .subscribe(st=>{if(st==='SUBSCRIBED')ch.track({id:this.uid,name:S.name,phase:S.phase,net:Math.round(netWorth())});});},
  say(text){if(!this.ch)return;const m={name:S.name,text:text.slice(0,200),t:Date.now()};this.ch.send({type:'broadcast',event:'chat',payload:m});this.chat.push(m);const cb=document.getElementById('chatBox');if(cb){cb.insertAdjacentHTML('beforeend','<div><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>');cb.scrollTop=cb.scrollHeight;}},
  news(text){if(this.ch)this.ch.send({type:'broadcast',event:'news',payload:{text}});},
  onDay(){if(!this.on)return;if(S.day%4===0)this.sync();if(S.day%8===0)this.saveCloud();if(S.day%3===0)this.processDeals();},
  async start(){if(!(await this.init()))return;this.joinRealtime();await this.sync();this.processDeals();this.fetchBoard();}};

/* ============================ UPDATE / LOOP ============================ */
const DAY_SEC=5.5;let last=performance.now(),dayAcc=0;
function goTo(x,y,cb){if(!hero)return cb&&cb();hero.follow=true;if(Math.hypot(hero.x-x,hero.y-y)<34){hero.tx=hero.x;hero.ty=hero.y;hero.onArrive=null;return cb&&cb();}hero.tx=x;hero.ty=y;hero.onArrive=cb||null;}
function bFront(b){const s=BSPRITES[b.type];return [(b.gx+s.wt/2)*TILE,(b.gy+s.ht)*TILE+12];}
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;
  if(started&&!S.over&&S.speed>0&&!document.getElementById('scrim')){dayAcc+=dt*S.speed;if(dayAcc>=DAY_SEC){dayAcc-=DAY_SEC;endDay();}}
  const dp=document.getElementById('dayProg');if(dp)dp.style.width=(dayAcc/DAY_SEC*100)+'%';
  for(const w of workers){const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);
    if(d<3){w.moving=false;if(w.pause>0){w.pause-=dt;}else if(Math.random()<0.03){pickTarget(w);w.pause=rnd(0.4,2.2);}}
    else{w.moving=true;if(Math.abs(dx)>0.5)w.face=dx<0?-1:1;w.x+=dx/d*w.spd*dt;w.y+=dy/d*w.spd*dt;}}
  if(hero){const dx=hero.tx-hero.x,dy=hero.ty-hero.y,d=Math.hypot(dx,dy);
    if(d<2){hero.moving=false;if(hero.onArrive){const cb=hero.onArrive;hero.onArrive=null;cb();}}
    else{hero.moving=true;if(Math.abs(dx)>0.5)hero.face=dx<0?-1:1;const step=Math.min(hero.spd*dt,d);hero.x+=dx/d*step;hero.y+=dy/d*step;}
    if(hero.follow&&hero.moving&&!dragging){const k=Math.min(1,dt*3);camX+=(hero.x-VW/2-camX)*k;camY+=(hero.y-VH/2-camY)*k;clampCam();}}
  draw();drawMini();
  requestAnimationFrame(loop);}

/* ============================ MINIMAP ============================ */
const mini=document.getElementById('mini'),mg=mini.getContext('2d');mg.imageSmoothingEnabled=false;
function drawMini(){const sx=mini.width/MAPW,sy=mini.height/MAPH;mg.fillStyle='#3a5a2a';mg.fillRect(0,0,mini.width,mini.height);
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){const t=map[y][x];if(t!==0){mg.fillStyle=t===1?'#9a7a4a':t===2?'#b9a888':t===3?'#4a82ad':t===4?'#7a5a38':'#3a5a2a';mg.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy));}
    if(!tileUnlocked(x,y)){mg.fillStyle='rgba(0,0,0,0.38)';mg.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy));}}
  for(const b of buildings){mg.fillStyle=b.sede?'#ffe27a':b.co?'#e8a040':b.rv?'#d0503a':'#999';mg.fillRect(b.gx*sx,b.gy*sy,sx*2,sy*2);}
  if(hero){mg.fillStyle='#fff';mg.fillRect(hero.x/TILE*sx-1.5,hero.y/TILE*sy-1.5,3,3);}
  mg.strokeStyle='#f2e4c8';mg.lineWidth=1;mg.strokeRect(camX/TILE*sx,camY/TILE*sy,VW/TILE*sx,VH/TILE*sy);}
mini.addEventListener('pointerdown',e=>{const r=mini.getBoundingClientRect();const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;if(hero)hero.follow=false;camX=fx*MAPW*TILE-VW/2;camY=fy*MAPH*TILE-VH/2;clampCam();e.stopPropagation();});

/* ============================ INPUT (arrastar = câmera · toque = andar/interagir · roda/pinça = zoom) ============================ */
function setZoom(z,cx,cy){z=clamp(z,0.5,2);if(cx==null){cx=W/2;cy=H/2;}const wx=camX+cx/ZOOM,wy=camY+cy/ZOOM;ZOOM=z;VW=W/ZOOM;VH=H/ZOOM;camX=wx-cx/ZOOM;camY=wy-cy/ZOOM;clampCam();}
let dragging=false,dragMoved=false,lastX=0,lastY=0;const ptrs=new Map();let pinchD=0;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);dragMoved=true;}
  dragging=true;if(ptrs.size===1)dragMoved=false;lastX=e.clientX;lastY=e.clientY;cv.classList.add('drag');cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  mouseGX=Math.floor((e.clientX/ZOOM+camX)/TILE);mouseGY=Math.floor((e.clientY/ZOOM+camY)/TILE);
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchD>0){setZoom(ZOOM*d/pinchD,(a.x+b.x)/2,(a.y+b.y)/2);}pinchD=d;return;}
  if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>4){dragMoved=true;if(hero)hero.follow=false;}if(dragMoved){camX-=dx/ZOOM;camY-=dy/ZOOM;clampCam();}lastX=e.clientX;lastY=e.clientY;}});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size>0){pinchD=0;return;}dragging=false;cv.classList.remove('drag');}
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerup',e=>{const wasDrag=dragMoved;endPtr(e);if(ptrs.size>0||wasDrag||!started||S.over)return;
  const wx=e.clientX/ZOOM+camX,wy=e.clientY/ZOOM+camY;const gx=Math.floor(wx/TILE),gy=Math.floor(wy/TILE);
  if(placing){tryPlace(gx,gy);return;}
  const ct=workers.find(w=>w.contact&&Math.hypot(w.x-wx,(w.y-8*AP)-wy)<26);
  if(ct){const c=ct.contact;goTo(ct.x+18,ct.y+4,()=>openContact(c));return;}
  const b=buildingAt(gx,gy);
  if(b){const [fx,fy]=bFront(b);if(b.co)goTo(fx,fy,()=>openCompany(b.co));else if(b.rv)goTo(fx,fy,()=>openRival(b.rv));else if(b.sede)goTo(fx,fy,openSede);return;}
  if(hero){hero.tx=wx;hero.ty=wy;hero.onArrive=null;hero.follow=false;}});
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(ZOOM*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY);},{passive:false});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(!started)return;
  if(e.key==='Escape'){closeModal();placing=null;document.getElementById('tray').classList.remove('on');}
  else if(e.key===' '){e.preventDefault();setSpeed(S.speed?0:1);}
  else if(e.key==='1')setSpeed(1);else if(e.key==='2')setSpeed(2);else if(e.key==='3')setSpeed(4);
  else if(e.key==='+'||e.key==='=')setZoom(ZOOM*1.2);else if(e.key==='-')setZoom(ZOOM/1.2);});
function setSpeed(s){S.speed=s;refreshHUD();if(s===0)showHint('⏸ Pausado');}
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
document.getElementById('heroBtn').onclick=()=>{if(hero){hero.follow=true;centerOnHero();}};

/* ============================ BOOT ============================ */
function beginPlay(){started=true;document.getElementById('start').classList.add('off');centerOnHero();buildToolbar();checkPhase();refreshHUD();refreshObj();saveLocal();
  setTimeout(()=>showHint('👤 VOCÊ é o anel dourado. Toque no chão p/ andar · toque num prédio p/ ir até ele · ⭐ Sede = freelas e banco.'),400);}
async function boot(){genWorld();centerCam();buildToolbar();bakeAllBuildingSprites();requestAnimationFrame(loop);
  const local=readLocal();const st=document.getElementById('start');const nameIn=document.getElementById('nameIn');
  if(local&&local.S&&local.S.name)nameIn.value=local.S.name;
  const cont=document.getElementById('btnCont');cont.style.display=local&&!(local.S&&local.S.over)?'':'none';
  const netLine=document.getElementById('startNet');netLine.textContent=MP.configured()?'Conectando ao servidor…':'Modo offline (servidor multiplayer não configurado). O jogo salva neste aparelho.';
  const mpReady=MP.configured()?MP.start():Promise.resolve();
  mpReady.then(()=>{netLine.textContent=MP.on?'🟢 Online — seu império fica salvo na nuvem e seus amigos te veem.':'⚪ '+MP.status+' — salvando só neste aparelho.';});
  const getName=()=>{const v=(nameIn.value||'').trim().slice(0,24);if(v.length<2){toast('Digite um nome (2+ letras)');return null;}return v;};
  cont.onclick=async()=>{const nm=getName();if(!nm)return;await mpReady;let d=local;if(MP.on){const cloud=await MP.loadCloud();if(cloud&&(!d||(cloud.savedAt||0)>(d.savedAt||0)))d=cloud;}
    loadGame(d);S.name=nm;beginPlay();MP.sync();};
  const startNew=async(nm)=>{await mpReady;
    if(!local&&MP.on){const cloud=await MP.loadCloud();if(cloud&&cloud.S&&!cloud.S.over){loadGame(cloud);S.name=nm;beginPlay();toast('☁️ Save da nuvem carregado');return;}}
    newGame(nm);beginPlay();MP.sync();MP.news(nm+' acabou de chegar em Meridian.');};
  document.getElementById('btnNew').onclick=()=>{const nm=getName();if(!nm)return;
    if(local&&!(local.S&&local.S.over)){modal('⚠️','Começar um novo império?','<p>O save atual deste aparelho (dia '+((local.S&&local.S.day)||1)+') será substituído.</p>',[{t:'Sim, começar do zero',fn:()=>{closeModal();startNew(nm);}},{t:'Cancelar',fn:closeModal}]);return;}
    startNew(nm);};
  void st;}
boot();
window.__townReady=true;
</script>
